 IRQ_Poverty_problem: "The Issue of Poverty"
 IRQ_Poverty_problem_desc: "The feudal lords, such as tribal chiefs, aristocrats, and clerical landowners, made life difficult for the average Iraqi in rural areas, from the Jazirah to Al Muntafiq, especially in the marshlands. They made immigration to cities nearly impossible by using threats or spreading misinformation about urban life. These feudalists would do anything in their power to keep the average peasant working for them until death, paying only enough to sustain the peasant and his family, which meant they couldn't afford any education more than Katateeb. This situation also made it harder for the central government to provide a dignified living for all its citizens. Additionally, the 1929 economic crash and depression worsened the already significant poverty issue, affecting all the cities and causing a rise in unemployment."
