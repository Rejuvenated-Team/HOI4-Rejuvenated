 iraq_flavour.6.d: "Emir Saud, the son of King Abdulaziz of Saudi Arabia, has arrived in Baghdad to meet with Iraqi government officials. Saud belongs to Al Saud dynasty, which, in 1926, overthrew the uncle of King Ghazi, King Ali of Hejaz and ended Ghazi's grandfather's ambition of creating a united Hashemite Arab kingdom."
