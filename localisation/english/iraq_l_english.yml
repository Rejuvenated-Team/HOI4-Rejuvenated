 IRQ_establish_the_national_baath_party_desc: "The National Ba'ath (Renaissance) Party is a political movement led by Sami Shawkat, the brother of Saib Shawkat. It is mostly a nationalist, anti-socialist, and traditionalist political organization that opposes some of Saib's movement ideals like women rights and social welfare. However, it is not the same as the Arab Ba'ath Party based in Syria, which embraces a nationalist, socialist, and progressive ideology."
