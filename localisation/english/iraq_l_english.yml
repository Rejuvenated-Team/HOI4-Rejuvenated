 iraq_flavour.10.t: "Government buys a Yacht"
 iraq_flavour.10.d: "The steam yacht Sans Peur, formerly owned by the Earl of Sutherland and has been purchased by the Iraq government and is being fitted out at Southampton as a cable layer and it will be armed. The yacht being fitted out at Southampton docks and will be sent to Iraq as soon as possible." 
