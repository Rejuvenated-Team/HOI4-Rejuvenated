 iraq.100.t: "Restoration of Babylonia"
 iraq.100.desc: "With the [From.GetOldAdjective] conquest of most of what constitutes Babylonia, the government has seized upon a renewed wave of Mesopotamianism spreading through the nation. As international disagreements have been 'solved' through the outright removal of obstinate foreign governments through military means, Babylonian restoration has seemed within easy reach, and the [From.GetOldAdjective] government has already shown its willingness to pursue this goal.\n\nWhether merely to 'ride the wave' of this public goodwill, or simply to facilitate regional integration, [From.GetOldAdjective] officials have now confirmed that the nation's official name shall be changed to '[From.GetNameDef]'."
 iraq.100.a: "I thought the day will never come"

 iraq.101.t: "Civil War!"
 iraq.101.desc: "Armed Nationalists take to the streets all over Egypt. The British Military and police actions against the uprising have proven unsuccessful thus far. This armed insurrection has come in the wake of a sudden rise in Nationalist sentiment, which now means we are in an all out civil war."
 iraq.101.a: "Resist the nationalist scum!"
 iraq.101.b: "Join the uprising!"

 iraq.106.t: "Establishment of the Mashriq"
 iraq.106.desc: "With the [From.GetOldAdjective] liberation of most of what constitutes the Mashriq, the government has seized upon a renewed wave of Mashriqism spreading through the nation. As international disagreements have been 'solved' through the outright removal of obstinate foreign governments through military means, the Mashriq establishment has seemed within easy reach, and the [From.GetOldAdjective] government has already shown its willingness to pursue this goal.\n\nWhether merely to 'ride the wave' of this public goodwill, or simply to facilitate regional integration, [From.GetOldAdjective] officials have now confirmed that the nation's official name shall be changed to '[From.GetNameDef]'."
 iraq.106.a: "Workers of the World Unites"

