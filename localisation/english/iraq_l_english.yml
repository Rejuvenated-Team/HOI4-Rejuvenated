 iraq_lore.1.t: "Ottoman Iraq"
 iraq_lore.1.d: "The Safavids defeated the Turkomans, who ruled over Iraq after the fall of the Jalayirid. Iraq came under Safavid control for a brief period starting in 1508. However, they began to gradually lose control over Iraq from 1514 after their defeat by the Ottomans at the Battle of Chaldiran, eventually losing of Iraq by 1533.\n The Ottomans ruled Iraq and divided it into three provinces; Basra, Mosul, and Baghdad which served as the center, being the former capital of the Caliphate. By the 17th century, repeated conflicts with the Safavids and the Europeans drained the strength of the Ottomans and weakened their control over Iraq. As a result, from 1747 to 1831, Iraq was governed by Circassian Mamluks who got British support and managed to secure autonomy from the Sublime Porte, suppressed tribal revolts, restored order, and initiated a program to modernize the economy and military. In 1831, the Ottomans successfully overthrew the Mamluk administration under Dawud Pasha and reimposed direct control over Iraq.\n\n Following the deposition of Dawud Pasha, the Ottomans faced revolts and riots across Iraq, most notably the Al Saadon Tribal Revolt and the uprising led by Mufti Abdul Ghani Al Jamil in Baghdad in 1832. These uprisings nearly overthrew Ottoman rule, but Ali Reza Pasha managed to suppress them. He introduced some reforms and lifted restrictions on Shias, but his successors were either unimpressive or corrupt.\nIt was not until Medhat Pasha that improvements were made. He allowed newspapers, initiated reforms, and developed Baghdad and agriculture. However, his term was short, and subsequent governors were also unimpressive and corrupt. In the later decades, Germans began developing Iraqi roads and railways to create the so called Baghdad-Berlin Railway, which significantly improved infrastructure in Iraq.\n\n In the years following 1909 and the introduction of the Ottoman Constitution, more reformist governors were appointed, including Hussein Nazim Pasha, Mehmed Zeki Paşa and Iraq's own Mahmud Şevket Pasha. They implemented reforms in administration and modernized the army, increased spending on infrastructure, and promoted agricultural modernization. During this period, radicalism also began to sweep through Iraq, influenced by political liberalism and socialism. This shift eventually led to decadence in the form of tabloid journalism, yellow press, and the opening of strip clubs and bars, which angered the conservative population of Iraq and especially the Shia clergy."
 iraq_lore.1.a: "Tell me more"
 iraq_lore.1.b: "fine"

 iraq_lore.2.t: "The Great War"
 iraq_lore.2.d: "The British Empire's interests in Iraq were driven by several factors. Strategically, controlling the region was essential for securing the route to India. The discovery of oil in the region further heightened its strategic importance. The campaign began in November of 1914, with the British aiming to secure Basra, a key port city.\n The initial phase of the campaign saw British forces advancing up the Tigris River. Early successes included the capture of Basra and other key positions, as the Ottoman military command had underestimated British power and only kept a small force of about 360 soldiers and four cannons to protect the city.\n\n One of the most notable events of the Mesopotamian Campaign was the Siege of Al Kut. British forces, led by Major General Townshend, attempted to capture the town as part of the strategy to advance on Baghdad. During the siege, British forces, encircled by Ottoman troops, faced severe shortages of supplies and disease. After months of relentless Ottoman pressure and deteriorating conditions, Townshend and his men were forced to surrender in April 1916.\n\n Following the setback at Al Kut, the British launched a series of reinforcements and strategic revisions. General Sir Stanley Maude was appointed to lead the renewed efforts in the region. Meanwhile, Enver Pasha ordered most of the troops defending Baghdad and fighting in Iran to leave and focus on other fronts. The Ottomans, betrayed by their own government, were weakened and demoralized. They struggled to mount an effective defense and eventually surrendered and Ottoman authorities evacuated the city, which the British subsequently occupied. General Maude proclaimed to the Iraqis, 'Our armies do not come into your cities and lands as conquerors or enemies, but as liberators.'\n The final phase of the campaign saw continued British advances and General Maude died by contracting cholera by drinking unboild milk. By 1918, British forces had pushed further into northern Mesopotamia, consolidating their control over the region.\n\n The Ottomans committed atrocities against their Christian minorities, including the Armenians and Assyrians, causing immense suffering and forcing many to flee their homes and move to Iraq and Syria. This migration created a brief refugee and economic crisis. However, many of these refugees eventually became integral parts of Iraqi society and state. Nevertheless, some groups, such as the Assyrian Church and nationalist factions, sought their own state, which led to further complications with the newly emerging Iraqi State."
 iraq_lore.2.a: "Tell me more"
 iraq_lore.2.b: "Let me play"

 iraq_lore.3.t: "The 1920 Iraqi Revolt"
 iraq_lore.3.d: "Remember what General Maude said; it was a complete lie. The San Remo Conference decided that the Ottoman regions of Palestine, Syria, and Mesopotamia would become mandates under European powers, without consulting or gaining approval from the local populations. Driven primarily by imperialism and Zionism, this decision has plagued the Middle East to this day and exposed Europe's true intentions to the people they claimed to 'liberate' and 'civilize'. The French were given Syria and The British were to establish mandates in Palestine and in the three Iraqi states. However, many Iraqi tribes and high-ranking officers from the former Ottoman and Sharifian Armies opposed this mandate. They demanded full independence from the British and, in some cases, advocated for unity with Faisal's Arab state.\n As a result, the 1920 revolt erupted after the Iraqi National Congress decided that armed resistance was necessary. For nearly a year, Iraqi tribes in the south and north with intellectuals in cities launched a full-scale rebellion. They freed political leaders from prisons, killed European administrators and civilians, seized cannons, sank ships in rivers, set fire to restaurants and bars, boycotted British and Indian goods, and ambushed British supply lines, exhausting British forces, leading to atrocities against rebellious and innocent Iraqi villages. The British employed aerial bombing and summary executions for years after the revolt has even ended. This brutality led many within the RAF, such as Lionel Charlton, to refuse participating in these heinous acts.\n Although the British managed to suppress the revolt militarily, they had to compromise to maintain control. The first Iraqi government, led by Abdul Rahman Al Kaylani, was established, but it was considered illegitimate due to the lack of a king and a parliamentary system. This led to ongoing protests and opposition, particularly from the clergy. Furthermore, the British proposals for king, that including Şehzade Mehmed Burhaneddin, Aga Khan II, Sheikh Khazal, Ghulam Reza Khan, Abdul Hadi Al Umari, Talib Al Naquib, and even Al Kaylani himself.\n\n The Iraqi government and National Congress rejected all British proposals for a king due to various reasons related to sect, race, or political position within Iraq. The Congress decided to propose one of Sharif Hussein's sons, Abdullah, but to them he was less popular than his brother Faisal so Hussien refused the Iraqi request. Consequently, they reached out directly to Faisal, who had recently lost Syria, and asked him to rule Iraq. Faisal was initially reluctant because of his haterd for the British and his desire not to be used as a tool for their interests again. However, Nuri Al Said persuaded him that they could work together against the British. Faisal agreed, and despite initial British refusal, they conceded under the threat of another revolt, and Faisal was crowned king in 1921."
 iraq_lore.3.a: "Tell me more"
 iraq_lore.3.b: "Let me play already"

 iraq_lore.4.t: "Establishment of the Modern Iraqi State"
 iraq_lore.4.d: "The First Iraqi Assembly was elected in 1924 and drafted the constitution, known as 'The Organic Law.' Although the draft committee attempted to give absolute power to the king, the monarchy was established as constitutional. The parliament was designed to be bicameral, consisting of the House of Representatives and the Senate. However, before the constitution could be enacted, the assembly was pressured into signing the Anglo-Iraqi Treaty. This was done after the British threatened to grant Mosul to Turkey and the high commissioner dissolving the assembly, declaring martial law, and potentially removing King Faisal. The signing of the treaty under duress led to increased popular resistance, including acts of terror such as arson and bombings against British soldiers and civilians. The year 1926 became known as the 'Year of Fire' due to these violent incidents.\n In 1925, the British, who had previously supported Sheikh Khazal as their man in the Gulf, shifted their support to Iran and aided in his kidnapping. This change occurred after Reza Khan demonstrated Iran's potential for reform and modernization, especially after he deposed the Qajars. The British rewarded Reza Khan by supporting his control over the Al Muhammarah sheikhdom, in exchange for not establishing a republic in Iran and maintaining distance from the Soviets.\n\n Following the election of the first parliament in 1925, political parties were formally registered. Various parties emerged, including liberal ones like the National Party led by Jafar Abu Al Timman, conservative parties like the Progress Party under Abdul Muhsen Al Sadoon and the Covenant (Ahd) Party led by Nuri Al Said, and nationalist parties such as the National Brotherhood Party led by Yasin Al Hashimi. There were also numerous fringe parties, mostly agrarian and nationalist, with some socialist factions within major parties, such as the National Party's own Ahali Group led by Kamel Al Chaderchi and Muhammad Hadid. And lets not forget the Communist Party, initially established as a study club in 1926, was officially formed as a party in 1934.\n\n The 1929 economic depression hit the economy hard, causing poverty in rural areas to skyrocket. This made the task of modernizing or developing these areas even more difficult and forced Iraqis to focus more on the oil industry to keep the economy afloat. However, despite these challenges, Iraq was not hit as hard as most European countries and Egypt, largely thanks to Sassoon Heskel and his efforts that persuaded the British to start selling Iraqi oil and deliver Iraq's share only in gold pounds."
 iraq_lore.4.a: "Tell me more"
 iraq_lore.4.b: "I said Let me play"

 iraq_lore.5.t: "Independence?"
 iraq_lore.5.d: "Following intense negotiations between Iraqi and British officials over the renewal of the Anglo-Iraqi Treaty, political unrest erupted in Iraq, splitting the political scene into two major factions; the gradual independence advocates led by Nuri Al Said and his Ahd Party, and the swift independence faction led by Yasin Al Hashimi and his Ikha'a Party. Despite the League of Nations' recommendation to end the mandate in 1950—a suggestion many Iraqis considered absurd—the British agreed to end their mandate in 1930. However, opposition letters from the Assyrian Church and Zionist organizations to the British high commissioner led to the mandate being extended by two more years. This decision angered many Iraqis, resulting in widespread protests and In 1931, a major strike halted the flow of goods and led to a widespread boycott of the British. The situation escalated almost to the point of revolution when British soldiers attempted to coerce supplies into the camps. Finally, in 1932, Iraq was granted independence after 3000 Christian households protested, arguing that the Assyrian Pope did not represent them. This led to the resignation of the entire Assyrian levy, which had been created by Britain to control the north. The levy then formed Assyrian militias that, under British protection, attacked Kurdish and Arab villages in an organized manner, leading to numerous conspiracy theories within Kurdish and military politics. The militias eventually escaped to Syria.\n\n Before Iraq was officially recognized as an independent state by the League of Nations, Iraqi army members, particularly Kurds and Mosul Arab tribes led by General Bakr-Sidqi, carried out massacres against innocent Assyrian villagers. These acts followed some armed Assyrian militants crossed the border from French Syria, whom the French refused to allow them in Syria. The massacres were mostly revenge for earlier attacks by the militias and also motivated by the 1930 Assyrian letter. These actions, ordered by Rashid Ali Al Kaylani and his associates without the King's or Parliament's approval or even knowledge, were a significant crisis. King Faisal subsequently dismissed Al Kaylani who acted without the knowledge or approval of King and Parliament, but this didn't impact the League's resolution. Independence was ratified on October 3rd of that year and was celebrated across Iraq and the Arab world as a sign of hope and liberation.\n Following independence, the Iraqi government, driven by a desire for revenge against Zionists, closed and banned their organizations, exiled their leaders, and launched a mass anti-Zionist curriculum in Jewish schools. Schools that refused to comply were shut down.\n\n Faisal died in 1933 and was succeeded by his young son Ghazi, who had just finished military school and had strong ties to nationalists and the military. Ghazi's early reign saw major reforms and development, but Sunni dominance in the government continued and later incited the 1935-1936 Shia Intifada, which demands more reforms and greater Shia representation in government."
 iraq_lore.5.a: "Finally you finsihed"
 iraq_lore.5.b: "I am bored, I will press the shiny red button!"

