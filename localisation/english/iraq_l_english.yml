 IRQ_Ghazi: "King Ghazi"
 IRQ_Ghazi_desc: "Ghazi bin Faisal bin Hussein Al Hashimi is the second King of Iraq, succeeding his father, King Faisal—the hero of the Arab Revolt, the former King of Syria, and the father of the Iraqi nation who secured its independence from the British. Ghazi has been king since 1933, following his father's death, and he has big shoes to fill. Under his government, many factories, dams, and roads have been built. However, in terms of liberation and Arab unity, the British still control the Iraqi economy and neighboring Arab countries. Will Ghazi overcome the British Empire and liberate Arabia, or will he fade into the history books?"
 IRQ_faisal: "King Faisal II"
 IRQ_faisal_desc: "Following his father's death, Faisal II was legally proclaimed King of Iraq, but he has yet to assume the throne. His uncle, Abdulilah, serves as regent until May 1952."
 IRQ_anglo_iraqi_treaties: "Anglo-Iraqi Treaties"
 IRQ_anglo_iraqi_treaties_desc: "Since the establishment of the Iraqi parliament and the drafting of the constitution, the British Empire has strong-armed Iraq into signing and renewing the Anglo-Iraqi Treaty, which grants the British significant economic leverage and military privileges. Even after Iraq's independence, the British continue to enforce the terms of the treaty."

 IRQ_shia_issue: "Marginalized Shia Population"
 IRQ_shia_issue_desc: "The Shias are the majority of the population and control the economy, agriculture, and cultural life. However, the British and Mosulian elites have ensured that the Sunni population remains in charge of politics and the military, which has left the Shia population politically marginalized and without a real deterrent against the government.\n\n King Faisal I said: 'Iraq is a state ruled by a Sunni Arab government, founded on the ruins of the Ottoman administration. This government oversees a Kurdish region, the majority of which is illiterate, and includes individuals with personal ambitions. Additionally, there is an illiterate Shia majority, ethnically and linguistically affiliated with the government. However, the persecutions they endured under Turkish rule, which excluded them from participation in governance and failed to train them for it, have created a deep divide among the Arab population, split between these two sects. Unfortunately, this has led to a situation where the majority, particularly those with religious ambitions and job seekers without merit, who did not materially benefit from the new managment, continue to feel persecuted simply for being Shias.'"
 IRQ_kurdish_issue: "Kurdish Separatism"
 IRQ_kurdish_issue_desc: "The Kurdish lands were given to Iraq primarily because the Sunni Arab population wanted to balance their numbers against the Shia majority. Additionally, the British sought to include Kurdistan within Iraq to serve as a natural mountainous barrier against Turkey. They also aimed to create ethnic tensions between Arabs and Kurds, which would facilitate a 'divide and conquer' approach to control Iraq. However, this does not negate the Kurds' legitimate right to self-determination and independence."
 IRQ_agricultural_economy: "Agricultural Economy"
 IRQ_agricultural_economy_desc: "Despite Iraq having a sizable merchant population, a growing industry, and large quantities of oil already discovered with more yet to be found, the economy remains firmly rooted in agriculture. Most of the population works in the fields and is subject to feudal tribal lords imposed by the Ottoman state. These lords pose significant challenges to the newly founded Iraqi state, which cannot easily remove them, especially as the peasant population sometimes defends their feudal lords, who are often the leaders of their tribe or members of the clergy."

 IRQ_Tribal_and_aristocratic_influence1_idea: "Tribal Aristocratic Influence - §RHigh§!"
 IRQ_Tribal_and_aristocratic_influence1_idea_desc: "Arab and Kurd Tribal Chiefs, Landowning Clerics and former Ottoman aristocrats wield immense influence over the lives of many Iraqis, with power that is vast and largely uncontested. Even the British Empire, with all its might, could not tame them and was forced to collaborate with these local powers. The model of Ottoman feudalism, one of the most resilient and perilous systems, persisted even without the oversight of an Ottoman Sultan, leaving these powerful oligarchs without a higher authority to answer to other than God. Neither the King nor the government could handle them, as those Oligarchs views both as irrelevant compared to their own authority. These aristocrats have peasant armies ready to fight for them, driven by tribal relations, clerical influence, or simply loyalty, making any effort to dismantle their power without triggering bloodshed extremely challenging."
 IRQ_Tribal_and_aristocratic_influence2_idea: "Tribal Aristocratic Influence - §LModerate§!"
 IRQ_Tribal_and_aristocratic_influence2_idea_desc: "Arab and Kurd Tribal Chiefs, Landowning Clerics and former Ottoman aristocrats wield immense influence over the lives of many Iraqis, with power that is vast and largely uncontested. Even the British Empire, with all its might, could not tame them and was forced to collaborate with these local powers. The model of Ottoman feudalism, one of the most resilient and perilous systems, persisted even without the oversight of an Ottoman Sultan, leaving these powerful oligarchs without a higher authority to answer to other than God. Neither the King nor the government could handle them, as those Oligarchs views both as irrelevant compared to their own authority. These aristocrats have peasant armies ready to fight for them, driven by tribal relations, clerical influence, or simply loyalty, making any effort to dismantle their power without triggering bloodshed extremely challenging."
 IRQ_Tribal_and_aristocratic_influence3_idea: "Tribal Aristocratic Influence - §GLow§!"
 IRQ_Tribal_and_aristocratic_influence3_idea_desc: "Arab and Kurd Tribal Chiefs, Landowning Clerics and former Ottoman aristocrats wield immense influence over the lives of many Iraqis, with power that is vast and largely uncontested. Even the British Empire, with all its might, could not tame them and was forced to collaborate with these local powers. The model of Ottoman feudalism, one of the most resilient and perilous systems, persisted even without the oversight of an Ottoman Sultan, leaving these powerful oligarchs without a higher authority to answer to other than God. Neither the King nor the government could handle them, as those Oligarchs views both as irrelevant compared to their own authority. These aristocrats have peasant armies ready to fight for them, driven by tribal relations, clerical influence, or simply loyalty, making any effort to dismantle their power without triggering bloodshed extremely challenging."
