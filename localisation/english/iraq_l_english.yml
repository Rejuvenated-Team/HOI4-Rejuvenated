 iraq_flavour.7.t: "Anti-Partition Protest"
 iraq_flavour.7.d: "Protesters fill the streets of Baghdad, Basra, Karbala, Najaf and Mosul waving banners and daggers, demonstrating against the British Peel Royal Commission's plan for partitioning Palestine."
 iraq_flavour.7.a: "Hurriyah"
 iraq_flavour.8.t: "Basra Airport Opened"
 iraq_flavour.8.d1: "[IRQ.GetLeader] opened the new Basra airport, claimed to be the finest in the east and one of the greatest airports of the modern world. It has the latest modern facilities for landing seaplanes and land planes day and night. The opening ceremony was attended by about 700 guests. The newly opened airport , seen from the landing ground, after being opened in Basra."
 iraq_flavour.8.d2: "King Ghazi opened the new Basra airport, claimed to be the finest in the east and one of the greatest airports of the modern world. It has the latest modern facilities for landing seaplanes and land planes day and night. The opening ceremony was attended by about 700 guests. The newly opened airport , seen from the landing ground, after being opened in Basra."
 iraq_flavour.8.a: "Hurrah"
 iraq_flavour.9.t: "Turkish Army Manoeuvres"
 iraq_flavour.9.d: "Large-scale Turkish Army manoeuvres in which motorized units recently introduced were seen in action by President Kemal Ataturk and members of the government, are now finished. The President himself is analyzing the results with close attention. It was to these manoeuvres that Bakr Sidqi was travelling when he was shot. Mechanized united added to the Turkish army, drawn up ready for exercises during the manoeuvres."
