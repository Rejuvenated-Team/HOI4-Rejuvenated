 iraq.18.t: "Foreign Investments"
 iraq.18.d: "Our people have some knowledge of military industry, primarily in shipbuilding, oil extraction, electricity production, and, to some extent, aircraft manufacturing. However, we face challenges in tank and weapon development, as the Department of Military Technology has not yet succeeded in creating a fully Iraqi-designed tank or weapon. The Akad Tank is still in the early planning stages and likely won't be ready for service until the 1950s. Realistically, we should seek the assistance of a greater power—mainly the German Reich, the British Empire, or the United States—in the hope that one of them will help us develop the tank and assist in its production. If they do not, we will have to turn to the Soviet Union as a last resort."
