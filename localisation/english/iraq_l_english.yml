 #bookmarks
 rj_IRQ_GATHERING_STORM_DESC: "In 1920, following the Great Iraqi Revolt, the British were compelled to establish Iraq as a mandate rather than a colony like the Raj. They were also forced to accept Faisal bin Hussein as King of Iraq, even though he was not originally on their list of preferred candidates. With the support of political leaders, Faisal ushered in a new era of constitutional monarchy and statehood that Iraqis had not experienced in nearly eight centuries. In 1932, Iraq became the first Arab country to declare independence and join the League of Nations. However, its oil production remained under the control of its former colonial overlords."
 rj_IRQ_BLITZKRIEG_DESC: "In 1936, the cabinet of Yasin Al Hashimi was overthrown in the first military coup since the establishment of the modren Iraqi state, the coup failed but lead to the establishment of a royal dictatorshuip. Iraq must navigate a rapidly changing world where great powers threaten the fragile peace that has been held since the end of the Great War. \n\nWhat is the more prominent threat? The gathering storm in Europe? Their very own neighbors? Or themselves? Iraq will have to stand its ground and cement its place on the world stage."

