 KUR_promote_kurdish_culture: "Promote Kurdish Identity"
 KUR_promote_kurdish_culture_desc: "The Kurdish people are dispersed across multiple nations, but our culture binds us together regardless of where we live. We must promote and protect that heritage before it is dismantled by those who govern us."
 KUR_kurdish_democratic: "Kurdistan Democratic Party"
 KUR_kurdish_democratic_desc: "Kurdish rights are being trampled on everyday by the Arab majority of [IRQ.GetNameDef]. It is time we established our own political movement with the objective of securing a free and independent nation for our people."
 KUR_kurdish_socialist: "Seek Soviet Aid"
 KUR_kurdish_socialist_desc: "[SOU.GetNameDefCap] longs for a means to undermine western domination of the Middle East. Perhaps they would be receptive to aiding us in our struggle against the [IRQ.GetAdjective] government, and by extension the [ENG.GetAdjective]."
 KUR_kurdish_revolt: "Declare Independence"
 KUR_kurdish_revolt_desc: "The moment has come to declare our independence from [IRQ.GetNonIdeologyName] and to create a truly free nation for the Kurdish people."
 KUR_kurdish_revolt_tt: "We will declare independence from the §YIraqi State§!, leading us into a §RWar of Independence§! against them."
 KUR_kurdish_language: "Kurdish Language Schools"
 KUR_kurdish_language_desc: "With our new found independence, we can finally begin creating an education system that is centered around Kurdish culture and language."
 KUR_kurdish_industry: "Expand Industrial Base"
 KUR_kurdish_industry_desc: "To prevent ourselves being swallowed up by our stronger neighbors, we must develop an industrial base of our own. "
 KUR_kurdish_oil: "Kurdish Oil"
 KUR_kurdish_oil_desc: "Oil deposits have been tapped in recent years across our territory, but the wealth they generated was siphoned away from the area. Now we may finally establish our own oil industry and use the wealth for our own people."
 KUR_kurdish_form_the_peshmerga: "Form the Peshmerga"
 KUR_kurdish_form_the_peshmerga_desc: "While our rebellion was successful in crushing the Iraqi military, it may not be so lucky in future. We shall therefore establish a national army with real military training and modern equipment to deter a potential conflict from even occurring."
 KUR_kurdish_women_in_military: "Women in the Military"
 KUR_kurdish_women_in_military_desc: "The antiquated view that women must be kept away from conflict must be eliminated if we are to develop a robust military capable of standing up to our neighbors."
 KUR_kurdish_support_resistance: "Support Resistance Abroad"
 KUR_kurdish_support_resistance_desc: "While the people within our borders enjoy true freedom, there remain far too many of our siblings trapped under the rule of foreign powers. We must support them in their attempts to break free."
 KUR_kurdish_reject_ankara_treaty: "Reject Ankara Treaty"
 KUR_kurdish_reject_ankara_treaty_desc: "The treaty of Ankara destroyed earlier attempts at establishing a nation for the Kurdish people. We must make clear to the world that we reject the borders established by that treaty and that we will not rest until the Kurdish people are united."
 KUR_kurdish_attack_turkey: "Liberate Kurds of Turkey"
 KUR_kurdish_attack_turkey_desc: "The [TUR.GetAdjective] actively opposes the Kurdish people within their borders, robbing them of their heritage. This can no longer be tolerated, even if it means liberating our people by force."
 KUR_kurdish_attack_iran: "Liberate Kurds of Iran"
 KUR_kurdish_attack_iran_desc: "The [PER.GetAdjective] regime is a threat to our people. Only through the forceful liberation of the Kurds within their borders and the defeat of the [PER.GetAdjective] military by our hands can we secure a future for our people."
 KUR_kurdish_united: "United Kurdistan"
 KUR_kurdish_united_desc: "Through great hardship and struggle, we have finally united the Kurdish people under our rule. No matter what comes now, we stand as one united people."

#ideology
 corporatocracy: "Corporatocracy"
 corporatocracy_desc: "Corporatocracies are regimes completely controlled by major companies, monopolies, or other large business ventures. Corporatocratic regimes value profit above all, and are known to have little regard for anything besides making a quick buck, though the level or even presence of ruthlessness can vary. Workers rights in these regimes are known to be usually abysmal, as any force that could potentially harm their bottom line is stamped out as soon as they make themselves known, frequently with extreme force."
#decisions
 IRQ_revolution: "The People's Revolution"
 IRQ_revolution_desc: "The proletariat in our country has become more vocal as of late. Localized uprisings are bringing unrest making for a great opportunity for more radical political change."
 IRQ_imminent_proletarian_revolution_mission: "Imminent Revolution"

 iraq.96.t: "Gulbenkian sour over Iraqi Oil"
 iraq.96.d: "In 1928, after the discovery of oil at Baba Gurgur, Calouste Gulbenkian drew a red line on the map of the Middle East and urged the participants to formalize the corporate structure of the Turkish Petroleum Company (TPC) and implement a 'self-denial clause' which barred any participants from independently pursuing oil interests in former Ottoman territories. After Iraq gained independence it became a participant and Iraq has now nationalized its oil industry, which is a violation of the agreement and the 'Red Line' cartel. Gulbenkian, viewing this as a breach, proposed a plan for retaliation, he just asks for assistance from the RAF and the British Embassy to put it in effect."
 iraq.96.a: "We gave up, he should too"
 iraq.96.b: "The sun never sets on the Empire"
 iraq.97.t: "Gulbenkian demands De-Nationalization"
 iraq.97.d: "In 1928, after the discovery of oil at Baba Gurgur, Calouste Gulbenkian drew a red line on the map of the Middle East and urged the participants to formalize the corporate structure of the Turkish Petroleum Company (TPC) and implement a 'self-denial clause' which barred any participants from independently pursuing oil interests in former Ottoman territories.\n\n Now Gulbenkian and his European friends alongside the entire RAF in Iraq and British Embassy regiment demand that the old oil agreements be restored or else..."
 iraq.97.a: "Ok"
 iraq.97.b: "What if we say no"
 iraq.97.c: "What if we say no (Play as Gulbenkian)"


