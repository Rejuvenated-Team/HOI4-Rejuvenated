 iraq.23.t: "A meeting in Rome"
 iraq.23.d: "Al Gaylani and his entourage met with German and Italian officials in Rome to negotiate an Iraqi-Italian treaty in anticipation of an Axis victory over Britain. The key terms discussed included Germany and Italy giving Iraq 40 billion liras, ceding Syria, Jordan and Kuwait to Iraq, withdrawing recognition of Saudi Arabia and supporting Hashemite claims to the Hejaz. In exchange, Germany would take Syrian ports and secure a 20-year lease for them, full control on Iraqi oil production, while Italy would be granted unrestricted passage through Iraqi territory to protect Christian communities."
 iraq.23.a: "I don't see an issue with this"
 iraq.23.b: "Are you nuts?"
 iraq.24.t: "Rustam Haidar Assassinated!"
 iraq.24.d: "Iraqi-Lebanese Finance Minister and former aide to King Faisal I, Rustam Haidar, was fatally shot in Baghdad on the morning of January 18th while en route to his office in the Finance Ministry. The assailant, Hussien Fawzi Tawfiq, a dismissed police officer, is believed to have acted due to a mix of tribal, sectarian, or political motives but his real motive is still vague especially after he confessed to the crime. His actions may have been influenced by the rhetoric of General Hussien Fawzi Hassan Al Anzi, who has been vocal in his criticism of the Al Said government. In response to the assassination, Nuri Al Said is likely to use this event as a pretext to tighten control over his opponents in parliament and the media."
 iraq.24.a: "Oh no"
 iraq.25.t: "Nuri Al Said appointed Prime Minister!"
 iraq.25.d: "Nuri Al Said has been the driving force behind most of Iraq's political and economic decisions, playing a key role in keeping the country under royal control for years. Although he had only served as prime minister once, he was effectively running each cabinet behind the scenes since his first appointment. Now, in the wake of the turmoil caused by Bakr Sidqi's coup and subsequent death, Nuri has been appointed prime minister for the second time. The question remains; will he be able to restore stability to Iraq, or will he continue to maintain the old status quo?"
 iraq.25.a: "Oh no"
 iraq.26.t: "The Saidian Cabinet Resigns!"
 iraq.26.d: "Nuri Al Said's fifth cabinet has resigned following the unrest triggered by Rustam Haidar's assassination. Opposition to Nuri Al Said and his relatively liberal and pragmatic faction, which attempts to balance nationalism with geopolitical concerns, has intensified. This approach has long been disliked by the nationalist faction led by Rashid Ali Al Gaylani. In an effort to appease growing nationalist sentiment in the country, the Regent will appoint Rashid Ali Al Gaylani to form a new cabinet. But anyways Nuri will be the one pulling the strings from behind the scenes like he always does."
 iraq.26.a: "Oh no"
 iraq.27.t: "England has Fallen!"
 iraq.27.d: ""
 iraq.27.a: "Long Live Iraq"

#flavour events
 iraq_flavour.1.t: "Death of Al Zahawi"
 iraq_flavour.1.d: "The great reformist and modern poet, and one of the leading writers in the Arab world, Jameel Sidqi Al Zahawi, has died peacefully at his home at the age of 72. He will be buried at the entrance to the Al Khayzuran Cemetery in Al Adhamiya, and his funeral will be attended by prominent figures in Iraqi society, such as Marouf Al Rasafi and Muhammad Reza Al Shibibi. However, his nephew, Sheikh Amjad Al Zahawi, will not attend, as he strongly disagrees with his uncle's views on women's rights and his criticism of Salafi Islam."
 iraq_flavour.1.a: "RIP"

 iraq_flavour.2.t: "Eid Al Adha"
 iraq_flavour.2.d: "Eid Al Adha, also known as the 'Festival of Sacrifice,' is an important Islamic holiday commemorating the willingness of Prophet Ibrahim to sacrifice his son Isma'il in obedience to God's command. It involves the ritual slaughter of livestock, such as sheep, goats, or cows, with a portion of the meat distributed to family, friends, and most of it going to those in need. Celebrated on the 10th day of Dhu Al Hijjah, the last month of the Islamic lunar calendar, it marks the end of the Hajj pilgrimage and is a time for communal prayers, feasting, and reflection.\n In Iraq, most Iraqis, similar to Eid Al Fitr, consume Kleicha. In Baghdad, people enjoy Kahi and Kaymak. Eid Al Adha is also often used to resolve conflicts between family and friends, and people visit each other. The week before Eid is marked by extensive shopping and decoration, and many families visit the graves of their deceased. Additionally, a lot of Iraqis either travel to Mecca or have relatives there, and their return, usually after the end of Eid week, leads to ongoing celebrations that continue until Muharram."
 iraq_flavour.2.a: "Eid Mubarak"
 iraq_flavour.3.t: "Eid Al Fitr"
 iraq_flavour.3.d: "Eid Al Fitr is celebrated by Muslims around the world at the end of Ramadan, the holy month of fasting. The name means 'Festival of Breaking the Fast.' It is a day of joy and gratitude, marked by prayers, feasts, giving of charity, and spending time with family and friends. Muslims wear new clothes, share special meals, and give gifts, especially to children. The holiday lasts for one to three days, depending on the culture, and begins with a special prayer in the morning called Eid Salah. In Iraq, Eid Al Fitr is celebrated with various traditions. Most Iraqis break their fast with Kleicha, a traditional pastry in Iraq, while in Baghdad, people enjoy Kahi and Kaymakو Kahi being a crispy, pancake-like dessert served with sugar syrup. In the south, large neighborhood feasts are organized with the main course being fish, while in the north, most Kurdish communities gather around mosques to enjoy all kinds of tastystews together. In the evening, people often go on picnics or shop in the souqs. Additionally, many Iraqis visit the graves of their deceased relatives on Eid to remember them during these joyful times. "
 iraq_flavour.3.a: "Eid Mubarak"
 iraq_flavour.4.t: "Al Arbeen"
 iraq_flavour.4.d: "Al Arbaeen is a significant religious observance, mostly among Shia Muslims. It marks the end of the forty-day mourning period for the martyrdom of Imam Hussein, the grandson of the Prophet Muhammad, who was killed in the Battle of Karbala on the day of Ashura, the 10th day of Muharram. Al Arbaeen involves large gatherings and processions to Karbala, Iraq, where Imam Hussein is buried, as well as commemorative prayers, recitations, and acts of extreme charity, such as giving out free food, shelter, and especially water to those coming to commemorate Imam Hussein. Al Arbaeen symbolizes the enduring legacy of Imam Hussein's sacrifice for the preservation of his grandfather's religion and message, and his fight against tyranny and the forces of darkness threatening the Islamic Ummah."
 iraq_flavour.4.a: "We mourn"
 iraq_flavour.5.t: "Al Gaylani in Berlin"
