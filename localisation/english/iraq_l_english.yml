 iraq_flavour.11.t: "Iraqi Royal Trip to Greece"
 iraq_flavour.11.d: "The Royal Family of Iraq, including the King, Queen, and the King's sisters and cousins, are embarking on a week-long vacation to Greece for relaxation and treatment purposes." 
 iraq_flavour.11.a: "kalos irθes"
 iraq_flavour.11.b: "ok"
 iraq_flavour.12.t: "Princess Azzah goes to Greece"
 iraq_flavour.12.d: "Princess Azzah has requested to return to Greece for medical relaxation and has asked her sister, Princess Rajiha, to accompany her. Intelligence sources suggest that the princess may have a crush on a hotel porter in Athens, though this rumor remains unconfirmed." 
 iraq_flavour.12.a: "fine?"
 iraq_flavour.13.t: "Princess Azzah Eloped!"
 iraq_flavour.13.d: "Princess Azzah, sister of King Ghazi of Iraq and daughter of the late King Faisal, eloped with her bridegroom Anastasios Charalambous, a Greek hotel porter, in a secret ceremoney in Kephissia after renouncing Islam for Christianity. The couple fled by plane to the Island of Rhodes in the Mediterranean, avoiding another attempt by the Iraqi government and Royal Family to annul their marriage. Meanwhile, an airplane has been dispatched from Baghdad to Athens carrying an emissary of King Ghazi, tasked with investigating the situation and, if possible, annulling the wedding. Princess Rajiha, Azzah's sister, has already made several unsuccessful attempts to intervene." 
 iraq_flavour.13.a: "She Didn't!!!"

 iraq_flavour.14.t: "Plot to kill Khazal"
 iraq_flavour.14.d: "Sheikh Khazal Al Ka'abi of Muhammrah is currently under house arrest in Tehran by order of the Shah. Reports from our embassy in Tehran indicate that the Shah and his cronies have agreed to assasinate Sheikh Khazal and start another Persianization campaign in Arabestan. Sheikh Khazal was the former Sheikh of the Muhammrah Sheikhdom, which was annexed by Iran in 1925 after the British abandoned him. When his people revolted, he was kidnapped and taken to Tehran. He was also a candidate for the Iraqi throne, but the national movement decided on a non-Iraqi to be king whom is King Faisal I."
 iraq_flavour.14.a: "We need to save him"
 iraq_flavour.14.b: "Couldn't care less"

 iraq_flavour.15.t: "Festival of the Birth"
 iraq_flavour.15.d: "In the West, it is known as Christmas, but it is relatively rare among Iraqi Christians. It is a Christian holiday celebrated on December 25th for Catholics and January 7th for Orthodox Christians, commemorating the birth of Jesus Christ, or more commonly in Iraq, Yeshua the Messiah or simply the Messiah. The holiday is marked by festive traditions such as attending church services, spiritual prayers, exchanging gifts and sharing meals with family and friends. It symbolizes joy, peace, and goodwill.\n Before the festival, Christians fast for a week from all meat and diary related products, and Christian women go shopping, cleaning, decorating, and making Kleicha in groups, similar to the way Muslims prepare for Eid as after all it is Eid Al Milad. Muslims do not celebrate the birth of Jesus but still support and congratulate their Christian neighbors, who do the same for Muslims during the Eids."
 iraq_flavour.15.a: "Merry Christmas"

 iraq_flavour.16.t: "Hercule Poirot Arrives in Baghdad"
 iraq_flavour.16.d: "The renowned Belgian detective, Hercule Poirot, arrives in Baghdad after a lengthy journey, traveling first from Paris to Istanbul aboard the Orient Express, followed by a trip on the old Berlin-Baghdad railway. He is set to stay at the prestigious Tio Hotel, owned by Marcus Tio, conveniently located on Rashid Street near the Tigris River. Monsieur Poirot reveals that his visit to Baghdad is primarily for a holiday, having been invited by the Swedish archaeologist Dr. Eric Leidner to assist with an excavation. His arrival, however, has drawn attention, resulting in invitations to dine with prominent figures such as the Minister of Foreign Affairs, Nuri Pasha Al Said, the British Ambassador Sir Archibald Clark Kerr, and Prince Zeid Bin Hussein, the King's uncle."
 iraq_flavour.16.a: "Bienvenue Mon Ami"

 iraq_flavour.17.t: "A Murder Near Baghdad!"
 iraq_flavour.17.d: "The renowned Belgian detective, Hercule Poirot, arrived in Baghdad a week ago. During his stay with Dr. Eric Leidner and his American wife, Mrs. Louise Leidner, at an archaeological dig near Ctesiphon, tragedy struck as Mrs. Leidner was murdered. However, the world's greatest detective successfully solved the mystery. It was revealed that Dr. Eric Leidner was actually Louise's first husband, who had survived a train crash and assumed a new identity. For years, he had been sending her threatening letters anonymously before remarrying her 12 years after his supposed death. His motive for the murder stemmed from jealousy after she developed feelings for Mr. Richard Carey, his coworker. Poirot, is now ready to return to England, will first make a brief stop in the Holy Land before traveling back via the Orient Express. As a gesture of gratitude, King Ghazi has bestowed the Royal Order of the Two Rivers upon Poirot and officially making him 'Hercule Pasha Poirot' in recognition of his success in solving the murder of a foreign national in Iraq."
 iraq_flavour.17.a: "Every Murderer is probably somebody's old friend"

 iraq_flavour.18.t: "The Baghdad Conservatoire"
 iraq_flavour.18.d: "The Baghdad Conservatoire has officially opened its doors to Iraqi, Arab, Syriac, and Kurdish musicians. Established by a royal decree from King Ghazi, who asked Hanna Petros to oversee its creation, it stands as the second Arab conservatoire and the first in the Fertile Crescent. The institution is poised to become a hub for musicians from Iraq, the Levant, and the wider region. With numerous aspiring artists already enrolled, rumors suggest that Salima Pasha might grace its inauguration with a performance, adding her graceful endorsement."
 iraq_flavour.18.a: "Baghdad will someday emerge as the musical capital of Arabia"

 iraq_flavour.19.t: "Sharif Muhiddin Appointed Dean"
 iraq_flavour.19.d: "Sharif Muhiddin Ali Haidar, also known as Serif Muhiddin Targan, is the son of the last Ottoman Wali of Hejaz and a relative of the royal family. However, he is best known for his musical talent, which has earned him fame across the Middle East. He has performed in every major Arab capital, from Cairo to Baghdad, and even played in Istanbul for Atatürk. Despite past tensions between Muhiddin's father and the king's grandfather, the king approved Muhiddin's appointment as the dean of the Baghdad Conservatoire. Muhiddin will also be responsible for developing the institution's curriculum."
 iraq_flavour.19.a: "Good music beats any troubled past"

 iraq_flavour.20.t: "Salima Pasha Sings in the Conservatoire"
 iraq_flavour.20.d: "Salima Murad, now widely known as Salima Pasha after Nuri Pasha Al Said gave her the title in 1932, gained this recognition after a performance at the Al Hilal Club where she sang a song even better than Umm Kulthum, who herself praised Salima's talent. Salima has honored the Baghdad Conservatoire by performing her famous song 'Galbak Sakhr Jalmud' and she is also one of the first women to sing for the newly established Baghdad Radio's music department, led by Yusuf Za'arur. Despite being Jewish, this has not hindered her rise to fame in Iraq, where she has won the hearts of many Iraqis and Arabs. The same as many other prominent Jewish figures in Iraq like her composers, the brothers Dawud and Saleh Al Kuwaiti, Mosul's singer Sultanah Yusuf, her mentor Yusuf Za'arur, historian Nassim Sawseh, Judge Dawud Samrah, and notable families such as the Sasson and Daniel families, as well as her sister Regina Murad Pasha, the richest woman in Iraq before her tragic murder by her second husband.\n\n Salima's talent will be making a lasting name for her in Iraqi music especially the Maqam." #نسيم سوسة
 iraq_flavour.20.a: "Good music beats any troubled past"

 iraq_flavour.21.t: "Siddiq Pasha Dismissal?"
 iraq_flavour.21.d: "Siddiq Rasul Pasha Al Qadri is a notable Iraqi statesman and a notable Middle Eastern figure from the Great War era. He served with both the Ottoman and the Russian Tsarist/White armies. After the war, Al Qadri focused on fighting communism, leading Russian Muslim soldiers in their struggle against the Bolsheviks and carrying out diplomatic missions on behalf of the White Army to Japan and Hejaz. In Japan, he sought support by sharing Middle Eastern cultural insights as they asked him to, while in Hejaz, he earned the Sharif's endorsement and was gifted a garment once used to cover the Kaaba. Returning to Siberia, he continued the fight as a brigadier general under Grigory Semenyov, although they ultimately faced defeat and returned home to Iraq.\n\n Once back in Baghdad, Al Qadri continued his crusade against communism and fueled the red scare. His efforts represent a challenge to any social or socialist government, making his removal and retirement a prudent step toward advancing socialist ideals and improving relations with the Soviets." 
 iraq_flavour.21.a: "We don't get rid of our heroes"
 iraq_flavour.21.b: "Fine, next ..."

 iraq_flavour.22.t: "Muthanna Youth Movement established"
 iraq_flavour.22.d: "The Muthanna Club is a political faction in Iraq known for its strong stances on nationalism, pan-Arabism, fascism, anti-sectarianism and unexpectedly advocacy for women's rights. Founded in 1935 by Doctor Saib Shawkat, General Taha Al Hashimi, and Muhammad Mahdi Kubba, a Shia Member of Parliament, the movement is often labeled by the media as Arabo-Fascist. Its primary mission is to free Iraq, and later the entire Arab world, from the grip of decadent Western imperialism, with a particular focus on resisting British influence. The club derives its name from Al Muthanna bin Al Harithah, the Arab commander who led the defeat of the Sassanids at the Battle of Al Qadisiyyah.\n\n In keeping with its fascist principles, the Muthanna Club established a youth wing known as the Futuwwa, composed of school and college students who joined the club and formed their own student committees called 'The Student National Gathering'. This movement is mostly modeled after European fascist organizations in Germany and Italy. The Futuwwa is largely inspired by the original Futuwwa system introduced by the second Hashimi cabinet in 1931 to replace school-only boy and girl scouts which has been the norm since 1922, which focused on training students in scouting and building boy scout movements across Iraq to foster a spirit of cooperation and patriotism among young boys. However, unlike the government's program, the Muthanna Club instills its scouts with anti-European, liberationist and nationalist values."  #https://rasammerkezi.com/featured/5682/
 iraq_flavour.22.a: "Oriental Fascism?"

 iraq_flavour.23.t: "Pogrom in Baghdad"
 iraq_flavour.23.d: "A horrific pogrom took place in Baghdad, Iraq, led by the Futuwwa militia under the direction of Muthanna organizer and Economy Minister Yunis Al Sabawi. In a desperate move following the British overthrow of the government of national defense led by Rashid Ali Al Gaylani, Al Sabawi rallied the Futuwwa and extremists against the Jewish population of Baghdad. They falsely accused the Jewish community of supporting the British war effort, being capitalist oppressors of the working class, monarchists, conspiring against the Iraqi nation and backing Zionism; outrageous and baseless claims. These accusations stemmed from reports of some Jewish individuals not enlisting to fight the British and in some cases, cheering the British army.\n\n The Jewish community in Iraq had deep roots in the country for thousands of years, playing a vibrant role in society, particularly in Baghdad. However, over the years, antisemitism grew, especially after the Balfour Declaration, the French invasion of Syria and the establishment of European mandates, which stirred anti-Jewish sentiment among those opposing European imperialism and supporting Arab unity/independence. The violence was eventually halted by the British army, who imposed a lockdown on Baghdad, with many perpetrators summarily executed by British forces, stirring further anti-imperialist and antisemitic sentiment."
 iraq_flavour.23.a: "RIP"

 iraq_flavour.24.t: "Fate of the Pogromists"
 iraq_flavour.24.d: "Following the pogrom so called as the Farhud (The Plundering) for the acts of looting and murder of the Jewish community in Baghdad, should the government perscute all those who particpated in the pogrom or only Yunis Al Sabawi"
 iraq_flavour.24.a: "No mercy"
 iraq_flavour.24.b: "Issue general amnesty"
