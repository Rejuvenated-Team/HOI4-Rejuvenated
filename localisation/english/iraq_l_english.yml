 IRQ_Futuwwa_idea: "Al Futuwwa"
 IRQ_Futuwwa_idea_desc: "In keeping with its fascist principles, the Muthanna Club established a youth wing known as the Futuwwa, composed of school and college students who joined the club and formed their own student committees called 'The Student National Gathering'. This movement is mostly modeled after European fascist organizations in Germany and Italy. The Futuwwa system was introduced by the second Hashimi cabinet in 1931 to replace school-only boy and girl scouts which has been the norm since 1922, which focused on training students in scouting and building boy scout movements across Iraq to foster a spirit of cooperation and patriotism among young boys. However, unlike the government's program, the Muthanna Club program made by Sami Shawkat the former director of education instills its scouts with anti-European, liberationist and nationalist values with a focus on 'Death in the name of the Homeland'."
