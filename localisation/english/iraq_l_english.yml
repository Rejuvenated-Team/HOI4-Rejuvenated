 PAL_Zionists: "Yishuv Opposition"
 PAL_Zionists_desc: "As the Arab Revolt against British rule rages on, Zionist settlers form their own paramilitary groups to help the British counter the Arab revolts. With strong socialist and far-right influences and roots in Eastern Europe, these militias, such as the Haganah and Irgun, operate independently and in cooperation with the British to suppress the Arab revolt. These forces are determined to protect Jewish settlements and ensure the continuation of immigration and development projects in the Yishuv, viewing the Arab Revolt as a direct threat to the Zionist project in Palestine."

