#events
 iraq.1.t: "Coup in Baghdad"
 iraq.1.d: "This morning, General Bakr Sidqi, the recently appointed Chief of the General Staff of the Royal Iraqi Army, orchestrated a coup against the government of Yasin Al Hashimi due to its reformist stance. Leaflets were dropped from planes, urging the King to take action by dismissing Yasin Al Hashimi's administration and reinstating the ousted anti-reform Prime Minister, Hikmat Sulayman. Bakr Sidqi also threatened to attack the royal palace if his demands were not met."
 iraq.1.a: "Sidqi meets with the King"
 iraq.1.b: "Jafar stands up to the coup"
 iraq.1.c: "The Military just dispersed?"
 iraq.2.t: "Al Askari Meeting"
 iraq.2.d: "Jafar Al Askari, regarded as the father of the Iraqi military, an anti-colonialist crusader in North Africa, and a hero of the Arab Revolt, volunteered to meet with his subordinates who had aligned themselves with Bakr Sidqi. His intention was to persuade them to abandon their support for the coup and uphold the legitimacy of the current regime."
 iraq.2.a: "The Soldiers shoot Jafar"
 iraq.2.b: "The Soldiers join Jafar"
 iraq.3.t: "Aftermath of the Coup"
 iraq.3.d: "The coup has been thwarted. Should we restore the civilian government immediately, or maintain the current system for a while to ensure stability?"
 iraq.3.a: "Restore the old System"
 iraq.3.b: "It is time for reform"
 iraq.3.c: "Its time for change but not too much"
 iraq.4.t: "Mosul Insurrection"
 iraq.4.d: "Fearing that Bakr Sidqi might abolish the monarchy and establish a personal fiefdom in Kurdistan, the King and his most loyal generals have been planning a counter-coup for some time. General Muhammad Amin Al Umari ordered a few soldiers to summarily execute Bakr Sidqi and the leader of the air force, Muhammad Ali Jawad, at a café in Mosul Airport. Bakr Sidqi was killed, his loyalists and the inquiry committee were arrested, and Prime Minister Hikmat Sulayman resigned and went into exile."
 iraq.4.a: "Long Live the King"
 iraq.5.t: "A Liaison from the British"
 iraq.5.d: "Worried about King Ghazi's actions, the British have dispatched a liaison to consult with Nuri Al Said in order to develop a plan to remove Ghazi. They have requested Nuri's help in acquiring information about Ghazi's schedule and the car he uses most often. Regardless of whether Nuri cooperates, the British are determined to move forward with their plan."
 iraq.5.a: "He will not betray his king"
 iraq.5.b: "The interest of Iraq lays within the interest of Britain"
 iraq.6.t: "King Ghazi is involved in an Accident"
 iraq.6.d1: "King Ghazi took a car ride with his servant from his home to downtown Baghdad. On the return trip, they came across a barrier, but fortunately, the brakes functioned properly, and he emerged relatively unscathed."
 iraq.6.d2: "King Ghazi was traveling with his servant from his residence to downtown Baghdad when they hit a barrier on the way back. Unfortunately, the brakes failed, causing the car to veer off course and crash into a telephone post, leading to Ghazi's death."
 iraq.6.a: "He Lives"
 iraq.6.b: "He dies"
 iraq.6.c: "Ok... Put the regalia on the German Dictator we saved"
 iraq.7.t: "Coronation of Faisal II"
 iraq.7.d: "After the death of his father, King Faisal II was made King of Iraq at the age of four. However, he was not to assume the throne until he turned 18. Today, on his 18th birthday, he has been officially proclaimed King of Iraq by both the parliament and the constitution."
 iraq.7.a: "Long live the King"
 iraq.8.t: "Second Coup in Baghdad"
 iraq.8.d: "After Al Gaylani's dismissal and replacement by Taha Al Hashimi, whose anti-British rhetoric was seen as a threat to Iraq's neutrality, Al Gaylani and his allies within the military and government initiated a coup and pressured Taha Al Hashimi into resigning. They then established a government of national defense, deposed Regent Abdulilah, and replaced him with Sharif Sharaf bin Rajeh. The new Iraqi government will aim to maintain neutrality but may seek to assert independence or form an alliance with Germany. The Ironic thing that both coups in Iraq's histoy had forced out a Prime Minister from the Hashimi Family, first Yasin and now his brother Taha."
 iraq.8.a: "Arise Iraq"
 iraq.9.t: "Nuri Al Said and the Regent"
 iraq.9.d: "Nuri Al Said and Regent Abdulillah have fled Baghdad and are heading toward Basra to make contact with the British."
 iraq.9.a: "They have reached Basra"
 iraq.9.b: "They have been executed"
 iraq.10.t: "Anglo-Iraqi War"
 iraq.10.d: "In a dramatic turn of events during the ongoing Anglo-Iraqi War, Nuri Al Said and Regent Abdulillah have successfully escaped Baghdad and are en route to Basra. Their goal was to establish contact with British forces amidst the coup. \n Just days before a formal declaration of war against Germany, the Iraqi military, in collaboration with the Muthanna Club politicians, executed a coup against the government. This action was driven by frustration over the government's alliance with Iraq's former oppressors and current overlords. The coup leaders declared armed neutrality and initiated efforts to block British military advancements through Iraq.\n\n However, the coup was short-lived. The British Army, swiftly responding to the situation, intervened and quelled the rebellion within days. With the Prime Minister and Regent still alive, order was quickly restored, and normalcy resumed across the country.\n As the situation stabilizes, the escape of Nuri Al Said and Regent Abdulillah signifies ongoing tensions and shifting allegiances in the region, reflecting the complex dynamics of the Anglo-Iraqi War."
 iraq.10.a: "Order has been restored"
 iraq.10.b: "The Queen should serve as regent"
