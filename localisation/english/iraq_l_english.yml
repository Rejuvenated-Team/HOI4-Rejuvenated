#leader desc
 IRQ_yasin_al_hashimi_desc: "Yasin Hilmi born 1884 in Baghdad. Coming from a middle-class Sunni Arab family, his father, Sayyid Salman, was the Mukhtar of Barudiyya. he attended the Ottoman Military Academy in Istanbul, graduating in 1902 and its where he adopted the surname 'Al Hashimi' to honor his tribe, the highly regraded Banu-Hashim whom is the tribe of the prophet Muhammad.\n\n In 1913, stationed in Mosul, he joined Al Ahd, an underground Arab nationalist society led by his brother Taha. Al Hashimi also joined Al Fatat, a nationalist group based in Damascus, during World War I. Although offered a role in the Sharifian Army by Faisal, he chose to stay with the Ottoman military. \n During World War I, Al Hashimi joined the Arab nationalist societies Al Ahd and Al Fatat and fought for the Ottomans, earning recognition, including an Iron Cross from the German Emperor. However, he later became a key figure in Arab nationalist movements and worked closely with King Faisal I. After Faisal entered Damascus in 1918, Al Hashimi became President of the Military Council, advocating against French and British mandates in the region. In 1919, he was arrested by the British for anti-colonial activities.\n Al Hashimi's support for the Damascus Protocol influenced Faisal to launch the Arab revolt. After Faisal entered Damascus in 1918, Al Hashimi became President of the Military Council and Secretary of Military Affairs, recruiting for the Arab Army. He also led Al Ahd's Iraqi wing against French and British rule.\n\n After the fall of Syria and brief exile, he returned to Baghdad, Al Hashimi was appointed as the Mutasarrif of Muntafiq in 1922 and later became Prime Minister of Iraq in 1924, opposing British influence. He was instrumental in the renegotiation of the Anglo-Iraqi Treaty in 1930, leading the National Brotherhood Party against the British-backed faction for slow-paced independence. Despite gaining independence in 1932, internal political struggles saw Al Hashimi's influence dwindle with King Ghazi's accession."
 IRQ_yasin_al_hashimi_desc_long: "Yasin Hilmi Al Hashimi, born in Baghdad in 1884, came from a middle-class Sunni Arab family. His father, Sayyid Salman, was the Mukhtar of Barudiyya. Al Hashimi attended the Ottoman Military Academy in Istanbul, graduating in 1902 and adopting the surname 'Al Hashimi' to honor the Banu Hashim.\n In 1913, stationed in Mosul, he joined Al Ahd, an underground Arab nationalist society led by his brother Taha. Al Hashimi also joined Al Fatat, a nationalist group based in Damascus, during World War I. Although offered a role in the Sharifian Army by Faisal, he chose to stay with the Ottoman military.\n In 1917, Al Hashimi commanded an Ottoman division in Galicia, earning an Iron Cross from German Emperor Wilhelm II and being promoted to major general. He later commanded the Fourth Army garrison and fought against a British-led offensive in Amman in 1918, where he was wounded.\n\n Al Hashimi's support for the Damascus Protocol influenced Faisal to launch the revolt. After Faisal entered Damascus in 1918, Al Hashimi became President of the Military Council and Secretary of Military Affairs, recruiting for the Arab Army. He also led Al Ahd's Iraqi wing against French and British rule.\n In November 1919, Al Hashimi was kidnapped by the British for recruiting soldiers and leading anti-British propaganda. His arrest caused protests in Damascus, and with the British withdrawal, Faisal's government became vulnerable to French takeover. Al Hashimi was replaced as War Minister by Yusuf Al 'Azma.\n Returning to Syria in May 1920, Al Hashimi inspected the Arab Army just before a French offensive. As the French attacked in July, Al Hashimi remained in Damascus while the Arab Army, commanded by Al 'Azma, was defeated at the Battle of Maysalun.\n\n In March 1922, Al Hashimi moved to Baghdad, where Faisal appointed him Mutassarif of Muntafiq. He declined an offer to join Ja'far Al 'Askari's cabinet in October 1923 due to his stance on the Anglo-Iraqi Treaty but later accepted it. In the 1924 constituent assembly election, Al Hashimi won a seat and became prime minister after the assembly was dissolved. He was appointed partly to align with Faisal's anti-British stance and to handle the Mosul Vilayet dispute.\n In 1930, the political climate in Iraq heated up with negotiations over the Anglo-Iraqi Treaty. Al Hashimi led the faction demanding immediate independence, while Prime Minister as-Said supported gradual independence. Al Hashimi formed the National Brotherhood Party to oppose as-Said and British rule.\n Following Iraq's accession to the League of Nations, King Faisal included opposition groups in the parliament and cabinet. However, Al Hashimi's party lost support due to the failure to address the Anglo-Iraqi Treaty and the mismanagement of the Assyrian Affair. Iraq gained independence in 1932, and after Faisal's death in 1933, his son Ghazi succeeded him. Al Hashimi's party lost power with Ghazi's accession."



#random stuff
 egypt.1.t: "King Fuad is Dead!"
 egypt.1.d: "Today tragic news hits Egypt, as King Fuad bin Ismail bin Ibrahim bin Muhammad Ali has died in Qubbah Palace. As the nation is in mourning the loss of its King who governed Egypt for nearly two decades, the throne passes to his sixteen year old son Emir Farouk whom has just returned from his studies in the Royal Military Academy in Woolwich, England so he could learn English unlike his father who couldn't understand it. No Pharaoh, no Sultan, No Khedive ever began his reign of Egypt with such unquestionable, enthusiastic goodwill as Farouk. And none was as unprepared to rule, he is virtually uneducated sixteen-year old with only knowledge in three languages, expected to fill the shoes of his politically astute father in a time where the drum-of-war is roaring between nationalism, imperialism, constitutionalism, and monarchy."
 egypt.1.a: "Ash Al Malik"

