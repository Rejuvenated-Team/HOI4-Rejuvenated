 iraq_lore.0.t: "Ancient and Islamic Iraq"
 iraq_lore.0.d: "Iraq, also referred to as Mesopotamia, or Babylon, is considered a single geographical and historical entity, despite its diverse ethnic and sectarian composition but Iraq remained a unified entity. The term 'Iraq' has ancient origins, initially referring to Uruk, a prominent city-state in ancient Mesopotamia. During the era of city-states, Uruk emerged as one of the world's first major urban centers and expanded its influence over neighboring city-states, establishing a model for early civilization. Mesopotamia is often called the 'Cradle of Civilization' due to the development of writing systems, government, and organized religion. It saw the rise of many states like Ur, Eridu, Lagash, and Uruk. These city-states frequently competed, leading to the formation of larger political entities.\n\n Around the 24th century BCE, Sargon of Akkad established the Akkadian Empire, the first known empire in history, uniting Sumerian and Akkadian cultures. The Old Babylonian period marked another significant phase, with the rise of Hammurabi, who is famous for the Code of Hammurabi, one of the earliest legal codes. After the decline of Babylon, the Kassites, and later the Assyrians, took control, with the Neo-Assyrian Empire stretching from Mesopotamia till Egypt. The Assyrian Empire was succeeded by the Neo-Babylonian Empire, which experienced a cultural renaissance under Nebuchadnezzar II.\n The Babylonian Empire fell to the Achaemenids in 539 BCE, signaling the end of native rule in Mesopotamia until the Islamic conquests of the 7th century CE.\n\n Iraq's strategic location, simple terrain, and abundant water, natural, and agricultural resources have given it significant international strategic depth. Situated in the western part of Asia, Iraq serves as a gateway to the Middle East. Caliph Umar Al Khattab famously described Iraq as 'the spearhead of Islam and the fortress of the frontiers.' It has been a crucial part of the Arab world, historically one of the most significant provinces and regions under the Islamic Arab state.\n Iraq was the seat of the Abbasid Caliphate, with Caliph Al Mansur building Baghdad as its capital. Under the Abbasids, Iraq experienced centuries of enlightenment and development. Baghdad became the global center of knowledge, attracting scientists and artists, especially during the reign of Caliph Harun Al Rashid. His era saw Baghdad become the largest and most important city in the world, with the establishment of the House of Wisdom, the grandest library and educational center of its time. This period was known as the Islamic Golden Age.\n\n However, this golden age came to an end with rising corruption and conflict, particularly during the Anarchy of Samarra which was built to serve as a private city for the caliphs and their loyalists. In 1258 CE, the Mongols invaded Baghdad, facing fierce resistance but ultimately massacring its inhabitants over a week, destroying and burning the city, and ending the Abbasid Caliphate. The Caliphate subsequently moved to Istanbul after the fall of the Mamluks in Egypt which hosted the last Abbasid Caliphs, marking the beginning of the Ottoman era."
