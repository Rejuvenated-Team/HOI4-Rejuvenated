l_english:
 #JAPAN
 JAP_our_european_friends: "Our Friends in Europe"
 JAP_our_european_friends_desc: "If we wish to unite East Asia under the Japanese banner, who is a better option to help us than our fascist cousins in Europe?"
 JAP_merge_with_the_kokumin_domei: "Merge with the Kokumin Domei"
 JAP_merge_with_the_kokumin_domei_desc: "With Nakano's ascension to Prime Minister, the Touhoukai faction within the Imperial Rule Assistance Association has struggled to become the biggest one. Its old parent party, the Kokumin Doumei, has managed to consolidate power under the leadership of Adachi Kenzou. We should negotiate with him, before his party can oust ours from the government."
 JAP_reorganize_the_chinese_nations: "Reorganize the Chinese Nations"
 JAP_reorganize_the_chinese_nations_desc: "The time has come to liberate the minorities of China from Han rule! May all the workers and farmers of East Asia be free!"
 JAP_the_tibetan_revolution: "The Tibetan Revolution"
 JAP_the_tibetan_revolution_desc: "Many Tibetans have become interested in our buddhist socialism. Maybe we could instigate a coup favourable to our government."
 JAP_strike_at_the_chinese_communists: "Strike at the Chinese Communists"
 JAP_strike_at_the_chinese_communists_desc: "Both Fascism and Communism have been purged from Japan. We should make sure the CCP doesn't have the opportunity of becoming a menace to the region."
 JAP_the_fading_sun: "The Fading Sun"
 JAP_the_fading_sun_desc: "The IJA has evacuated Manchuria and Korea, after the Chinese forces managed to kick us out of the region. The rising sun is fading..."
 JAP_the_new_japanese_economy: "The New Japanese Economy"
 JAP_the_new_japanese_economy_desc: "We must focus on rebuilding our economy in a way that doesn't make us dependent on any colonies."
 JAP_export_japanese_culture: "Export Japanese Culture"
 JAP_export_japanese_culture_desc: "Now that we don't have any resources to maintain our economy, maybe we could make good use of our film, cartoon and comic industries."
 JAP_purge_extremists_from_the_army: "Purge Extremists from the Army"
 JAP_purge_extremists_from_the_army_desc: "The Kwantung Army destroyed our nation! We must purge all those responsible for the fading of the sun!"
 JAP_appoint_yonai: "Appoint Yonai"
 JAP_appoint_yonai_desc: "Mitsumasa Yonai is a good compromise between a civilian government and the navy's hold over it. May he guide us towards a great era."
 JAP_learn_from_the_humillation: "Learn from the Humiliation"
 JAP_learn_from_the_humillation_desc: "We weren't able to defeat the Chinese at their darkest hour. How will we be able to serve any purpose in a war again?"
 JAP_memories_of_the_old_alliance: "Memories of the Old Alliance"
 JAP_memories_of_the_old_alliance_desc: "Mitsumasa Yonai wanted us to align with the Allies, before he was replaced by the fascists of the Imperial Rule Assistance Association. Maybe now it's our opportunity to do it."

 #MANCHUKUO
 MAN_unify_with_the_soviet_republic: "Unify with the Soviet Republic"
 MAN_unify_with_the_soviet_republic_desc: "We do not hold the stability, organization or resources to survive on our own. The only way to ensure the survival of our revolution is to unify with the CCP government in Yan'an."
 MAN_the_warlord_of_manchuria: "The Warlord of Manchuria"
 MAN_the_warlord_of_manchuria_desc: "Manchuria was freed by soldiers, not by speeches. If our new state is to survive the chaos of China, it must accept firm military leadership and the authority of those who won its freedom."
 MAN_the_good_government: "The Good Government"
 MAN_the_good_government_desc: "The promise of liberation must be more than another clique in Mukden. A clean, civilian government can prove that Manchuria's future belongs to law, reform, and public trust."
 MAN_ties_with_the_northeastern_army: "Ties with the Northeastern Army"
 MAN_ties_with_the_northeastern_army_desc: "The old Northeastern Army still carries the memory of Fengtian authority. Bringing its officers and men back into our fold will strengthen our claim over Manchuria and give us a seasoned force for the wars ahead."
 MAN_victory_for_the_HZF: "Victory for the HZF"
 MAN_victory_for_the_HZF_desc: "The Haozhengfu has won not by promising a new strongman, but by rejecting the rule of strongmen altogether. Its program of constitutional government, clean administration, civil supremacy, and measured reform now offers the republic a path beyond warlord patronage and party dictatorship."
 MAN_victory_for_the_CDSP: "Victory for the CDSP"
 MAN_victory_for_the_CDSP_desc: "The China Democratic Socialist Party offers reform without surrendering China to extremism. Its victory will bind national reconstruction to social justice and parliamentary government."
 MAN_victory_for_the_ZGD: "Victory for the ZGD"
 MAN_victory_for_the_ZGD_desc: "Federalists argue that China can only endure if its regions are granted a real voice. Their victory will make Manchuria the foundation of a stable and fair republic."
 MAN_constitutionalism: "Constitutionalism"
 MAN_constitutionalism_desc: "Personal rule and emergency decrees cannot guide China forever. We must put clear constitutional limits at the center of our political life."
 MAN_pragmatism: "Pragmatism"
 MAN_pragmatism_desc: "Ideals may guide the republic, but they must not become idols. Inspired by Hu Shi's call to test every doctrine against the needs of the nation, the Haozhengfu will place practical reform, constitutional order, and competent administration above factional purity."
 MAN_federalism: "Federalism"
 MAN_federalism_desc: "China's regions have known too much rule from distant capitals and passing armies. A federal settlement can turn local autonomy from a source of division into the basis of unity."
 MAN_join_the_international_community: "Join the International Community"
 MAN_join_the_international_community_desc: "A restored China cannot remain isolated. We should seek recognition, partners, and a place among the democratic nations of the world."
 MAN_the_jade_marshal: "The Jade Marshal"
 MAN_the_jade_marshal_desc: "Wu Peifu's reputation for discipline and incorruptibility still commands respect across China. Under the Jade Marshal, Manchuria can become the spearhead of national reunification."
 MAN_the_young_marshal: "The Young Marshal"
 MAN_the_young_marshal_desc: "Zhang Xueliang has known defeat, exile, and betrayal, but he also carries the legacy of the Northeast. His return can rally those who still believe in a new China born from Manchuria."
 MAN_rule_of_virtue: "Rule of Virtue"
 MAN_rule_of_virtue_desc: "A republic cannot endure if it entrusts itself to men ruled by greed, vanity, or faction. Wu Peifu calls for government by virtuous and learned men, chosen for wisdom and restraint rather than the people's apetite, in order to protect them from another corrupt and disjointed government."
 MAN_reject_the_temptations: "Reject the Temptations"
 MAN_reject_the_temptations_desc: "China has been for countless decades weakened by gambling, drinking, brothels, smoke of opium and greed for wealth. Every Chinese citizen must reject such temptations, embracing austerity, discipline, and morality."
 MAN_denounce_the_imperialists: "Denounce the Imperialists"
 MAN_denounce_the_imperialists_desc: "Foreign powers carved privileges out of China's weakness and called it civilization. We will denounce their hypocrisy and prepare to end their influence over our nation."
 MAN_destroy_communism: "Destroy Communism"
 MAN_destroy_communism_desc: "Communism promises liberation while replacing one tyranny with another. We must strike at every red movement that threatens China's sovereignty and moral order."
 MAN_defect_to_the_communists: "Defect to the Communists"
 MAN_defect_to_the_communists_desc: "The Kuomintang has failed China too many times. If the communists are the only force still willing to fight for the Chinese people, then we must cast our lot with them."
 MAN_rejoin_the_KMT: "Rejoin the KMT"
 MAN_rejoin_the_KMT_desc: "For all its failures, the Kuomintang remains the government most closely tied to the Republic's legitimacy. Returning to its side may be the quickest path back into a united China."
 MAN_reject_nanjings_militarism: "Reject Nanjing's Militarism"
 MAN_reject_nanjings_militarism_desc: "Nanjing claims to speak for the nation, yet the CC Clique has turned into a military rule that sinks in corruption. We must denounce this decay, rallying those who still believe China's future must be built by unity, not command."
 MAN_the_coalition_government: "The Coalition Government"
 MAN_the_coalition_government_desc: "Time and again, the Communists have sought an accord with the Kuomintang in the name of China's survival, only to be met with suspicion, betrayal, and purge. If Nanjing has chosen repression over unity, then we must offer another path: a coalition between the Kuomintang Revolutionary Committee and the Communists."
 MAN_agrarian_reform_desc: "China's villages have paid the price of war and neglect. Land reform will give the peasantry a stake in the new republic and weaken the old rural order."
 MAN_new_democratic_economy_desc: "A democratic China needs an economy that serves reconstruction rather than privilege. State guidance, social reform, and private initiative can be balanced into a new national program."
 MAN_zhang_xueliangs_premiership: "Zhang Xueliang's Premiership"
 MAN_zhang_xueliangs_premiership_desc: "Zhang Xueliang can turn his personal legend into a national mandate. As premier, the Marshal will lead a patriotic government committed to unity and reform."
 MAN_zhang_lans_premiership: "Zhang Lan's Premiership"
 MAN_zhang_lans_premiership_desc: "Zhang Lan represents the old democratic opposition at its most principled. His premiership would give the republic a civilian, reformist face after years of warlordism and party rule."
 MAN_soong_ching_lings_premiership: "Soong Ching-ling's Premiership"
 MAN_soong_ching_lings_premiership_desc: "Soong Ching-ling carries the moral authority of Sun Yat-sen's legacy and the language of social revolution. Her premiership can unite democratic reform with national renewal."
 MAN_zhou_enlais_premiership: "Zhou Enlai's Premiership"
 MAN_zhou_enlais_premiership_desc: "Zhou Enlai's popularity among workers, peasants, and radicals has carried him to the premiership, giving the coalition a mandate few could ignore. Yet his authority does not stand above the republic: under the constitution of the coalition government, Zhou must govern through law, compromise, and the institutions his people once sought to overturn."
 MAN_follow_the_north: "Follow the North"
 MAN_follow_the_north_desc: "A restored China cannot remain isolated. We should seek recognition, partners, and a place among the socialist nations of the world."
 MAN_follow_the_west: "Follow the West"
 MAN_follow_the_west_desc: "A restored China cannot remain isolated. We should seek recognition, partners, and a place among the democratic nations of the world."
 MAN_avenge_the_humillation: "Avenge the Humiliation"
 MAN_avenge_the_humillation_desc: "The loss of the outern territories was a wound carved into China's pride. Now that the Qing have risen again, we must reclaim every stolen province and make those who profited from our weakness answer for their arrogance."

 #SHANXI
 SHX_fight_the_communists_back: "Fight the Communists Back"
 SHX_fight_the_communists_back_desc: "The Communists have crossed the Yellow River into Shanxi, claiming their so-called Eastern Expedition is a patriotic march against Japan. Yet wherever the Red Army advances, it brings requisitions, agitation, and the false promise of revolution! They will be hunted down as the enemies of China they are!"
 SHX_expand_the_militias: "Expand the Militias"
 SHX_expand_the_militias_desc: "Our strength has always rested on local men who know every road, village, and pass. Expanding the citizen militias will give Shanxi a shield that no invader can break."
 SHX_expand_the_taiyuan_arsenal: "Expand the Taiyuan Arsenal"
 SHX_expand_the_taiyuan_arsenal_desc: "Taiyuan's workshops are the heart of our military industry. With new machinery and tighter organization, the arsenal can arm Shanxi to defend herself from the claws of our enemies."
 SHX_the_northern_menace: "The Northern Menace"
 SHX_the_northern_menace_desc: "Mengjiang and the forces gathering beyond Suiyuan threaten to turn the northern frontier into a dagger pointed at Taiyuan. We must prepare before they strike."
 SHX_the_western_menace: "The Western Menace"
 SHX_the_western_menace_desc: "The mountains and deserts to the west hide the Communist guerrillas, waiting for the time to strike at the model province. Our army must be prepared to fight back until it marches in Yan'an."
 SHX_copy_western_designs: "Copy Western Designs"
 SHX_copy_western_designs_desc: "Foreign arsenals have solved problems our workshops still struggle with. By copying and adapting German and American designs, we will be able to arm our army with the weapons they deserve."
 SHX_invite_foreign_observers: "Invite Foreign Observers"
 SHX_invite_foreign_observers_desc: "Experienced foreign officers and technicians can show us how to properly produce the weapons needed to supply our armies."
 SHX_the_suiyuan_campaign: "The Suiyuan Campaign"
 SHX_the_suiyuan_campaign_desc: "Japanese-backed forces from Mengjiang have crossed into Suiyuan, seeking to tear open Shanxi's northern frontier and turn the province into another stepping stone for the Kwantung Army's ambitions. The victory at Suiyuan must become proof that Shanxi will not yield its gates to any invader!"
 SHX_develop_the_taiyuan_iron_plant: "Develop the Taiyuan Iron Plant"
 SHX_develop_the_taiyuan_iron_plant_desc: "Steel is the foundation of guns, rails, bridges, and factories. Expanding Taiyuan's iron plant will strengthen every part of Shanxi's reconstruction."
 SHX_extract_the_baotou_deposits: "Extract the Baotou Deposits"
 SHX_extract_the_baotou_deposits_desc: "The mineral wealth around Baotou should serve our army and industry, not sit idle beneath contested ground. We will organize its extraction for the province's needs."
 SHX_promote_the_livestock_industry: "Promote the Livestock Industry"
 SHX_promote_the_livestock_industry_desc: "The herds of Shanxi and Suiyuan are more than a rural livelihood. Properly supported, they can feed our people, supply our army, and steady the countryside."
 SHX_expand_public_education: "Expand Public Education"
 SHX_expand_public_education_desc: "A model province cannot be built by decree alone. Schools, teachers, and literacy campaigns will give the people the tools to serve and improve Shanxi."
 SHX_profesionalize_the_mining_industry: "Professionalize the Mining Industry"
 SHX_profesionalize_the_mining_industry_desc: "Our mines cannot remain scattered and inefficient. Training managers, engineers, and workers will turn Shanxi's resources into real industrial strength."
 SHX_spearhead_the_breakthrough: "Spearhead the Breakthrough"
 SHX_spearhead_the_breakthrough_desc: "Taiyuan has always been one of the spearheads of breakthrough in industry and weapon production. It must become the spearhead of any research in China."
 SHX_self_sufficient_army: "Self-Sufficient Army"
 SHX_self_sufficient_army_desc: "An army that depends on distant allies is an army that can be abandoned. Our industry is now capable of supplying our men without the help of Nanjing, so they can defend Shanxi from any invader."
 SHX_armored_car_industry: "Armored Car Industry"
 SHX_armored_car_industry_desc: "Our arsenal in Taiyuan should be able to produce armored cars, even if archaic ones. A domestic armored car program will give our commanders the means to scout, raid, and respond quickly."
 SHX_the_provincial_air_force: "The Provincial Air Force"
 SHX_the_provincial_air_force_desc: "Even a provincial army must look to the skies. By forming our own air arm, Shanxi can defend its cities and support its troops without waiting for the help of Nanjing."
 SHX_anti_air_production: "Anti-Air Production"
 SHX_anti_air_production_desc: "Enemy aircraft can turn factories and railways into ruins in a single afternoon. Local anti-air production will give Shanxi the guns to protect itself."
 SHX_mountain_artillery: "Mountain Artillery"
 SHX_mountain_artillery_desc: "Shanxi's terrain rewards soldiers who can move heavy firepower through hard country. Mountain artillery will let our troops strike where ordinary guns cannot follow."
 SHX_guerrilla_warfare: "Guerrilla Warfare"
 SHX_guerrilla_warfare_desc: "If stronger enemies enter our valleys, they must find no safe road and no quiet night. Our citizen militias will make Shanxi impossible to pacify."
 SHX_utilize_the_terrain: "Utilize the Terrain"
 SHX_utilize_the_terrain_desc: "The mountains, passes, and river crossings of Shanxi are natural fortresses. We must train our soldiers to turn the land itself into a weapon."
 SHX_shanxi_prevails: "Shanxi Prevails"
 SHX_shanxi_prevails_desc: "The province has endured the Japanese-backed Mongol invasion of China and held its ground. Shanxi's survival is no small victory; it is proof that we are able to resist the Kwantung Army."
 SHX_the_suiyuan_catastrophe: "The Suiyuan Catastrophe"
 SHX_the_suiyuan_catastrophe_desc: "The Mongols have managed to conquer the north of our nation with the support of the Japanese. Our troops are scattered, our people is conquered, and rumours of a coup against Yan Xishan don't cease to be whispered in the streets of Taiyuan..."
 SHX_the_chahar_counteroffensive: "The Chahar Counteroffensive"
 SHX_the_chahar_counteroffensive_desc: "The enemy must not be allowed to consolidate beyond our frontiers. We must liberate our brothers in the north!"
 SHX_consolidate_our_gains: "Consolidate Our Gains"
 SHX_consolidate_our_gains_desc: "We have discovered countless weapon deposits all along our conquered lands in Mengjiang. These Japanese models will be really useful to supply our armies."
 SHX_cooperate_with_the_KMT: "Cooperate with the KMT"
 SHX_cooperate_with_the_KMT_desc: "Whatever our disagreements with Nanjing, the Kuomintang remains a pillar of the national resistance. Cooperation will preserve Shanxi and strengthen China."
 SHX_finish_off_mengjiang: "Finish Off Mengjiang"
 SHX_finish_off_mengjiang_desc: "Mengjiang's existence is a standing threat to the north. We must end this  regime before it can recover and menace Shanxi again."
 SHX_the_three_new_principles_of_the_people: "The Three New Principles of the People"
 SHX_the_three_new_principles_of_the_people_desc: "Yan Xishan's answer to China's crisis is not to imitate Sun Yat-sen's Three Principles of the People, but to refine them for an age of warlordism, foreign encroachment, and social decay. Nationalism must become disciplined patriotism; democracy must begin with ordered village self-government; and livelihood must be rooted in public morality, education, and rural reconstruction."
 SHX_the_principle_of_mincai: "The Principle of Mincai"
 SHX_the_principle_of_mincai_desc: "Mincai, prosperity. A people without livelihood cannot be expected to defend the nation, govern the village, or resist corruption. Through agricultural improvement, rural industry, public works, and the fair distribution of labor and reward, Shanxi shall enrich the common people and make prosperity the foundation of political renewal."
 SHX_the_principle_of_minde: "The Principle of Minde"
 SHX_the_principle_of_minde_desc: "Minde, virtue. The strength of a nation begins with the character of its people. Yan Xishan teaches that public morality, honesty, discipline, and loyalty to the community must be cultivated before any constitution can take root. A virtuous people shall not wait for salvation from above; they shall govern themselves from below."
 SHX_the_principle_of_minzhi: "The Principle of Minzhi"
 SHX_the_principle_of_minzhi_desc: "Minzhi, education. Ignorance is the ally of radicals, bandits, foreign powers, and every parasite that feeds upon a divided China. By expanding education, promoting practical knowledge, and awakening civic consciousness, Shanxi shall turn its villages into schools of self-government and its people into the architects of national revival."
 SHX_empower_the_villages: "Empower the Villages"
 SHX_empower_the_villages_desc: "The reconstruction of China cannot begin in distant ministries or in the speeches of generals. It must begin in the village, where the people live, work, and govern their daily affairs. By strengthening village self-government, local schools, militias, and public councils, Shanxi shall turn the countryside into the foundation of a disciplined and self-reliant society."
 SHX_the_fairness_doctrine: "The Doctrine of Fairness"
 SHX_the_fairness_doctrine_desc: "Gongdao, fairness. Yan Xishan's doctrine  rejects both selfish capitalism and destructive class struggle. Society must be ordered around fairness, public morality, and the common good, ensuring that wealth, labor, and authority serve the people rather than private greed or factional ambition. Only through fairness can unity be restored."
 SHX_the_land_to_the_villages: "The Land to the Villages"
 SHX_the_land_to_the_villages_desc: "The village is the root of the nation, and the land is the root of the village. By placing land under village ownership and communal responsibility, Shanxi shall weaken landlord exploitation, preserve rural order, and bind every household to the prosperity of the community."
 SHX_commit_to_our_ideals: "Commit to Our Ideals"
 SHX_commit_to_our_ideals_desc: "For years, the state monopoly over opium has filled our coffers while poisoning the very people we claim to uplift. Such hypocrisy can no longer be tolerated. If Shanxi is to stand as the model province of China, our principles must be more than slogans and proclamations."
 SHX_a_message_from_the_japanese: "A Message from the Japanese"
 SHX_a_message_from_the_japanese_desc: "After years of bloodshed, exhaustion has begun to weigh upon both sides. Japanese representatives have approached our government with cautious proposals for negotiation, seeking a ceasefire that would secure their position while sparing Shanxi from further devastation, with the excuse of uniting against the Communist guerrillas. This could be beneficial, but also put us in a weird spot in the eyes of Nanjing."
 SHX_negotiate_with_the_communists: "Negotiate with the Communists"
 SHX_negotiate_with_the_communists_desc: "The Communists have long been enemies of our government, agitators among the peasants, and rivals for the loyalty of the Chinese people. Yet the danger facing Shanxi no longer allows us the luxury of fighting every enemy at once. Through cautious negotiations, we may reach an understanding with the Red forces, turning their anti-Japanese zeal and rural organization toward the defense of the province. Trust will be scarce, but survival has never required affection."
 SHX_form_the_ximenghui: "Form the Ximenghui"
 SHX_form_the_ximenghui_desc: "The Ximenghui, also known as Sacrifice League, shall become the vessel of Shanxi's resistance. Bringing together patriots, students, reformers, and Communist organizers under our supervision, the Ximenghui will mobilize the villages for national salvation while keeping their revolutionary ambitions contained. If we cannot destroy the Communists, we shall bind them to our cause, arm their enthusiasm, and direct it against Japan before it turns against us."
 SHX_learn_from_the_rats: "Learn from the Rats"
 SHX_learn_from_the_rats_desc: "The Communists have survived by hiding, moving, and striking from difficult ground. We may despise their politics, but their methods are worth studying."
 SHX_purge_the_communists_from_our_ranks: "Purge the Communists from Our Ranks"
 SHX_purge_the_communists_from_our_ranks_desc: "Cooperation with the left has opened doors to dangerous influence, our forces no longer believe in Yan Xishan but whatever the Communists tell them. We must remove Communist officers from our ranks before they hollow out the province from within."
 SHX_accept_japanese_aid: "Accept Japanese Aid"
 SHX_accept_japanese_aid_desc: "The enemy of our enemy is our friend. It seems the Communists are a bigger problem for the Japanese than we are for them at the moment."
 SHX_recruit_japanese_volunteers: "Recruit Japanese Volunteers"
 SHX_recruit_japanese_volunteers_desc: "The war may be over, but Shanxi's struggle has only changed its name. Many Japanese soldiers remain within our territory, defeated yet disciplined, leaderless yet experienced. If these men are willing to fight the Communists under our command, then Shanxi shall make use of all the tools it has at her disposal."
 SHX_the_new_shanxi_army: "The New Shanxi Army"
 SHX_the_new_shanxi_army_desc: "The alliance with the Communists has served its purpose. Shanxi cannot be defended by men whose loyalty lies in a foreign book. By reorganizing the Sacrifice League's military networks under loyal command, we shall forge a new army for a new struggle: one that answers to Taiyuan alone."
 SHX_terrain_specialization: "Terrain Specialization"
 SHX_terrain_specialization_desc: "Our soldiers must master the terrain that defines Shanxi's wars. Specialized training will prepare them to defend the mountains, hills, rivers, and forests of our nation."
 SHX_import_industrial_equipment: "Import Industrial Equipment"
 SHX_import_industrial_equipment_desc: "Until our own industry matures, foreign machines can accelerate reconstruction. Imported equipment will help modernize factories that still rely on outdated methods."
 SHX_develop_the_model_province: "Develop the Model Province"
 SHX_develop_the_model_province_desc: "Yan Xishan through the years has turned Shanxi into a model province, one that can become the example of industrialization in China."
 SHX_educate_the_masses: "Educate the Villages"
 SHX_educate_the_masses_desc: "Public education must reach beyond just city schools. Every village must be taught literacy, discipline, and the habits of service to the nation."
 SHX_birth_of_a_navy: "Birth of a Navy"
 SHX_birth_of_a_navy_desc: "Shanxi is no maritime power, but China cannot be rebuilt with inland armies alone. A modest naval program will mark our first step toward a wider strategic horizon."
 SHX_modernize_our_army: "Modernize Our Army"
 SHX_modernize_our_army_desc: "Old formations and weapons cannot survive modern war. We must reorganize the army around training, equipment, and command fit for the battles ahead."
 SHX_denounce_chiang_kai_shek: "Denounce Chiang Kai-shek"
 SHX_denounce_chiang_kai_shek_desc: "Chiang Kai-shek has wrapped dictatorship in the flag of national unity, demanding obedience from the provinces while failing to protect China from foreign encroachment. His armies march readily against Chinese rivals, yet hesitate before Japan. Yan Xishan denounces the Generalissimo before the nation and calls upon every discontented commander to finish what was left undone in the Central Plains War."
 SHX_destroy_the_rats_burrow: "Destroy the Rats' Burrow"
 SHX_destroy_the_rats_burrow_desc: "The Communist base in Yan'an has become a burrow from which subversion spreads across all of China. We will strike it before the rats overrun the house."
 SHX_renounce_the_he_umezu_agreement: "Repudiate the He-Umezu Agreement"
 SHX_renounce_the_he_umezu_agreement_desc: "The He-Umezu Agreement stripped northern China of its defenses and left Hebei and Chahar exposed to Japanese pressure. Such humiliation can no longer be tolerated. Shanxi shall reject the weakness of Nanjing's concessions, and offer Hebei-Chahar a new path: unity under Taiyuan, armed resistance against Japan, and an end to the fiction that appeasement can preserve China."
 SHX_remember_the_guominjun: "Remember the Guominjun"
 SHX_remember_the_guominjun_desc: "The Guominjun was more than the army of Feng Yuxiang; it was a disciplined force forged in the chaos of the Warlord Era, capable of seizing Beijing, resisting rival cliques, and marching under the banner of national unification. Though its old banners were broken after the Central Plains War, its veterans and methods have not vanished."
 SHX_learn_from_the_japanese: "Learn from the Japanese"
 SHX_learn_from_the_japanese_desc: "Japan's victories were not born from courage alone, but from training, planning, and ruthless modernization. We can learn from their army without bowing to their empire."
 SHX_memories_of_the_expedition: "Memories of the Expedition"
 SHX_memories_of_the_expedition_desc: "The Northern Expedition promised unity and national renewal before Chiang Kai-Shek's ambitions poisoned China's future. The promise of a better future can guide a new struggle against division."
 SHX_second_central_plains_war: "The Second Central Plains War"
 SHX_second_central_plains_war_desc: "The first struggle against Chiang Kai-shek ended in defeat just because Zhang Xueliang's forces abandoned the frontier with Japan to save his skin. Nanjing has grown arrogant, demanding obedience from the provinces while failing to defend China from foreign force. The banners of resistance against Chiang must rise once more, and this time, there's no Fengtian ready to save him from his demise."
 SHX_the_new_republic: "The New Republic"
 SHX_the_new_republic_desc: "Chiang Kai-shek has fallen. From the mountains of Shanxi to the rivers of Guangdong, Yan Xishan now stands at the head of a new republic, one not with an army served by the people, but a citizen army for and by the people. Mincai, Minde, Minzhi, towards a new China."
 SHX_second_northeast_flag_replacement: "Second Northeast Flag Replacement"
 SHX_second_northeast_flag_replacement_desc: "The Northeast must once again acknowledge the authority of the Chinese republic rather than that of a separatist regime or foreign master. Its banners will be replaced and its armies brought into the national fold."
 SHX_strike_the_red_menace: "Strike the Red Menace"
 SHX_strike_the_red_menace_desc: "Communism remains a threat to any republic built on order and national unity. We must strike at anyone that support and arm the Communist guerrillas inside our borders."
 SHX_integrate_the_warlords: "Integrate the Warlords"
 SHX_integrate_the_warlords_desc: "If we are to defeat Chiang Kai-shek, we must unite our armies under a single command. The last war was lost because each warlord advanced on his own timetable, allowing Nanjing to isolate its enemies and defeat them one by one. Some commanders will resent surrendering their autonomy, but we cannot allow pride, rivalry, and provincial ambition to doom us again. This time, our armies must march as one."
 SHX_raid_the_north: "Raid the North"
 SHX_raid_the_north_desc: "The northern depots and rail lines still carry the spoils of Japanese meddling. Swift raids will seize weapons to supply our national people's army."
 SHX_guominjun_reborn: "Guominjun Reborn"
 SHX_guominjun_reborn_desc: "Born from Feng Yuxiang's break with the old warlord order, the Guominjun once stood as the army marching for reform and virtue. Yet its strength was spent in shifting alliances and finally broken after the Central Plains War. Now, with China divided and threatened once more, the time has come for the resurrection of the Guominjun."
 SHX_second_beijing_coup: "The Second Beijing Coup"
 SHX_second_beijing_coup_desc: "Beijing has fallen to Feng Yuxiang once before. In 1924, the Capital Revolution shattered the old Beiyang order and proved that a single army, acting at the right moment, could bend China’s future. The capital now sits behind the hollow shield of Hebei-Chahar, enslaved by fear and foreign pressure. History now has given us the rarest of luxuries: a chance to repeat a successful coup."
 SHX_contact_the_southern_warlords: "Contact the Southern Warlords"
 SHX_contact_the_southern_warlords_desc: "Chiang Kai-shek has wrapped dictatorship in the flag of national unity, demanding obedience from the provinces while failing to protect China from foreign encroachment. His armies march readily against Chinese rivals, yet hesitate before Japan. Feng Yuxiang denounces his old master before the nation and calls upon every discontented commander to finish what was left undone in the Central Plains War."
 SHX_unify_our_armies: "Unify Our Armies"
 SHX_unify_our_armies_desc: "If we are to defeat Chiang Kai-shek, we must unite our armies under a single command. The last war was lost because each warlord advanced on his own timetable, allowing Nanjing to isolate its enemies and defeat them one by one. Some commanders will resent surrendering their autonomy, but we cannot allow pride, rivalry, and provincial ambition to doom us again. This time, our armies must march as one."
 SHX_amend_our_mistake: "Amend Our Mistake"
 SHX_amend_our_mistake_desc: "The triumph of Chiang Kai-shek was not inevitable. When in 1927 the Kuomintang split between Wuhan and Nanjing, Feng Yuxiang chose the side that promised order, unity, and victory. What followed was dictatorship, betrayal, and the strangling of the revolution in the name of saving it. We once helped raise Chiang’s banner. Now we shall tear it down."
 SHX_the_righteous_republic: "The Righteous Republic"
 SHX_the_righteous_republic_desc: "China needs more than another flag over Beijing. It needs a republic rooted in faith, discipline, service, and national duty, purified of the corruption that ruined the old order."
 SHX_military_chaplains: "Military Chaplains"
 SHX_military_chaplains_desc: "Military chaplains were instruments of discipline, education, and moral reform within the Guominjun itself. Through sermons, scripture, and relentless instruction, the soldier was to become more than a hired rifle, he was to be remade into a servant of the nation, bound by faith, duty, and obedience."
 SHX_an_educated_army: "An Educated Army"
 SHX_an_educated_army_desc: "Feng Yuxiang understood that a soldier without knowledge, literacy, or a trade could too easily become tomorrow’s bandit. The Guominjun shall teach its men to read, work, and serve, so that even those who leave the ranks may return to China as citizens rather than delinquents."
 SHX_an_army_that_serves: "An Army That Serves"
 SHX_an_army_that_serves_desc: "The army must not live above the people like a tax collector with rifles. It must build roads, protect villages, and labor beside the common citizen, proving that national service means service to the people."
 SHX_the_principle_of_minzu: "The Principle of Minzu"
 SHX_the_principle_of_minzu_desc: "The idea of belonging to a nation - rather than a tribe or a religion - is what turns a group of people into a state. Therefore, we must enact the principle of Minzu, and ensure that all of the nation's people feel a strong sense of nationalism and patriotism, as well as a sense of unity under the central government."
 SHX_the_principle_of_minsheng: "The Principle of Minsheng"
 SHX_the_principle_of_minsheng_desc: "A modern state looks after its citizens so that in the time of need, the citizens will be able and willing to defend it. To that end, we must enact the principle of Minsheng and ensure that welfare can be provided to all of the nation's citizens."
 SHX_the_principle_of_minquan: "The Principle of Minquan"
 SHX_the_principle_of_minquan_desc: "The journey started by Dr. Sun Yat-sen will eventually lead to a unified republic. It will no doubt be a long journey, but we take it one step at a time. The first one, would be to enact the principle of Minquan and ensure that the vote is extended to all Chinese citizens."
 SHX_one_party_state: "One-Party State"
 SHX_one_party_state_desc: "Democracy must not mean paralysis. By placing national representation under one disciplined party, we can preserve a constitutional government while preventing factionalism from tearing China apart again."
 SHX_feng_yuxiangs_premiership: "Feng Yuxiang's Premiership"
 SHX_feng_yuxiangs_premiership_desc: "Feng Yuxiang carries the memory of the Guominjun and the authority of a soldier-preacher. His premiership would make the new republic stern, moral, and unmistakably anti-corruption."
 SHX_soong_chin_lings_premiership: "Soong Ching-ling's Premiership"
 SHX_soong_chin_lings_premiership_desc: "Soong Ching-ling embodies the unfinished promise of Sun Yat-sen. Her premiership can give the republic democratic legitimacy, social reform, and a bridge to patriotic forces beyond Shanxi."
 SHX_li_dequans_premiership: "Li Dequan's Premiership"
 SHX_li_dequans_premiership_desc: "Li Dequan brings Christian reform, women's organization, and social service into the heart of government. Her premiership would make the republic a vessel for moral renewal."
 SHX_the_only_way: "The Only Way"
 SHX_the_only_way_desc: "Neither parliamentary quarrels nor communist atheism can help China. The Guominjun's loyalty lies beyond party, in a disciplined nation guided by Christian virtue and patriotic duty."
 SHX_punish_the_unvirtuous: "Punish the Unvirtuous"
 SHX_punish_the_unvirtuous_desc: "Officials who exploit the people are officers who betray the cause and poison the republic from within. Public virtue requires public consequences."
 SHX_an_army_with_a_state: "An Army With a State"
 SHX_an_army_with_a_state_desc: "The Guominjun shall not become an army apart from the people, nor a state apart from its soldiers. Its regiments will guard the frontier, build the roads, till the fields, and labor in the workshops, binding military service to the economy of the nation. This is not a state with an army, but an army with a state."
 SHX_chinese_institute_for_women: "Chinese Institute for Women"
 SHX_chinese_institute_for_women_desc: "Feng Yuxiang believes that China's women are being wasted on vanity and idleness while the nation suffers. They shall be taught, organized, and prepared to serve the country, so they can one day rival the women of the West."
 SHX_avenge_the_peoples_anti_japanese_army: "Avenge the People's Anti-Japanese Army"
 SHX_avenge_the_peoples_anti_japanese_army_desc: "In 1933, as Japan tightened its grip over the north, Feng Yuxiang raised the Chahar People's Allied Anti-Japanese Army and called upon China to resist. We drove the invaders from several towns, proving that the lost provinces could still be fought for. Yet Chiang Kai-shek answered forcing us to lower the banner we had raised. Now, no order from Nanjing will silence the call to resist."
 SHX_recall_soviet_advisors: "Recall Soviet Advisors"
 SHX_recall_soviet_advisors_desc: "Feng Yuxiang once welcomed Soviet instructors and technical expertise, but never surrendered his army to their politics, however, Chiang Kai-shek cast them out in the 1927. We shall recall them only for as long as China needs their knowledge."
 SHX_an_example_of_austerity: "An Example of Austerity"
 SHX_an_example_of_austerity_desc: "Feng Yuxiang does not command from silk cushions or banquet halls. He eats the same cold food as his soldiers, trains beside them in the field, and demands from his officers to hold no luxury they would deny the rank and file."
 SHX_the_best_of_the_best: "The Best of the Best"
 SHX_the_best_of_the_best_desc: "Boxing, gymnastics, swimming, forced marches, trench-digging contests, obstacle courses, and field exercises in bitter weather separated the weak from the worthy in the Guominjun. Officers and men alike will endure the same trials, until only the strongest, fastest, and most disciplined remain fit to carry China's banner."
 SHX_retire_abusive_taxes: "Retire Abusive Taxes"
 SHX_retire_abusive_taxes_desc: "The peasants of China have long been bled by taxes on salt, flour, meat, tea, timber, and every other necessity that keeps a village alive. Feng Yuxiang will sweep away once again these abusive levies, even if the treasury groans under the loss. A state that fattens itself by starving its farmers is not strong, only rotten."
 SHX_remember_mukden: "Remember Mukden"
 SHX_remember_mukden_desc: "In 1931, Chiang Kai-shek chose not to resist at Mukden, surrendering the Northeast while Japan learned that China could be pushed back without consequence. Feng Yuxiang will not repeat that shame. Every crossing, every railway, every village, and every city shall resist against the invader."
 SHX_strike_the_enemies_of_christianism: "Strike the Enemies of Christianity"
 SHX_strike_the_enemies_of_christianism_desc: "Those who persecute faith and preach class hatred threaten the moral foundations of the republic. We will strike them before their poison spreads further through China."

 #GUANGXI GUANGDONG
 GXC_the_wealth_beneath_the_mountains_desc: "Guangxi's rugged interior conceals rich deposits that have long remained beyond the reach of modern industry. By surveying the mountains, opening new mines, and linking them to the provincial economy, we can turn buried wealth into lasting prosperity."
 GXC_the_babu_powerplant: "The Babu Power Plant"
 GXC_the_babu_powerplant_desc: "The mines and workshops of eastern Guangxi cannot expand while their power supply remains unreliable. A new generating station at Babu will electrify the region and provide the foundation for further industrial growth."
 GXC_ask_investments_from_the_chinese_overseas: "Seek Investment from Overseas Chinese"
 GXC_ask_investments_from_the_chinese_overseas_desc: "Chinese communities abroad have accumulated capital, expertise, and commercial connections while retaining strong ties to their ancestral homeland. We shall appeal to their patriotism and invite them to invest in Guangxi's development."
 GXC_mechanize_the_mining_industry: "Mechanize the Mining Industry"
 GXC_mechanize_the_mining_industry_desc: "Hand tools and scattered workings cannot satisfy the needs of a modern province. Imported machinery, trained engineers, and systematic extraction will greatly increase the output of Guangxi's mines."
 GXC_expand_the_port_of_wuzhou: "Expand the Port of Wuzhou"
 GXC_expand_the_port_of_wuzhou_desc: "Wuzhou stands at the meeting point of Guangxi's river trade and the markets of Guangdong. Enlarging its docks, warehouses, and transport links will give our industries a dependable gateway to the coast."
 GXC_the_arsenals_of_guangxi: "The Arsenals of Guangxi"
 GXC_the_arsenals_of_guangxi_desc: "A provincial army cannot rely indefinitely upon weapons purchased from uncertain friends abroad. New arsenals in Guangxi will supply our troops with the arms and ammunition required to defend the province."
 GXC_our_own_opium_fields: "Our Own Opium Fields"
 GXC_our_own_opium_fields_desc: "Opium revenues remain too important to abandon at once, but dependence upon outside suppliers drains wealth from Guangxi. Cultivating the crop under provincial supervision will keep the trade, and its profits, in our own hands."
 GXC_expand_public_education: "Expand Public Education"
 GXC_expand_public_education_desc: "Modern government and industry require a literate population. By opening schools throughout the towns and countryside, we can prepare a new generation of teachers, technicians, officers, and civil servants."
 GXC_get_rid_of_the_poison: "Get Rid of the Poison"
 GXC_get_rid_of_the_poison_desc: "Opium may fill the treasury, but it impoverishes families, weakens workers, and corrodes the nation. The time has come to suppress the trade and free Guangxi from this poisonous dependence."
 GDC_revisit_the_three_year_plan: "Revisit the Three-Year Plan"
 GDC_revisit_the_three_year_plan_desc: "Guangdong's earlier program of reconstruction provided an ambitious blueprint for roads, factories, and public works. We shall revise the Three-Year Plan in light of present conditions and resume the modernization of the province."
 GDC_the_silk_of_guangzhou: "The Silk of Guangzhou"
 GDC_the_silk_of_guangzhou_desc: "Guangzhou's silk has crossed the seas for centuries, yet outdated workshops prevent the industry from reaching its potential. Modern mills and commercial facilities will restore southern silk to a place of prominence in world markets."
 GDC_the_arsenals_of_guangdong: "The Arsenals of Guangdong"
 GDC_the_arsenals_of_guangdong_desc: "Our political independence rests upon the strength of our army, and that army must be supplied at home. Expanding Guangdong's arsenals will secure a steady flow of rifles, guns, and ammunition."
 GDC_finish_the_donglang_steel_works: "Finish the Donglang Steel Works"
 GDC_finish_the_donglang_steel_works_desc: "The unfinished steel works at Donglang are a monument to plans left incomplete. By bringing the furnaces into operation, we will provide Guangdong's factories and arsenals with a reliable domestic source of steel."
 GDC_the_jewel_of_the_south: "The Jewel of the South"
 GDC_the_jewel_of_the_south_desc: "Prosperous, educated, and open to the wider world, Guangdong can become the model of a modern Chinese province. Investment in higher learning and technical expertise will make it the undisputed jewel of southern China."
 GXC_kneel_before_chiang: "Kneel Before Chiang"
 GXC_kneel_before_chiang_desc: "With Guangdong fallen, the offensive on Hunan has failed to dislodge Chiang Kai-shek, and further resistance would only expose Guangxi to ruin. We must accept Nanjing's authority and preserve what influence we can within the national government."
 GXC_the_southern_twin_dragons: "The Southern Twin Dragons"
 GXC_the_southern_twin_dragons_desc: "Chiang Kai-shek sought to conquer the southern provinces and bring them beneath Nanjing's authority. Instead, Guangxi and Guangdong stood together, combining their armies, resources and political influence until the central government was forced to retreat. Two twin dragons in Liangguang have emerged victorious, and no power in China can now afford to dismiss the strength of the south."
 GXC_negotiations_in_guangdong: "Negotiations in Guangdong"
 GXC_negotiations_in_guangdong_desc: "Guangxi has long provided the soldiers and commanders of the southern alliance, while Guangdong possesses the ports, industries and revenues needed to sustain them. With war in China closer than ever, we could convince a couple of government officials to give us a hand."
 GXC_enemies_of_enemies: "Enemies of Enemies"
 GXC_enemies_of_enemies_desc: "Communists, warlords and the central government in Nanjing all compete for control of China, yet each also faces rivals too dangerous to confront alone. Yesterday's enemy may become today's partner, this, in this struggle of shifting loyalties, Guangxi must exploit every rivalry, negotiate with every faction and ensure that our enemies remain more occupied with one another than with us."
 GXC_director_li_zongren: "Director Li Zongren"
 GXC_director_li_zongren_desc: "Li Zongren is the founder, senior commander and recognised leader of the New Guangxi Clique. His authority can preserve cooperation between the military reformers, provincial administrators and political allies upon whom our position depends. By confirming the Director as the first among equals, Guangxi will be led by the man best able to unite its institutions and command its loyalty in both peace and war."
 GXC_the_three_yu: "The Three Yu "
 GXC_the_three_yu_desc: "Yu Bing Yu Tuan, the soldier will be placed within the militia, transforming organized civilians into a trained reserve. Yu Jiang Yu Xue, the commander will be cultivated within the school, preparing educated students to serve as officers. Yu Zheng Yu Mu, recruitment will be organized into a system of universal military obligation. The entire province at the service of national defence..."
 GXC_the_three_in_one_system: "The Three-in-one System"
 GXC_the_three_in_one_system_desc: "The principles of the Three Yu must be carried into every village of Guangxi. Local chiefs shall also direct the basic schools and command the militia reserves, uniting civil administration, education and military organization under a single authority. The schoolhouse, government office and mobilization centre will become three functions of the same institution."
 GXC_deputy_bai_chongxi: "Deputy Bai Chongxi"
 GXC_deputy_bai_chongxi_desc: "Bai Chongxi has long been the architect behind Guangxi's armies, directing campaigns through careful planning, rapid manoeuvre and an exacting programme of military reform. By granting the Little Zhuge pre-eminence within the triumvirate, strategy and preparedness will guide every decision of the provincial government."
 GXC_the_organization_and_training_committee: "The Organization and Training Committee"
 GXC_the_organization_and_training_committee_desc: "Danger is posed not only by armies beyond our borders, but by disloyalty within our own ranks. Under Wang Gongdu, the Organization and Training Committee will establish a network extending through the military, provincial administration, schools and political associations. People must be watched and suspicious activities investigated before they can threaten the unity of the clique."
 GXC_invest_into_the_xiang_gui_railway: "Invest in the Xiang-Gui Railway"
 GXC_invest_into_the_xiang_gui_railway_desc: "Guangxi's mountains and inadequate roads have long isolated the province from the markets and railways of central China. By extending the Xiang-Gui Railway from Hunan through Guilin and toward Liuzhou, we will create a dependable inland artery for troops, machinery and commerce."
 GXC_chairman_huang_xuchu: "Chairman Huang Xuchu"
 GXC_chairman_huang_xuchu_desc: "Huang Xuchu has always kept the machinery of Guangxi functioning. His administration has overseen provincial finances, education and reconstruction, providing the stable foundation upon which the power of the clique rests. By placing him at the head of the triumvirate, military ambition will be tempered by orderly government and sustained development."
 GXC_organize_the_student_armies: "Organize the Student Armies"
 GXC_organize_the_student_armies_desc: "The successive Student Armies have demonstrated that educated youth can serve Guangxi. Organized along military lines and trained to propagandize, organize and fight, they will mobilize rural communities, maintain communications, transport supplies, gather intelligence and prepare local guerrillas."
 GXC_recruit_female_volunteers: "Recruit Female Volunteers"
 GXC_recruit_female_volunteers_desc: "Dedicated women's companies shall be formed within the Student Armies and trained for propaganda, communications, transport, intelligence and battlefield service. They will evacuate civilians, carry supplies, disrupt enemy roads and, when necessary, take up rifles and grenades alongside their male comrades. National service shall be determined by ability and resolve, not by sex."
 GXC_a_triumvirate: "A Triumvirate"
 GXC_a_triumvirate_desc: "Chen Jitang and his allies hope to exploit the differences between the three men who govern Guangxi. Yet Li Zongren provides leadership, Bai Chongxi directs the army and Huang Xuchu maintains the provincial administration; none can preserve our position without the others. Whatever promises are offered from Guangdong or Hunan, the Triumvirate will prevail."
 GXC_huang_xuchu_and_a_gang_of_four: "Huang Xuchu and a Gang of Four"
 GXC_huang_xuchu_and_a_gang_of_four_desc: "The alliance with Guangdong and annexation of Hunan has created a new centre of power around Chen Jitang, Li Jishen, Chen Qiyou and Zhao Hengti, though divided by ambition and ideology, all four share an interest in restraining Bai Chongxi and ending Guangxi's domination of the southern coalition. Evil tongues even tell they're trying to gain the favour of Huang Xuchu..."
 GXC_integrate_the_banks_of_guangdong: "Integrate the Banks of Guangdong"
 GXC_integrate_the_banks_of_guangdong_desc: "Political union means little while Guangdong's wealth remains controlled by institutions loyal to its provincial leaders. Its banks must be brought under a common Liangguang authority, coordinating credit, currency and public investment across both provinces. Chen Jitang and his allies will denounce this as an assault upon Guangdong's autonomy, but the resources of the south can no longer be divided by rivalries"
 GXC_rally_the_federalists: "Rally the Federalists"
 GXC_rally_the_federalists_desc: "The federalists seek to reunite the nation as a federation of self-governing provinces, protected by constitutional government and genuine local autonomy. By rallying their surviving networks in Guangdong, Hunan and abroad, we can provide the southern coalition with a political purpose greater than the ambitions of its generals."
 GXC_welcome_the_fujian_exiles: "Welcome the Fujian Exiles"
 GXC_welcome_the_fujian_exiles_desc: "In 1933, Li Jishen and the commanders of the 19th Route Army broke with Chiang Kai-shek and began a revolution in Fujian. Their attempt to combine political reform, resistance to Japan and opposition to Nanjing was swiftly crushed, however, by welcoming these soldiers, politicians and revolutionaries, their failed uprising may yet become the foundation of a broader southern movement."
 GXC_denounce_the_baojia_system: "Denounce the Baojia System"
 GXC_denounce_the_baojia_system_desc: "The New Guangxi Clique presents the baojia and the Three Yu as instruments of collective defence, but beneath their slogans lies the subordination of society to the army. Households are registered for recruitment, schools are made to produce officers, and village officials command the same militia that watches their neighbours. The people of Liangguang must be citizens, not reserves awaiting mobilization."
 GXC_the_guangzhou_incident: "The Guangzhou Incident"
 GXC_the_guangzhou_incident_desc: "Protests have spread through Guangzhou, threatening both the financial settlement and the authority of the government. Bai Chongxi has ordered the baojia into the city to secure the banks, government offices and other vital institutions before the unrest can paralyse the provincial administration. The demonstrators must be dispersed before our opponents can turn this into open rebellion."
 GXC_a_day_without_blood: "A Day Without Blood"
 GXC_a_day_without_blood_desc: "The baojia have entered Guangzhou to secure banks, government offices, and other vital institutions, yet their movements are marked by hesitation and confusion. Units remain idle, orders go unanswered and officers seem unwilling to confront the crowds gathering around them. Whatever has disrupted Bai Chongxi's chain of command, the machinery of repression is faltering."
 GXC_execute_wang_gongdu: "Execute Wang Gongdu"
 GXC_execute_wang_gongdu_desc: "Through the Organization and Training Committee, Wang Gongdu has accumulated an extensive network among Guangxi's officers, officials, schools and political cadres. Such influence can no longer be tolerated in the hands of a man whose loyalties and ambitions remain uncertain..."
 GXC_rally_the_KMT_RCA: "Rally the KMT-RCA"
 GXC_rally_the_KMT_RCA_desc: "The Kuomintang Revolutionary Comrades Association was created to unite Guangxi's officers, officials and political activists within a disciplined organization independent of Chiang Kai-shek. With its internal rivals purged, it can be expanded into the political backbone of the province. The revolutionary spirit of the Kuomintang shall be restored under the direction of Guangxi."
 GXC_denounce_the_central_government: "Denounce the Central Government"
 GXC_denounce_the_central_government_desc: "Nanjing claims to speak for all China while suppressing every province and party that questions Chiang's authority. We shall expose its failures and declare that obedience to such a government is no patriotic duty."
 GXC_march_into_nanjing: "March into Nanjing"
 GXC_march_into_nanjing_desc: "Words and provincial maneuvering have carried us as far as they can. Our columns will advance upon the capital, overthrow Chiang's regime, and settle the leadership of the republic by force of arms."
 GXC_the_strengthened_republic: "The Strengthened Republic"
 GXC_the_strengthened_republic_desc: "Victory gives us the opportunity to repair the institutions weakened by dictatorship and civil war. A stronger republic will combine constitutional government with the authority needed to defend national unity."
 GXC_second_northeast_flag_replacement: "The Second Northeast Flag Replacement"
 GXC_second_northeast_flag_replacement_desc: "The Northeast must once again acknowledge the authority of the Chinese republic rather than that of a separatist regime or foreign master. Its banners will be replaced and its armies brought into the national fold."
 GXC_erradicate_communism: "Eradicate Communism"
 GXC_erradicate_communism_desc: "Communist organization exploits poverty and disorder to divide the nation along class lines. We will destroy its armed forces, dismantle its networks, and deny it any refuge within the republic."
 GXC_director_chen_jitang: "Director Chen Jitang"
 GXC_director_chen_jitang_desc: "The fall of Bai Chongxi has preserved the southern coalition, but it has not completed the work of the revolution. China remains divided, its institutions fragile and its people unprepared for constitutional government. Under Chen Jitang, the Gang of Four will maintain a disciplined administration, continuing political tutelage until order, education and national unity make genuine democracy possible."
 GXC_chairman_li_jishen: "Chairman Li Jishen"
 GXC_chairman_li_jishen_desc: "Political tutelage was never intended to become permanent rule by generals and party officials. Sun Yat-sen envisioned it as a bridge toward constitutional government, and under Li Jishen, elections will be organized throughout the southern provinces, political restrictions relaxed and the citizens of Liangguang prepared to govern themselves, as he expected the Kuomintang to do."
 GXC_tax_foreign_goods: "Tax Foreign Goods"
 GXC_tax_foreign_goods_desc: "Foreign manufactures flood our ports and smother domestic enterprise before it can mature. Protective duties will fund the state while giving Chinese workshops room to compete."
 GXC_expand_the_ren_ai_shantang: "Expand the Ren'ai Shantang"
 GXC_expand_the_ren_ai_shantang_desc: "The Ren'ai Shantang has shown that public relief can provide both care and guidance. Its network shall be extended throughout the southern provinces, establishing clinics, hospitals, maternity wards and orphanages wherever they are needed, as well as reading rooms and public lectures, in which institutions will also promote benevolence and the traditional virtues upon which an orderly society must rest."
 GXC_victory_for_the_KMT_RC: "Victory for the KMT-RC"
 GXC_victory_for_the_KMT_RC_desc: "The Kuomintang Revolutionary Committee has prevailed over its competitors and will reclaim the Kuomintang from Chiang's personal clique. Sun Yat-sen's movement can now be renewed under collective and genuinely republican leadership."
 GXC_victory_for_the_PPP: "Victory for the PPP"
 GXC_victory_for_the_PPP_desc: "The Productive People's Party has secured the mandate to reshape the south. Its program of popular welfare, national development, and resistance to dictatorship will guide the new government."
 GXC_victory_for_the_ZGD: "Victory for the ZGD"
 GXC_victory_for_the_ZGD_desc: "The Zhigongdang has won the confidence of the south and will pursue its vision of a federal China. Provincial autonomy, constitutional government, and the support of overseas Chinese communities will unite the republic without replacing Chiang's dictatorship with another centralized regime."
 GXC_soong_ching_lings_premiership: "Soong Ching-ling's Premiership"
 GXC_soong_ching_lings_premiership_desc: "As the widow of Sun Yat-sen and an unwavering critic of authoritarian rule, Soong Ching-ling commands unmatched moral prestige. Her premiership will present our government as the true guardian of the revolution."
 GXC_li_jishens_premiership: "Li Jishen's Premiership"
 GXC_li_jishens_premiership_desc: "Li Jishen's military experience and moderate republicanism make him a natural mediator among the victorious coalition. As premier, he will turn opposition to Chiang into a durable national program."
 GXC_chen_mingshus_premiership: "Chen Mingshu's Premiership"
 GXC_chen_mingshus_premiership_desc: "Chen Mingshu has opposed both Japanese aggression and Chiang Kai-shek's dictatorship. His premiership will combine patriotic resistance with the democratic and social reforms the Chinese people deserves."
 GXC_chen_qiyous_premiership: "Chen Qiyou's Premiership"
 GXC_chen_qiyous_premiership_desc: "Chen Qiyou offers the coalition a principled advocate of democracy and federal reform. Under his premiership, the government will disperse power and restore political life beyond the old military cliques."
 GXC_zhao_hengtis_premiership: "Zhao Hengti's Premiership"
 GXC_zhao_hengtis_premiership_desc: "Zhao Hengti's experience with provincial government and constitutional federalism can reconcile local autonomy with national cooperation. His premiership will give the provinces a voice in the republic's reconstruction."
 GXC_denounce_the_illegitimate_revolution: "Denounce the Illegitimate Revolution"
 GXC_denounce_the_illegitimate_revolution_desc: "Chiang Kai-shek has betrayed the revolution while continuing to rule in its name. We will deny his government any claim to Sun Yat-sen's legacy and call upon true republicans to join us."
 GXC_liberate_the_people_of_nanjing: "Liberate the People of Nanjing"
 GXC_liberate_the_people_of_nanjing_desc: "The citizens of Nanjing live beneath the surveillance and coercion of a government that fears its own people. Our advance will free the capital and return political power to those in whose name the republic was founded."
 GXC_the_true_republic: "The True Republic"
 GXC_the_true_republic_desc: "China will no longer be a republic in name and a personal dictatorship in practice. Representative institutions, civil rights, and accountable government will make the promises of the revolution real at last."
 GXC_liberate_the_northeast: "Liberate the Northeast"
 GXC_liberate_the_northeast_desc: "The Northeast remains severed from the nation and exploited by foreign imperialism. China cannot call itself free until its people, cities, and resources have been restored to the republic."
 GXC_second_preliminary_agreement: "The Second Preliminary Agreement"
 GXC_second_preliminary_agreement_desc: "The Preliminary Agreement of 1933 ended hostilities between the 19th Route Army and the Chinese Soviet Republic, reopened trade across their borders and prepared both sides for common action against Chiang Kai-shek and Japan. We should draft a new agreement, one that unites us against the enemies of China."
 GXC_the_principle_of_minquan: "The Principle of Minquan"
 GXC_the_principle_of_minquan_desc: "Popular sovereignty is one of Sun Yat-sen's Three Principles and the foundation of legitimate government. Elections, constitutional protections, and civic participation will return political authority to the people."
 GXC_the_principle_of_minsheng: "The Principle of Minsheng"
 GXC_the_principle_of_minsheng_desc: "National renewal is meaningless if ordinary people remain trapped in hunger and insecurity. The Principle of People's Livelihood demands social welfare, economic justice, and the fair use of China's resources."
 GXC_the_principle_of_minzu: "The Principle of Minzu"
 GXC_the_principle_of_minzu_desc: "China's peoples must stand together as an independent nation, free from foreign domination and internal division. A common civic identity will unite the republic without erasing its many communities."
 GXC_sun_yat_sens_dream: "Sun Yat Sen's Dream"
 GXC_sun_yat_sens_dream_desc: "A modern republic cannot be built by silencing every disagreement. Scholars, journalists, workers, and citizens must be free to debate the nation's future without fearing imprisonment for their ideas."
 GXC_socialist_economy: "A Socialist Economy"
 GXC_socialist_economy_desc: "Private wealth has too often served landlords, compradors, and foreign interests rather than the Chinese people. Public planning and social ownership will direct production toward national and popular needs."
 GXC_revisit_the_class_struggle: "Revisit the Class Struggle"
 GXC_revisit_the_class_struggle_desc: "China cannot be divided neatly between virtue and guilt according to property alone. A corrupt official or worker may bring harm to the people, while an honest merchant or industrialist may contribute to national production. We shall unite workers, peasants and all productive citizens against those who live through coercion and abuse. Class struggle must liberate the people, not become vengeance."
 GXC_expropiate_foreign_companies: "Expropriate Foreign Companies"
 GXC_expropiate_foreign_companies_desc: "Foreign companies extract Chinese labor and resources while exporting their profits abroad. Their holdings will be seized and placed at the service of national reconstruction."
 GXC_the_agrarian_reform: "The Agrarian Reform"
 GXC_the_agrarian_reform_desc: "The countryside cannot prosper while vast estates coexist with landless and indebted peasants. Redistributing land and protecting cultivators will break rural oligarchies and give millions a stake in the new order."
 GXC_the_three_constructions: "The Three Constructions"
 GXC_the_three_constructions_desc: "Chen Jiongming's Three Constructions placed China's reconstruction within an ever-widening federal project; first the nation, then Asia, and finally the world. The Zhigongdang must begin by proving that autonomous provinces can unite voluntarily under a stable constitutional government."
 GXC_strike_at_the_kuomintang: "Strike at the Kuomintang"
 GXC_strike_at_the_kuomintang_desc: "The old Kuomintang apparatus will always threaten a government committed to genuine popular rule. We must dismantle its political machines and defeat the forces still loyal to Chiang."
 GXC_the_federation: "The Federation"
 GXC_the_federation_desc: "China's unity need not require the absolute rule of a distant capital. A federal republic can preserve provincial self-government while joining every region in defense, commerce, and common national institutions."
 GXC_the_missing_piece: "The Missing Piece"
 GXC_the_missing_piece_desc: "Our federal project cannot be complete while a vital region remains outside the constitutional settlement. Diplomacy, pressure, or force must bring the missing piece into the union."
 GXC_draw_support_from_the_overseas_chinese: "Draw Support from Overseas Chinese"
 GXC_draw_support_from_the_overseas_chinese_desc: "Chinese communities across Southeast Asia and the wider world have long supported the strugge of the federalists of the Zhigongdang. Their donations and expertise can once again sustain a cause for true democracy."
 GXC_attract_private_initiatives: "Attract Private Initiatives"
 GXC_attract_private_initiatives_desc: "The state alone cannot provide every factory, shop, or service required by a growing economy. Secure property, accessible credit, and carefully chosen incentives will encourage entrepreneurs to invest for a better federation."
 GXC_the_construction_of_jianguo: "The Construction of Jianguo"
 GXC_the_construction_of_jianguo_desc: "The first construction concerns China itself. Provincial autonomy must be reconciled with national unity through a democratic federation, replacing military rule and party dictatorship with constitutional cooperation."
 GXC_the_construction_of_jianya: "The Construction of Jianya"
 GXC_the_construction_of_jianya_desc: "The second construction carries the federal principle beyond China's borders. The peoples of Asia must be liberated from imperial domination and brought together as equal, self-governing nations rather than subjects of a new empire."
 GXC_the_construction_of_jianshi: "The Construction of Jianshi"
 GXC_the_construction_of_jianshi_desc: "The final construction looks beyond race, nation and class toward a federation of all peoples founded upon equality, national self-determination and mutual aid. Maybe one day Chen Jiaoming's dream of a planet without borders and mindless wars will be achieved..."
 GXC_expand_the_baojia: "Expand the Baojia"
 GXC_expand_the_baojia_desc: "The baojia system has bound the villages and households of Guangxi to the defence of the province. By expanding its registers, intensifying military instruction and demanding a greater contribution from every community, we can create a vast reserve of recruits ready to reinforce our armies at a moment's notice."
 GXC_adopt_the_guangdong_reforms: "Adopt the Guangdong Reforms"
 GXC_adopt_the_guangdong_reforms_desc: "Guangdong has demonstrated that provincial strength need not depend upon local levies alone. By adopting its centralized command structure, permanent formations and investment in modern arms, we can expand our regular army into a disciplined force capable of fighting prolonged campaigns far beyond the borders of Guangxi."
 GXC_guerrilla_warfare: "Guerrilla Warfare"
 GXC_guerrilla_warfare_desc: "A stronger invader may seize cities and railways, but it cannot occupy every village and valley. Mobile bands, local intelligence, and sudden attacks will make each advance costly and insecure."
 GXC_utilize_the_terrain: "Utilize the Terrain"
 GXC_utilize_the_terrain_desc: "Guangxi's broken landscape is an obstacle only to those who do not understand it. Careful reconnaissance and local training will turn rivers, hills, forests, and narrow roads into weapons of war."
 GXC_fight_behind_their_lines: "Fight Behind Their Lines"
 GXC_fight_behind_their_lines_desc: "The enemy's rear is filled with vulnerable depots, bridges, communications, and isolated garrisons. Infiltration units will disrupt them, forcing frontline troops to look constantly over their shoulders."
 GXC_defend_from_our_mountains: "Defend from Our Mountains"
 GXC_defend_from_our_mountains_desc: "The mountains of Guangxi have sheltered armies and communities for generations. Fortified passes, concealed supply routes, and troops accustomed to the heights will make them the backbone of our defense."
 GXC_strike_from_the_jungles: "Strike from the Jungles"
 GXC_strike_from_the_jungles_desc: "Dense southern jungles conceal movement and punish conventional formations. Soldiers trained to survive and maneuver beneath their cover will strike the enemy where maps and machines offer little protection."
 GXC_terrain_specialization: "Terrain Specialization"
 GXC_terrain_specialization_desc: "General training is no substitute for mastery of the ground upon which we expect to fight. Specialized formations will prepare for mountain, jungle, river, and irregular operations across southern China."
 GXC_build_a_provincial_air_force: "Build a Provincial Air Force"
 GXC_build_a_provincial_air_force_desc: "Guangxi's soldiers cannot remain helpless beneath hostile aircraft or dependent upon distant allies for reconnaissance. A provincial air arm will give us eyes, protection, and striking power of our own."
 GXC_study_western_designs: "Study Western Designs"
 GXC_study_western_designs_desc: "Western aircraft manufacturers have accumulated experience that our young aviation industry lacks. Studying and licensing proven designs will allow us to close the gap without repeating every costly mistake."
 GXC_guangdong_anti_air_production: "Guangdong Anti-Air Production"
 GXC_guangdong_anti_air_production_desc: "The workshops and arsenals of Guangdong can supply the weapons needed to protect southern skies. Coordinated production of anti-aircraft guns will shield our cities, factories, and armies from bombardment."
 GXC_promote_national_designers: "Promote National Designers"
 GXC_promote_national_designers_desc: "Foreign models can teach us much, but permanent dependence is incompatible with national strength. Supporting Chinese engineers and aircraft firms will create an aviation industry capable of designing for our own needs."
 GXC_welcome_the_koreans: "Welcome the Koreans"
 GXC_welcome_the_koreans_desc: "There are already Koreans living in our territories in Manchuria, specially in the region of Jiandao where they are a majority. Now that our federation is aiming to have greater reach than just China, it could be a nice idea to allow them to formally join the federation."
 GXC_invite_the_overseas_chinese: "Invite the Overseas Chinese"
 GXC_invite_the_overseas_chinese_desc: "There are many regions in South East Asia with a Chinese majority. Now that our federation is aiming to have greater reach than just China, it would be a nice idea to allow them to formally join the federation."
 GXC_chen_jiaomings_dream: "Chen Jiaoming's Dream"
 GXC_chen_jiaomings_dream_desc: "Now that China and Asia have stabilized under a true democracy, the time has come to ask the question, maybe Chen Jiaoming's dream of a world federation without borders and mindless wars can be achieved."
 
 #FRANCE
 FRA_the_second_spartacus: "Moi, Spartacus"
 FRA_the_second_spartacus_desc: "Just how Spartacus rallied the slaves during the Third Servile War against the Roman Empire, we shall lead the subjugated French against the Germans, they shall not pass!"
 FRA_contact_de_gaulle: "Contact de Gaulle"
 FRA_contact_de_gaulle_desc: "Charles de Gaulle has managed to unite an important force of freedom fighters against the Germans. We must try to unite with these armies in order to march together to Berlin."
 FRA_alone_against_all_odds: "Alone Against All Odds"
 FRA_alone_against_all_odds_desc: "We can't trust Charles de Gaulle and his Government in Exile, which is no more than a British puppet that blindly follows their commands. We will do this alone, and we'll do it right."
 FRA_collaborate_with_the_maquis: "Collaborate with the Maquis"
 FRA_collaborate_with_the_maquis_desc: "We must collaborate with the Maquis to have greater opportunities against the Wehrmacht."
 FRA_recover_our_lost_colonies: "Recover Our Lost Colonies"
 FRA_recover_our_lost_colonies_desc: "The old empire was not surrendered by right, only by circumstance. France will press its claims once more."
 FRA_avenge_the_paris_treaty: "Avenge the Paris Treaty"
 FRA_avenge_the_paris_treaty_desc: "The treaty that stripped France of its American empire will be answered in the language of power."
 FRA_unite_iberia: "Unite Iberia"
 FRA_unite_iberia_desc: "Uniting Iberia will strengthen our union as well as secure or western borders in case of war. Portugal must unite with us now, like or not."
 FRA_retake_rome: "Retake Rome"
 FRA_retake_rome_desc: "The Italian nation has been plagued by corruption and incompetence for years, even decades. We must liberate the capital of the old Roman Empire from these barbaric beings."
 FRA_latin_unity: "Latin Unity"
 FRA_latin_unity_desc: "The Germanic peoples have ruled Europe for to long, it is time to reclaim our national birthright as the successors states of the Roman Empire!"
 FRA_expand_the_union: "Expand the Union"
 FRA_expand_the_union_desc: "We must not forget the Latins living in Wallonia and Romania, they all must join our union in order to become once again the leaders of the continent."
 FRA_split_switzerland: "Split Switzerland"
 FRA_split_switzerland_desc: "Switzerland is a nation that doesn't deserve to exist. Formed by an anti-natural union between Germans, French and Italians, the Swiss nation must be partitioned."
 FRA_dissolve_the_action_francaise: "Dissolve the Action Française"
 FRA_dissolve_the_action_francaise_desc: "The Action Française was a close ally of us, but after their radicalization and violent protests carried out in 1934, they do no more than stain our image. They must go."
 FRA_contact_the_social_party: "Contact the Social Party"
 FRA_contact_the_social_party_desc: "The Social Party of La Rocque has some members who would totally support our monarchist restoration. We should grow closer to this party in order to improve the stablity of our regime."
 FRA_crusade_against_parlamentarism: "Crusade Against Parlamentarism"
 FRA_crusade_against_parlamentarism_desc: "Parlamentarism has showed us to be an inefficient form of government for many reasons. We will start an anti-parlamentarist campaign all over Western Europe."
 FRA_monarchist_entente: "Monarchist Entente"
 FRA_monarchist_entente_desc: "The Entente Cordiale came out victorious in the Great War, but with the now weak British government and the bloody Soviet leadership, we are forced to look for more allies if we want to form our own military alliance."
 FRA_invite_the_spaniards: "Invite the Spaniards"
 FRA_invite_the_spaniards_desc: "The Spanish were busy impeding the rise of communism in their homeland. Now that things have calmed down, we should formalize our alliance with them."
 FRA_restore_the_brazilian_monarchy: "Restore the Brazilian Monarchy"
 FRA_restore_the_brazilian_monarchy_desc: "Instability in Brazil has reached a critical point. The only way to revert it is by bringing the Brazilian Empire back."
 FRA_reunite_the_two_kingdoms: "Reunite the Two Crowns"
 FRA_reunite_the_two_kingdoms_desc: "The Portuguese and Brazilians are good candidates for a reunification. They share culture and language, and thus would make a good ally."
 FRA_unite_the_two_houses: "Unite the Two Houses"
 FRA_unite_the_two_houses_desc: "The Brazilian nation should be directly controlled by the house of Orléans-Braganza, that way we will be able to improve the future of both nations."
 FRA_two_nations_two_crowns: "Two Nations, Two Crowns"
 FRA_two_nations_two_crowns_desc: "The Brazilians should enjoy a fair degree of autonomy under king Henri, count of Paris and member of the house of Orléans-Braganza."
 #GREECE
 GRE_remember_macedonia: "Remember Macedonia"
 GRE_remember_macedonia_desc: "From the ancient kingdom of Macedon to the struggles of the modern Greek state, Macedonia has never been absent from our national memory. We must rekindle that legacy and make clear that its future belongs with Greece."
