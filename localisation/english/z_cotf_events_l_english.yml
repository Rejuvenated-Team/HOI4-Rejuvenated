l_english:
 #JAPAN
 cotf_jap.1.d: "The Japanese have declared they won't tolerate the existence of a communist cell in China, stating that they will deal with it as if in a state of war.\nShould we use this opportunity to finally strike at the devil of Yan'an?"
 #MANCHUKUO
 cotf_man.1.d: "After the liberation of Manchuria and deposal of Puyi, [FROM.GetLeader] has called our government with an offering: integrating their forces under our command. While this would be a great boost to our military and industry, managing two fronts at a time could prove to be a logistical nightmare, and the [FROM.GetAdjective] forces are not exactly the most disciplined or well-equipped. Should we accept this offer, or let them fend for themselves?"
 cotf_man.111.d: "After the liberation of Manchuria and deposal of Puyi, [FROM.GetLeader] has called our government with an offering: integrating their forces under our command. While this would be a great boost to our military and industry, we have had problems with their generals being too soft on the communists before, and the [FROM.GetAdjective] forces are not exactly the most disciplined or well-equipped. Should we accept this offer, or let them fend for themselves?"
 cotf_man.2.d: "Wu Peifu's health has rapidly deteriorated after a severe oral infection. His physicians insist that he must receive immediate treatment, with some advising that he be moved to a better-equipped hospital within the foreign concession.\n\nWu, however, refuses outright. To him, crossing into a zone protected by foreign privilege would be an intolerable humiliation, a living contradiction of the principles he has upheld throughout his career. Neither pain, nor fever, nor the threat of death seem enough to break his pride.\n\nHis supporters see this as one final display of incorruptible patriotism. His critics, less charitable, whisper that the old marshal may have mistaken dignity for suicidal obstinacy. Whatever the truth, his condition worsens, and the clock continues to tick."
 cotf_man.3.d: "The Jade Marshal has passed away.\n\nNot much time has passed since Japanese forces were driven from Manchuria, yet the man who stood at the center of that victory has not lived to see what would come after it.\n\nBut liberation was never meant to be the end of his vision. In his final weeks, even as illness weakened his body, Wu spoke openly of the need to reunify China by force if necessary. To him, the Kuomintang government had failed the nation, and Manchuria could not remain a mere liberated frontier while China itself remained divided. His words inspired some, alarmed others, and left many wondering whether the old marshal intended to turn yesterday's allies into tomorrow's enemies.\n\nHis sudden death has silenced the man, but not the question he left behind. With Japan gone from the region and Wu Peifu no longer alive to command loyalty by reputation alone, the coalition that freed Manchuria now faces an uncertain future. Some will call for unity. Others will call for caution. A few are already sharpening their knives."
 cotf_man.4.d: "[FROM.GetLeader] has approached our government to bring the Northeastern Army back under a single command. Their proposal would preserve Xi'an's administration under Manchurian protection, while our officers and territory would be bound to their new union. Accepting would place our future in Mukden's hands; refusing would keep Xi'an independent, but isolated."
 cotf_man.5.d: "[FROM.GetLeader] has accepted our proposal. The Fengtian Army will be integrated into our forces, and the two governments will be united under a single flag. However, one question remains. Should they await for our government's decision to control their armies, or should they be allowed to keep their own command structure until the Nationalists are defeated?"
 cotf_man.6.d: "[FROM.GetLeader] has rejected our proposal. It seems that it's too late for the Fengtian Army, they have also fallen into the lies of the Kuomintang."
 cotf_man.7.d: "China has been reunited, and the provisional task that carried Luo Wengan to power is complete. In the halls of government, he now speaks openly of stepping aside before victory hardens into personal rule.\n\nThe China Democratic Socialist Party has offered him a place in its ranks, presenting itself as the movement best suited to turn military reunification into a civilian republic: reformist, constitutional, and broad enough to hold together a wounded country. Luo is willing to lend it his name, but he insists that China must decide what kind of leadership should follow the war.\n\nSome argue Luo himself should remain as a unifying president under the CDSP banner. Other ministers, however, believe that Hu Shi or Wellington Koo would be more fit to lead China under the Haozhengfu."
 cotf_man.8.d: "[FROM.GetLeader] has approached our government with a proposal. He spoke of how the Nationalists of Nanjing have become nothing more than a corrupt dictatorship, and argued that, in times like these, we should leave our differences behind as we are all Chinese people looking for the best future for our nation. He has offered to adopt our socialist ideals, grant our troops autonomy until the Nationalists are defeated, and even promises to call for free elections as soon as China is reunified."
 cotf_man.9.d: "[FROM.GetLeader] has accepted our proposal. The Communist Army will be integrated into our forces, and the two governments will be united under a single flag. However, one question remains. Should they await for our government's decision to control their armies, or should they be allowed to keep their own command structure until the Nationalists are defeated?"
 cotf_man.10.d: "[FROM.GetLeader] has rejected our proposal. It seems they have lost faith in anyone but themselves after being failed by the Kuomintang so many times."
 cotf_man.11.d: "Disturbing reports have arrived from the north. Officers and soldiers once attached to the Northeastern Army have abandoned our command and marched toward Manchuria, declaring their loyalty to [MAN.GetLeader]'s government. Zhang Xueliang, Yu Xuezhong, Wang Yizhe, and He Zhuguo have all cast their lot with the new regime, claiming that Nanjing has failed the Chinese people.\n\nThey speak of restoring order to their home, of reclaiming the honor lost after the Japanese occupation, and of serving under a government that promises national unity without [CHI.GetLeader]'s grip. Whatever excuses they offer, the result is undeniable: seasoned commanders and thousands of trained soldiers have slipped from our grasp, strengthening a rival who now dares to speak in the name of China."
 #SHANXI
 cotf_shx.1.d: "News from Taiyuan has reached Nanjing in the wake of the disaster in Suiyuan. Yan Xishan has been assassinated, and the Shanxi clique has been left without the man who held its officers, officials, and provincial machine together.\n\nAfter urgent consultations, the government has decided to send Feng Yuxiang to take command. He is no stranger to the northwest, as his Guominjun once shaped politics across the region, and his Chahar Anti-Japanese People's Army proved that he could still rally men against Japan when others hesitated.\n\nWhether Shanxi's generals will welcome him or merely tolerate him, the province now needs a commander whose name can carry weight beyond Taiyuan."
 cotf_shx.2.d: "The defeat in Suiyuan has claimed more than territory and prestige. Yan Xishan, the Model Governor of Shanxi and master of its politics for decades, has been assassinated in the confusion that followed the collapse.\n\nNo one can yet say who ordered the killing. Some whisper of Japanese agents exploiting the chaos. Others blame communist infiltrators, eager to break Shanxi's old order. A darker rumor points inward, toward officers who wanted to get revenge for his harsh treatment towards those who dared to retreat during the war.\n\nWhatever the truth, Yan's rule is over. Shanxi must now endure the storm without the man who built it."
 cotf_shx.3.d: "Our envoys were the ones who opened the channel to Taiyuan, and now [FROM.GetLeader]'s government has answered. Shanxi is prepared to lay down its arms against Japan, but only under a narrow armistice: the fighting between our forces will end, a pledge of non-aggression will be signed, and Japanese troops will receive passage through Shanxi territory, in order for us and them to deal with the Communist guerrillas in the north.\n\nHowever, there are many of our officers who believe that it's only a matter of time until Shanxi collapses under our forces..."
 cotf_shx.4.d: "The Japanese delegation that first approached our government has accepted the final terms. An armistice has been signed and Japanese forces have been granted military access through our territory in order for both of us to fight the Communist guerrillas that plage the north of China."
 cotf_shx.5.d: "The Japanese had asked for negotiations, but their representatives recoiled when the final terms were placed before them. At the last moment, the Japanese withdrew from the talks, leaving our envoys with nothing but unsigned papers and the same war they had hoped to quiet.\n\nWhatever Japan wanted from Shanxi, it was not peace at this price."
 cotf_shx.6.d: "[FROM.GetLeader] proposes our nation to cooperate with [FROM.GetName], in order to defend China from the Japanese and Communist menace. However, [FROM.GetAdjective] army is stationed along our borders, and military excersises can be observed from our territory. Maybe this isn't a proposal, but a demand."
 cotf_shx.7.d: "[FROM.GetLeader] proposes our nation to cooperate with [FROM.GetName], in order to defend China from the Japanese and Communist menace, denouncing [CHI.GetLeader] as no more than a corrupt traitor to the Chinese people. However, he made clear that refusing to cooperate with his cause will be seen as an act of hostility, and that his forces will not hesitate when "the time" comes..."
 cotf_shx.8.d: "Reports from the northwest have confirmed an embarrassing breach within our own ranks. Feng Yuxiang and Sun Lianzhong have abandoned Nanjing and offered their loyalty to the government of [FROM.GetLeader], declaring that the Kuomintang of [ROOT.GetLeader] had forgotten its old revolutionary roots."
 #GUANGXI GUANGDONG
 cotf_gxc.1.d: "Following the death of Hu Hanmin back in May, the uneasy balance between Nanjing and the southern provinces has begun to collapse. Guangxi and Guangdong have banded together under the pretense of claiming we are too passive against the Japanese, questioning our focus on dealing with the Communists instead of the foreign invader.\n\n Under the banner of resisting Japan, their forces have begun moving north into Hunan, demanding that the central government abandon its pressure to integrate the southern provinces. Whether this is a sincere patriotic appeal or merely another attempt to preserve their regional autonomy, the result is the same: the authority of the National Government is being openly challenged, and China stands once again on the edge of civil war."
 cotf_gxc.2.d: "Following Nanjing's refusal to yield to our demands and our subsequent declaration of opposition, the unity of Guangdong has begun to collapse. What first appeared to be isolated desertions has now become a flood: aircraft are flying north to Nanchang, officers are pledging themselves to Chiang Kai-shek, and entire formations are wavering in their loyalty.\n\nYu Hanmou, Li Hanhun and Deng Longguang have deserted and joined the calls against our government. With the air force slipping from our hands and our best generals joining Nanjing, the crisis is no longer at the front, it is at our gates."
 cotf_gxc.3.d: "Following Nanjing's declaration that they will not back down to any of our threats and our subsequent declaration of opposition, there are those who fear that the Central Government will force us to surrender to their rule by military force."
 cotf_gxc.4.d: "Fearing that we would destroy their province in the process of driving [GXC.GetLeader], they have instead proposed that they become part of our republic in exchange for all leaders being spared and keeping their positions. This seems like a fair compromise."
 cotf_gxc.5.d: "Following a few intense hours at the brink of civil war, after the desertion of his airforce and generals, Chen Jitang has agreed to resign. Our troops are now marching in Guangzhou, and what will happen next to the province is now entirely in our hands."
 cotf_gxc.6.d: "Claiming that barking dogs do not bite, [GXC.GetLeader] has proclaimed that they will not back down. Our army needs time to prepare, but when it's ready, it will march in Nanning in no time."
 cotf_gxc.7.d: "Word has arrived from Chen Jitang in the wake of Guangdong's growing catastrophe. Their army is splitting apart, their airfoce has fled north to Nanchang, and officers once loyal to Guangdong now declare support for Chiang Kai-shek. In desperation, Chen Jitang has proposed that our two cliques unite under a single southern command, with Guangxi taking the lead.\n\nThe name of Liangguang once belonged to an imperial viceroyalty, a relic of dynasties we have no wish to restore, yet the power once held by a united Guangdong and Guangxi cannot be dismissed. If the South is to survive Nanjing's pressure, perhaps the old name may yet serve a new purpose."
 cotf_gxc.8.d: "Even though most of the high command, armies and airforce of Guangdong deserted to us, Chen Jitang has managed to convince his remaining troops and those of Guangxi to unite against us. Some of our generals believe the chaos in Guangdong will make it easy to defeat them, while others think that we shouldn't let a useless bloodshed occur when the Communists and the Japanese are a bigger threat to Nanjing."
 cotf_gxc.9.d: "With lessening morale among our troops and increasing desertions to Liangguang, strikes have began in Nanjing, Shanghai and Wuhan asking for a stop to this fruitless infighting and to resist to the Japanese invaders in the northeast..."
 cotf_gxc.10.d: "Despite having held private meetings with Chen Jitang, Huang Xuchu has chosen to remain on the sidelines as the struggle for control of the southern provinces reaches its climax. With no opposition emerging from within the Guangxi leadership, Li Zongren has endorsed Bai Chongxi's decision to secure Guangzhou's provincial banks and break the resistance of the supporters of the Gang Of Four before it can spread any further.\n\nBaojia units entered the city alongside Cantonese troops loyal to Guangxi, occupying government offices, railway stations and financial institutions. Crowds soon gathered in protest, denouncing the seizure of Guangdong's treasury and the growing militarization of the province. When demonstrators attempted to force their way through the cordons surrounding the banks, the baojia opened fire. The streets of Guangzhou descended into panic as the survivors fled and the remaining opposition collapsed.\n\nWith arrest imminent, Chen Jitang escaped with his family through Hong Kong before departing for Europe. Chen Qiyou fled alongside him and has begun reorganizing his federalist supporters from exile. Li Jishen, whose revolutionary prestige made his imprisonment politically dangerous, has been pardoned but relegated to a largely ceremonial position. Zhao Hengti, safely removed from the fighting in Hunan, has likewise been stripped of meaningful influence and confined to an advisory post.\n\nThe Gang Of Four is no more. Guangdong's banks are now under the control of the Liangguang government, its streets are patrolled by the baojia, and the authority of The Triumvirate stands unchallenged throughout the south."
 cotf_gxc.11.d: "Following a series of private meetings with Chen Jitang, Huang Xuchu has succeeded in convincing Li Zongren to withhold his approval from Bai Chongxi's plan to seize Guangzhou's banks and provincial institutions. Nevertheless, Bai ordered the baojia into the city, determined to break the opposition before its influence could spread any further.\n\nAs demonstrators gathered outside the banks and government offices, Bai commanded the baojia to open fire. Before the order could be carried out, however, Huang Xuchu issued a direct instruction forbidding the use of force. The officers turned to Li Zongren for clarification, but received only silence. Faced with contradictory commands and unwilling to begin a massacre without the support of Guangxi's political leadership, the baojia lowered their weapons and allowed the crowds to remain.\n\nWith his authority collapsing, Bai Chongxi was arrested in his office by officers acting in the name of the Liangguang government. It's planned to disguise his removal as an appointment to a military mission in Nanjing, preserving his rank while separating him from the troops and institutions upon which his power had depended.\n\nLi Zongren and Huang Xuchu have retained prominent positions within Guangxi, ensuring that the province is not treated as an enemy, yet the balance of power has shifted decisively. Chen Jitang, Li Jishen, Chen Qiyou and Zhao Hengti, increasingly known as the Gang of Four, now stand at the centre of the emerging government. Guangzhou has passed through its crisis without bloodshed, but the old triumvirate will never command the south as it once did."
 cotf_gxc.12.d: "Reports from Guangzhou remain confusing. The Liangguang authorities speak only of an internal dispute, while private telegrams and accounts arriving through Hong Kong describe crowds surrounding the provincial banks, baojia units caught between conflicting orders, and Bai Chongxi being placed under guard in his own office. No shots were fired, but the political order of Liangguang has changed.\n\nThe southern government has now announced Bai's appointment as the head of a military mission to Nanjing. The accompanying communiqué praises his strategic talents and presents the transfer as a step toward closer cooperation with the National Government for resistance against the Japanese.\n\nFor the National Government, Bai's arrival presents both an opportunity and a complication. He remains one of China's most experienced commanders, and his knowledge of the southern armies may prove invaluable in the struggles ahead. Yet he is also proud, politically ambitious and inseparably associated with the southern cliques..."
 cotf_gxc.13.d: "[FROM.GetLeader] has invited us to join the federation envisioned by the Zhigongdang, a political movement supported by influential overseas Chinese communities and committed to rebuilding China as a union of self-governing provinces.\n\nMembership would grant us a broader alternative to Nanjing's centralized rule, yet joining would also risk provoking both the Central Government and rival provincial leaders. The promise of unity is tempting, but federations have a habit of demanding more than their founders initially admit."

 #FRANCE
 cotf_fra.1.title: "An offer from Vichy"
 cotf_fra.1.a: "As long as power is transfered to De Gaulle, we accept."
 cotf_fra.1.b: "Why should we help cowards and traitors?"
 cotf_fra.2.d: "[FRA.GetLeader] has approached pro-monarchy elements of the Italian government and the underground with plans for the assassination of [ITA.GetLeader] and the institution of Victor Emmanuel III as leader of the nation. The French ensure us they can handle the assassination; all we have to do is affirm our willingness to create a replacement government, and to pledge our future military support to French endeavours."
 cotf_fra.2.a: "This is the only way of saving our nation form destruction."
 cotf_fra.2.b: "How dare they propose something like that?"
 cotf_fra.3.d: "Elements in the Italian government and underground have accepted our proposal for a coup. They are making preparations for a swift seizure of power for the King, as soon as the assassination has happened."
 cotf_fra.3.a: "We can set our plans in motion."
 cotf_fra.4.d: "The elements of the Italian government and underground we contacted have told us, in not too gentle terms, that they are uninterested in our proposal for a coup. They have threatened to reveal our plans to the Italian government if we dare make the same offer again."
 cotf_fra.4.a: "It's not like they were going to be too useful anyway."
 cotf_fra.5.d: "The French plan has been put in action and [ITA.GetLeader] was shot in his car in the streets of Rome today. King Vittorio Emanuele III has taken the reins of the nation, and has pledged to our military alliance."
 cotf_fra.5.a: "We must show our gratitude."
 cotf_fra.6.a: "This is the only way of saving our nation form destruction."
 cotf_fra.6.b: "How dare they propose something like that?"
 cotf_fra.7.d: "Elements in the Portuguese government and underground have accepted our proposal for a coup. They are making preparations for a swift seizure of power for the King, as soon as the assassination has happened."
 cotf_fra.7.a: "We can set our plans in motion."
 cotf_fra.8.d: "The elements of the Portuguese government and underground we contacted have told us, in not too gentle terms, that they are uninterested in our proposal for a coup. They have threatened to reveal our plans to the Portuguese government if we dare make the same offer again."
 cotf_fra.8.a: "It's not like they were going to be too useful anyway."
 cotf_fra.9.d: "The French plan has been put in action and [POR.GetLeader] was shot in his car in the streets of Lisboa today. King Dom Duarte Nuno has taken the reins of the nation, and has pledged to our military alliance."
 cotf_fra.9.a: "We must show our gratitude."
