#Ideas
 CHI_asian_unifier_and_liberator: "Asian Unifier and Liberator"

 CHI_the_ticking_clock: "The Ticking Clock"

 CHI_war_is_peace: "War is Peace"
 CHI_war_is_peace_desc: "§RThis idea will be removed if we change ideology.§!\n\nJapan still fights for the conquest of China. Cells have been discovered all over the country, in Shenyang, Dailan, Taipei and even Shanghai. The war continues, and will not be over until the last Japanese soldier is expelled from our soil..."

 CHI_victorious_war_of_resistance: "Victory in the War of Resistance"
#Focuses
 CHI_quenching_thirst_with_poison: "Quenching Thirst with Poison"
 CHI_quenching_thirst_with_poison_desc: "As our glorious leader Wang Jingwei once said, "To let oneself be used by the Communist Party, that would not be quenching thirst by thinking of plums, but drinking poison to quench thirst. Its danger goes without saying."... But things have changed. Now that we are at war with Japan, drinking that poison might be the only way to survive."
 CHI_indefinite_tutelage: "Indefinite Tutelage"
 CHI_indefinite_tutelage_desc: "The nation has endured invasion, division, and subversion... However, until China is truly safe, political tutelage must remain the guiding hand that shields the state from disorder."
 CHI_one_party_state: "One Party State"
 CHI_one_party_state_desc: "Democracy must not mean paralysis. By placing national representation under one disciplined party, we can preserve a constitutional government while preventing factionalism from tearing China apart again."
 CHI_victory_for_the_CDL: "Victory for the CDL"
 CHI_victory_for_the_CDL_desc: "The China Democratic League has emerged as the voice of compromise. Its victory promises a republic led by civic unity rather than military command."
 CHI_victory_for_the_CDSP: "Victory for the CDSP"
 CHI_victory_for_the_CDSP_desc: "Carsun Chang and the Democratic Socialists offer a path between extremes: social reform, federalism, and a state capable of protecting the common people without surrendering liberty."
 CHI_victory_for_the_KMT_RC: "Victory for the KMT-RC"
 CHI_victory_for_the_KMT_RC_desc: "The Revolutionary Committee claims the old banner of national revolution for a new democratic age. Under its leadership, the legacy of Sun Yat-sen may be turned toward reconciliation and renewal."
 CHI_victory_for_the_YCP: "Victory for the YCP"
 CHI_victory_for_the_YCP_desc: "The Young China Party stands for order, patriotism, and measured reform. Its victory will anchor the republic in conservative constitutionalism and national discipline."
 CHI_victory_for_the_KMT: "Victory for the KMT"
 CHI_victory_for_the_KMT_desc: "The Kuomintang has survived war, crisis, and internal challenge. With a renewed mandate, it can lead China into constitutional rule while preserving the symbols of national unity."
 CHI_the_eye_of_the_NBIS: "The Eye of the NBIS"
 CHI_the_eye_of_the_NBIS_desc: "A vigilant state must see threats before they strike. Empowering the National Bureau of Investigation and Statistics and Dai Li as the leader of the nation will give the party the intelligence network it needs to guard the nation."
 CHI_the_fist_of_the_BSS: "The Fist of the BSS"
 CHI_the_fist_of_the_BSS_desc: "Espionage alone cannot secure the revolution. The Blue Shirts Society must become the striking arm of the party, ready to discipline enemies within and without, under the renewed tutelage of He Zhonghan."
 CHI_the_endless_war: "The Endless War"
 CHI_the_endless_war_desc: "Japan still fights for the conquest of China. Cells have been discovered all over the country, in Shenyang, Dailan, Taipei and even Shanghai. The war continues, and will not be over until the last Japanese soldier is expelled from our soil..."
#Decisions
 cotf_reorganize_east_asia: "Reorganize East Asia"
 cotf_reorganize_east_asia_desc: "The defeat of Japanese influence on the mainland has left old imperial possessions in need of a new political order."
 COTF_reorganize_korea: "Reorganize Korea"
 COTF_reorganize_korea_desc: "Korea has been freed from Japanese rule. We must decide whether the new Korean state will stand as an independent partner or remain tied to our sphere."
 COTF_reorganize_indochina: "Reorganize Indochina"
 COTF_reorganize_indochina_desc: "With Tonkin under our administration, the future of Vietnam, Cambodia, and Laos can no longer be left unresolved."
 COTF_integrating_western_indochina: "Integrating Western Indochina"
 COTF_integrating_western_indochina_desc: "Vietnamese authority has been restored in the west. Once Laos and Cambodia are sufficiently pacified, they can be formally integrated into Vietnam."
#Events
 cotf_chi.1.d: "[FROM.GetLeader] demands our nation to cooperate with [FROM.GetName], as well as providing them with military access and intelligence sharing. The [FROM.GetAdjective] army is stationed along our borders, and military excersises can be observed from our territory. The message is clear."
 cotf_chi.2.d: "For months, Wang Jingwei's health had been failing. After his assassination attempt in 1935, he went to Germany to see treatment for the wound, as well as his diabetes and cirrhosis that he had been bearing from way before the shooting.\n\nThough physicians urged rest, Wang continued to receive reports from the front and press his ministers to keep faith with the soldiers and people who had followed the Kuomintang through China's darkest hour.\n\nAt last, illness claimed him, where doctors could do no more. His death has silenced one of the Republic's most eloquent voices: a patriot who carried Sun Yat-sen's banner through conspiracy, exile, and war.\n\nThe nation lowers its flags. Wang Jingwei is gone, but the cause he served endures."
 cotf_chi.3.d: "With Japan forced to withdraw from the mainland, Korea stands free of the empire that once ruled it. Our government must now decide whether the new Korean state should be protected as an independent partner, or bound closer to China as a loyal protectorate.\n\nKim Gu is a popular figure in Korea, and a staunch anti-Japanese and anti-communist, however, Jo So-ang is a close follower of Sun Yat-sen's Three Principles of the People, though he is more moderate and less charismatic than Kim... Although, that could make him easier to control."
 cotf_chi.4.d: "With Japan forced to withdraw from the mainland, Korea stands free of the empire that once ruled it. Our government must now decide whether the new Korean state should be protected as an independent partner, or bound closer to China as a loyal ally.\n\nThe Korean communists have emerged from occupation with enough influence to form a government of their own. Pak Hon-yong offers discipline, revolutionary legitimacy, and a useful counterweight to reactionary forces, but an independent red Korea could still drift beyond our control.."
 cotf_chi.5.d: "With Japan forced to withdraw from the mainland, Joseon stands free of the empire that once ruled it. Our government must now decide whether the new Joseon state should be protected as an ally, or bound closer to China as a loyal protectorate.\n\nSome in Seoul now look to Yi Kang and the old royal house as symbols of unity after years of foreign rule. A restored kingdom could give their people a familiar banner and a conservative order, but the peninsula has already paid dearly for weakness and isolation. If we leave the throne to stand alone, it may fall again against the imperialists claws..."
 cotf_chi.6.d: "With Japan forced to withdraw from the mainland, Korea stands free of the empire that once ruled it. Our government must now decide who will lead this new Korean republic.\n\nYeom Dong-jin has been working for us for years, he is the only man in Korea that understands [ROOT.GetLeader]'s wishes to the core..."
 cotf_chi.7.t: "The Indochinese Question"
 cotf_chi.7.d: "With Japan forced to withdraw from the mainland, Indochina stands free of the empires that once ruled it. Our government must now decide whether the new Indochinese states should be protected as independent partners, or bound closer to China as a loyal protectorate."
 china.204.a: "Let the Northern Capital rule China once more."
 china.204.b: "Let the Southern Capital guide China's renewal."
 china.204.x: "Let Shanghai be our gaze towards the world."
 china.204.y: "Let Wuhan become the heart of the nation."
 china.204.z: "Let Guangzhou carry the revolution forward."
#Tooltips
 CHI_flag_5_colours: "Our flag will be replaced by the flag of the five races under one union. Red, yellow, blue, white, and black."
 CHI_flag_ZGD: "Our flag will be replaced by the flag of the federalist movement. A white jingzi symbol on a blue field and a wholly red earth."
 CHI_flag_PPP: "Our flag will be replaced by the flag of the Fujian rebellion. A yellow star representing unity, a red stripe representing the proletariat and a blue stripe representing the peasants."
 CHI_flag_KMT: "Our flag will continue to be the KMT flag. Blue sky, white sun, and a wholly red earth."
 CHI_flag_KMTRC: "Our flag will turn into a modified version of the KMT flag. Blue sky, white sun, and a wholly red earth."
 CHI_flag_HZF: "Our flag will continue to be the Haozhengfu flag. A white jingzi symbol on a blue field over the five races under one union. Red, yellow, blue, white, and black."

 we_will_guarantee_and_get_military_access: "We will get §Ymilitary access§! to them, and we will §Yguarantee their independence§!."
 cotf_indochina_leader_chosen: "Indochina has been already organized."
 cotf_korean_leader_chosen: "Korea has been already organized."
