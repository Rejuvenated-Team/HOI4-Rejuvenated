 ### ideas ###
 DEN_recovering_economy: "Recovering Economy"
 DEN_recovering_economy_desc: "The Great Depression was a huge blow on the Danish economy, which was being built by Stauning. This crisis was bigger than any before, and thus, Stauning acted quickly. He established Kanslergadeforliget and did what he could, so we wouldn't end up in a dire situation. Whilst our economy isn't good enough, it's still progress."
 DEN_fear_of_the_germans_low: "Fear of the Germans (§GLow§!)"
 DEN_fear_of_the_germans_low_desc: "The German threat isn't really terrifying, and in some cases, laughable."
 DEN_fear_of_the_germans_med: "Fear of the Germans (§YMedium§!)"
 DEN_fear_of_the_germans_med_desc: "It is best for us to make sure we don't provoke the Germans, if we don't provoke them, we should be fine."
 DEN_fear_of_the_germans_high: "Fear of the Germans (§RHigh§!)"
 DEN_fear_of_the_germans_high: "The German fear is clear and evident, we must prepare defenses and forts, now."
 DEN_anti_fascist_action: "Anti-Fascist Action"
 DEN_anti_fascist_action2: "Anti-Fascist Action"
 DEN_danish_trades: "Danish Trades"
 DEN_danish_trades_desc: "When it comes to trading, Denmark is one, who succeeds in trades. With our food supply, mainly pork, we're popular around the trading world."
 DEN_beskyttelse_kabinet: "Beskyttelse Kabinetten"
 DEN_beskyttelse_kabinet_desc: "In order for Danes to feel safe, a cabinet of war experts shall be establish, to protect the fatherland."
 DEN_fascist_propaganda: "Fascist Propaganda"
 DEN_conscription_effort: "Conscription Effort"
 DEN_lowered_the_old_age_pensions: "Lowered The Old-Age Pensions"
 DEN_vaction_act: "Vacation Act"
 DEN_unemployment_issue: "Unemployment Issue"
 DEN_lowered_army_spending: "Lowered The Army Spending"
 DEN_christian_x: "Christian X"
 DEN_christian_x_desc: "Christian's reputation hasn't been the greatest since the 1920 easter crisis, where Christian would precide to dismiss the democratically elected social liberal, Carl Theodor Zahle. We must ensure that he's still just the figurehead of Denmark."
 DEN_christian_x_2: "Christian X"
 DEN_christian_x_2_desc: "Despite what he did in 1920, he has been gaining support from Danes all around Denmark. He has shown fierce anti-germanism, and our occupiers have yet to respond. We must gain the courage to fight for our freedom."
 DEN_armed_workers: "Armed Workers"
 DEN_ff: "§RFolkefronten§!"
 DEN_ff_desc: "Aksel has ensured a communist ruling party in Denmark, and has then established 'Folkefronten' which seeks to strengthen communist ideals, unite workers of Denmark and protect ourselves against imperial mights"
 DEN_haeren: "Hæren"
 DEN_haeren_desc: "From conquering England, to holding out in Schleswig in early 1850s, the danish army has experienced a lot. Ever since the Second Schleswig War, where we lost Schleswig, we decided to neglect the military. With new threats roaming around in Europe, the question lies, ''Should Denmark extend it's army capabilities?'' "

