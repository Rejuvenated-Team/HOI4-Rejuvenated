l_english:
 bra.2: "The Cohen Plan"
 bra.2.t: "The Cohen Plan"
 bra.2.d: "Through Captain Mourão, a document, theoretically written by the ANL, has arriven in your hands. It contains a well detailed plan to assassinate the candidates for the 1938' electon, Armando Sales and José Américo. An action must be taken by us, even though our inteligence services can't deduct the veracity of the Document."
 bra.2.a: "Bring the microphone! We can't afford losing more time."
 bra.2.b: "Arrest the Captain and burn the Document! This farse can't become endemic."
 bra.2.c: "Enough of internal squabbles! We must ajust the political organism to the necessities of the Fatherland."
 bra.2.e: "We can't deprive them of their freedoms in response to a Document that is likely false!"
 bra.1: "'A famosa caixinha do Adhemar'"
 bra.1.t: "'A famosa caixinha do Adhemar'"
 bra.1.d: "As we finally stand in the brink of redemocratization, we must choose who is going to be our leader for the next 5 years. Adhemar de Barros is the former interventor for the São Paulo: He built roads, expanded the industries and rebuilt the State. Armando Sales is a long fighter for democracy: He governed São Paulo, giving the State's the continent's higher educational standards. The brigadier Eduardo Gomes is a former member of the Brazilian Air Force: He has became the main figure for the still-standing Tenentistas. Júlio Prestes has been elected president in 1930, having been the one deposed in the 1930' Coup d' Etat: He is a member of the Agrarian Elite and the former head of the PRP. Time has come for we to make our decisions."
 bra.1.a: "If he rebuilt São Paulo, why can't he rebuild Brazil?"
 bra.1.b: "For our democracy, we need someone that has never gave up on it."
 bra.1.c: "What I don't understand is how a nation, like Brazil, after years of democratic tradition, could retrograde to a dictatorship that humiliates us in the eyes of the civilized world!"
 bra.1.e: "To us, wiseness is constructed through the consequences of our choices."
 bra.1.f: "The future is not what we fear, it is what we dare to reach!"
 bra.4: "Getúlio Vargas' Suicide"
 bra.4.t: "Getúlio Vargas' Suicide"
 bra.4.d: "In this morning, the body of President Getúlio Vargas was found laying dead in his room. Wearing his pajamas, our former president has commited suicide in response to the political turmoil of the country. Political analylistis explain that if the President had decided on which path to take he would have not been forced to go throught this. Today, we can only mourn for his soul."
 bra.4.a: "'Deixo a vida para entrar na história.'"
 bra.5: "The Emperor of Brazil"
 bra.5.t:0"The Emperor of Brazil"
 bra.5.d: "Now that the Emperor was acclaimed by his people, his ideology came into question. The Integralists claim that the Emperor is an expansionist and visionary, who will restore Brazil to Glory. The others state that the Emperor, in spite of any ideology, must be prudent and moderate above all else. Who's right?"
 bra.5.b: "For Christ's sake, he's an Emperor, not an MP!"
 bra.5.a: "An Emperor must be wise and prudent, above all else."
 bra.6: "Brazil invites us to its faction"
 bra.6.t: "Brazil invites us to its faction"
 bra.6.d: "Brazil, after a breakthrough in internacional diplomatic and the newest great power, invites us to its faction to guarantee us both prosperity and assured defense. Will we join?"
 bra.6.a: "Yes, of course!"
 bra.6.b: "We'd prefer not"
 bra.7: "Brazil wants to join our faction"
 bra.7.t: "Brazil wants to join our faction"
 bra.7.d: "Brazil has requested us to join our faction to assist us in the world state. As we face the war situation, we ask ourselves: Do we need the South American's support?"
 bra.7.a: "Yes, of course!"
 bra.7.b: "We don't need them!"
 bra.8: "Brazil invites us to its faction"
 bra.8.t: "Brazil invites us to its faction"
 bra.8.d: "Brazil, after a breakthrough in international diplomacy and the newest great power, invites us to its faction to guarantee us both prosperity and assured defense. Will we join?"
 bra.8.a: "Yes, of course!"
 bra.8.b: "We'd prefer not"

 #bra.11: "Brazilian Puppet!
 #bra.11.t: "Brazilian Puppet!"
 #bra.11.d: "As Brazilian Officials seize our government's last bastion the scrict military presence of Brazilian authorities in our soil imply the formation of a puppet government, managed by a new chief of state under the tutelage of the President of the Federation, whose ideological doctrines will certainly align with those of the mainland Brazil itself. Through the Brazilian Department of Press and Propaganda (DIP), our cultural elites and great masses will, as time passes, gather around Brazilian schools of thought, maintaining the newly installed national order aligned to Brazil's interests."
 #bra.11.a: "Do we even have a choice?"
 #
 #bra.12: "No longer a Brazilian Puppet!"
 #bra.12.t: "No longer a Brazilian Puppet!
 #bra.12.d: "As the new national government is formed, under the sole guidance of our politicians and  our people the Federal-installed state retreats, seeking exile in mainland Brazil. With it goes their twisted ideology, imposed on us throughout our time as subjects of the DIP. Now, our destiny is our sole decision, and our thoughts in the world shall be settled only by us."
 #bra.12.a: "Free! At Last!"
 
 bra.13: "Vargas Murdered!"
 bra.13.t: "Vargas Murdered!"
 bra.13.d: "During the supreme manifestation of the liberation of the Proletariat, dozens of supporters, supported by thousands more in the streets of Rio de Janeiro, surrounded and invaded the Palácio do Catete, and in a few hours the bourgeois chief Getulio Vargas was dead and presided the nation Mr. Luís Carlos Prestes, the new President of the Republic. "
 bra.13.a: "Do Svedanya, Mr. Vargas"
 
 bra.14: "Vargas Exiled!"
 bra.14.t: "Vargas Exiled!"
 bra.14.d: "During the supreme manifestation of citizenship of all peoples and races, thousands of Integralists surrounded and threatened to invade the Palácio do Catete. In a few hours President Vargas would take refuge in Rio Grande do Sul and Dr. Plínio Salgado would assume his due post as the new President of the Republic. "
 bra.14.a: "Anauê!"
 
 bra.15: "Vargas Entrenched!"
 bra.15.t: "Vargas Entrenched!"
 bra.15.d: "Created to coordinate the propaganda of the National State, the Department of Press and Propaganda, associated with the intelligence sectors of the federal government, will guarantee the perpetuation of the President of the Republic, Mr. Getúlio Vargas, in power."
 bra.15.a: "The Constitutional Regime has lost its practical value."
 
 bra.16: "Vargas Impeached!"
 bra.16.t: "Vargas Impeached!"
 bra.16.d: "During the supreme manifestation of freedom of the Fatherland, the Associated Sectors of the Army, Navy and Air Force surrounded the Palácio do Catete in support of the National Congress. In a few hours Mr. Getúlio Vargas, under pressure from a select body of generals and admirals, would give the Republic back to the National Congress and to the Brazilian people. "
 bra.16.a: "To us mortals, wisdom is built through the consequences of our choices."
 
 bra.17: "On the Matter of Freemasonry"
 bra.17.t: "On the Matter of Freemasonry"
 bra.17.d: "While allowing Freemasonry would certainly tranquilize the Elites and secure our position, the strong support of the Church might be preferable, in order to keep the public and the administration in order."
 bra.17.a: "The Vatican has no authority over us."
 #bra.17.a_desc: "§BNeutral path§!"
 bra.17.b: "No second chances for traitors."
 #bra.17.b_desc: "§BFascist Path§!"

 bra.18: "The National Guard"
 bra.18.t: "The National Guard"
 bra.18.d: "Dissolved officially in 1922, the National Guard started losing gradual importance by the late second empire. To restore it will strenghen our ability to maintain public-order nationally, enforce our will regardless of the army and re-distribute places of honour and legitimacy amongst local politicians, mustering support for our cause."
 bra.18.a: "Yes, Coronel!"
 
 bra.19: "The Imperial Restoration"
 bra.19.t: "The Imperial Restoration"
 bra.19.d: "Today, the united peoples of Brazil took over a closed Congress by storm, in a great manifestation of public will, and enforced the carefully writen Constitution of the Third Empire. The army has already forcibly retired Getúlio Vargas, to be known as Brazil's last president."
 bra.19.a: "Liberty, open thy wings upon us!"

 bra.20: "Atlantic Connections"
 bra.20.t: "Atlantic Connections"
 bra.20.d: "More than a hundred years have passed since Brazil declare its independence, and almost half a century since the Brazilian Republic materialized. No one in their right minds understands there's - currently- any single chance for our Transatlantic Empire to be restored... \n\n Unless... \n\n By aiding the Brazilian Integralists into power and overthrowing Getúlio Vargas, we can explore gaps in their ideology and pander to their monarchist members, making a Portuguese Restoration possible."
 bra.20.a: "Grand."
 bra_por_sabotage_ai_tooltip: "If Brazil is controlled by AI, they will turn Fascist, making the Portuguese Restoration easier."
 bra.20.b: "No need for sabotage. The people of Brazil will eventually understand they're better with us."
 bra_por_nosabotage_ai_tooltip: "They aren't. The Brazilian AI will have a normal chance into turning Fascist. They will never turn into Fascists if the Historical AI is on."

 bra.22: "The Brazilian Expeditionary Forces"
 bra.22.t: "The Brazilian Expeditionary Forces"
 bra.22.d: "The world has changed since the sun set on the Brazilian Empire. Yet, it is risen, and the old glory days are to come. Still, the world around us has changed, and imperialism has given way to new networks of alliances between thinkers-alike and fellows. In sight of the many wars there are to happen in this new - exciting - era, we might do something the Empire never did: organize transatlantic expeditions to assure victory to our friends abroad."
 bra.22.a: "What a fantastic idea."
 bra.22.b: "Isolationism seems the better move for now."
 bra.22.b_tt: "You won't have a chance of getting the Brazilian Expeditionary Forces again."
