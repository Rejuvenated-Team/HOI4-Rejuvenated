 ###########################################################################################################################################
 ########################################### DIPLOMACY TREE FOCUSES ########################################################################
 ###########################################################################################################################################

 BRA_itamaraty: "Itamaraty"
 BRA_itamaraty_desc: "The Palace of Itamaraty - Nheengatu for 'river of rocks adrift' - is the headquarters of the Ministry of Foreign Affairs, in Rio de Janeiro. During the old order, our focus on the foreign was attracting investments and loans. Now we have the opportunity to participate a little more 'actively' in global affairs."
 BRA_global_politics: "Global Politics"
 BRA_global_politics_desc: "If Brazil is to achieve its long dream of becoming an international power, we must integrate ourselves into the international markets and politics, participate in trans-atlantic wars and act as a power-to-be."
 BRA_the_southern_common_market: "The Southern Common Market"
 BRA_the_southern_common_market_desc: "MERCOSUL is an intergovernmental organization organized by its members, the democracies of South America, focused on the organization of trade, the facilitation of foreign exchange and the formation of a fiscal policy that favors continental commerce."
 BRA_investments_in_latin_america: "Investments in Latin America"
 BRA_investments_in_latin_america_desc: "We've definitely grown richer and more industrialized over the years. Maybe it's time to share some of our secrets with our neighbours, we can surely benefit from being in charge."
 BRA_the_union_of_south_american_nations: "The Union of South American Nations"
 BRA_the_union_of_south_american_nations_desc: "MERCOSUL as an economic block and our investments in Latin America paid out, and now many Latin American leaders understand that shared protection is the best way to secure its interests."
 BRA_the_american_problem: "The American Problem"
 BRA_the_american_problem_desc: "We will no longer stand the crises, the coups, the limitation of industrial development throught importations, the exploration of our natural resources, of trans-continental oppression and diplomatic arrogance. It's enough!"
 BRA_the_crux: "The Crux"
 BRA_the_crux_desc: "If Brazil is to achieve its long dream of becoming an international power, we must do so deservingly. Be it by integrating the continent through diplomacy or force, Brazil will shine the light of the Global South, and emerge from it as its leader and great power."
 BRA_the_uiracu: "The Uiraçu"
 BRA_the_uiracu_desc: "Since the days of the Empire Brazil doesn't fight in a continental war. Not a major one, in any case. Our newly-renewed vigour and nationalism have surely remembered us of that, and achieve our destiny of stretching from the Caribbean into the Prata we will."
 BRA_the_south_american_USSR: "The South American USSR"
 BRA_the_south_american_USSR_desc: "While culturally very different, we & the USSR have a great deal in common regarding our political stances & objectives. This allows us to forge a strong relationship, as well as perhaps an alliance."
 BRA_a_south_american_reich: "A South American Reich"
 BRA_a_south_american_reich_desc: "The German cause is strong. Their powerful armies, genius scientists and powerful ideology shook the world like never previously seen before. Not to mention we'd heavily benefit from changes in the global order. Besides, we definitely don't want to die."
 BRA_friendship_across_the_pond: "Friendship Across the Pond"
 BRA_friendship_across_the_pond_desc: "If history has taught us anything, is that empires eventually fall. We even have a close example of that. Be it as it may, we don't know when - or if - the sun will ever set on the British Empire. In either case, there's still a lot of tan to get."
 BRA_a_good_neighbor: "A Good Neighbour"
 BRA_a_good_neighbor_desc: "Of all things considered, the Americans are gentle overlords. They've consistently protected all of the Americans from other powers - albeit not frequently from themselves. Be it out of genuine innocence or complacency, strenghtening our relationship with Washington may attract a lot of money."
 bra_entreguismo: "Entreguismo"
 bra_entreguismo_desc: "Entreguismo - a Portuguese neologism for 'an ideology of giving stuff away' - is a pejorative term for nationalists of all ideologies to attack more liberal brazilians that are against the nationalization of all Brazilian oil. Pejorative as it may be, allowing foreigners to tap into our reserves of all resources might have its benefits."



 #######################################################################################################################################################################
 ################################################################# ECONOMIC FOCUSES ####################################################################################
 #######################################################################################################################################################################

 bra_lobato: "Lobato"
 bra_lobato_desc: "An incident between two neighbors in Lobato, Bahia, disproved the government's claim that there is no possibility of oil in Brazilian lands. This is the perfect opportunity to step in & develop a new resource!"
 BRA_national_petroleum_council: "National Petroleum Council"
 BRA_national_petroleum_council_desc: "Now that we've stepped in to help develop the newly discovered oil, we can nationalize the newly developed oil field by way of the National Petroleum Council, & continue to expand our drilling efforts."
 bra_petrobras: "Petrobrás"
 bra_petrobras_desc: "Petrobras will be the state-owned company of Brazilian Petrol and will therefor responsible for the exploring & developing Brazilian oil interests on our soil."