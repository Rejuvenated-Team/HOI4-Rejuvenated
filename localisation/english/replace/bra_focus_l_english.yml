 bra_natal_porto: "Natal Naval Yard"
 bra_natal_porto_desc: "The construction of a Naval Dockyard in Natal shall provide Northeastern Brazil with a new window in the world stage. Through it we can expect the transport of tons of imported and exported goods. The port will have, mostly, civil utility, but we can use it for our military purposes."
 bra_mobilizacao_ind: "Decree for National Mobilization"
 bra_elet_2: "Eletrobrás"
 bra_mod_soroc: "BR-116"
 bra_fiesp: "FIESP"
 bra_mod_sb: "BR-163"
 bra_anhanguera: "Via Anhanguera"

 bra_acogerdau: "Gerdau Group"
 bra_acogerdau_desc: "The thriving nail manufacturing workshop of the Gerdau family is evermore dependent on importing steel from across the atlantic to supply their production, and are now planning to buy a local steel mill for the purpose of not depending on these imports.  Their proeminence should boost Rio Grande do Sul's industrial economy substantially."
 bra_federal_universities_desc: "Federal Universities are both educational centers and nuclei for technological innovations. The proper exploitation of its profits tecnologically-speaking is interesting to the efforts of the government."
 bra_technical_schools_desc: "So far, education for our citizens has been a luxury of few. By teaching the lower classes with widely availiable trade schools, or Technical Schools, we will expand our capacity for industry workers recruiting and improve a lot of the populations' living conditions."
 bra_federal_institutes_desc: "Brazil's ultratraditional magistratures are a piece of old, Portuguese, bureocracy. Expanding our law teaching centres to the countryside and diversifying them to graduate more teachers than bureocrats will assure we'll always have professionals to occupy the teaching ranks."
 bra_politechnical_colleges_desc: "The proposed unification and organization of a federal universities system can only be justified with the expasion of most campii. Brazil's Universities traditionally focus on Medicine and Law: Politechnical Colleges for preparing Engineers - there currently being barely any in Brazil - coincide with our need for industrial and technogical expansion."
 bra_national_institutes_desc: "Aiding the expansion of the already many great institutes scattered throughout Brazil, such as the Oswaldo Cruz and Butantã Institutes, will greatly accelerate the scientific progress of our country."
 bra_military_projects_desc: "The Military Engineering Institute (IME) cooperates, through education and research, for the scientific and technological development of the Brazilian nation and army, whether in the development of new equipment for use in battle or in the adaptation and incorporation of foreign technologies of war within the ranks of the Brazilian Armed Forces."
 bra_secret_research_desc: "The creation of technology centers solely dedicated to important projects of the Armed Forces will prove essential for the maintenance of national security."
 bra_nuclear_research_bureau_desc: "As our enemies develop dangerous new technologies, we must ensure we can keep up with them, & perhaps surpass them as well."
 bra_more_federal_universities_desc: "More Universities mean more learners and more progress. Transforming small colleges of the interior into major educational centers should be a priority of the Government."
 bra_r_s_1_desc: "The University of São Paulo is the most complex academic complex in Latin America. It is one of the leaders of the country's technological evolution and the largest nucleus of national innovation."
 bra_r_s_2_desc: "The University of Rio de Janeiro encompasses a group of smaller faculties capable of forming great geniuses in the country. Its professionals and scientists will be responsible for the modeling of technological Brazil."
 bra_modernizacao_armadas_desc: "The creation of a ministry that oversees & coordinates all of our armed forces will allow said forces some manner of political say, as well as helping to prevent future conflicts between their leaders in regards to political interests, which had been the norm since 1889."
 bra_ana_guerra_civil_desc: "By studying the Brazilian Civil War, we can learn what tactics were highly effective, versus ones that were... not particularly good ideas."
 bra_modernizacao_marinha_desc: "While the army is largely considered to be the most important branch of our armed forces, we once had a strong navy as well, thanks to our heritage based in the Portuguese Empire of old. Nowadays our admiralty is lethargic & archaic. Implementing more meritocratic means of becoming a naval officer & retraining some of our older officers would be prudent."
 bra_modernizacao_aerea_desc: "Air warfare has become highly normalized in the modern era, & we can't afford to be left behind. It's time we begin developing a proper air force to meet the needs of our time."
 bra_ana_mineira_desc: "During the conflict the troops of Minas Gerais and the Minas Gerais officers who led the Army were aware of the inability of Sao Paulo to maintain the war for a long time. So the Mineiros dug. Their trenches were supported by fixed machine guns and their slow and slow, but sure advances, were supported by the fire of the national Artillery."
 bra_ana_paulista_desc: "During the conflict the Public Forces Paulistas adopted the mobile war and the blitz. The plans of the state of São Paulo foresaw a rapid and fulminating movement towards Rio de Janeiro through the Paraíba valley, with the rearguard ensured by the support that would be given by the other states."
 bra_almirantado_desc: "The behavior of Brazilian ships and the tactics of naval commanders must be readjusted to modern naval warfare. We can take as an experience the Navy Revolt of 1893."
 bra_submarinos_desc: "We already have some Italian submarines comissioned and delivered. The Navy Ministry suggests we study them in order to perfect our own submarine designs."
 bra_cruzadores_desc: "Brazil, since its independence, has had the biggest beasts of the seas in its arsenal. We will not do it differently."
 bra_bombardeiro_desc: "Although used by the Union during the Civil War, the bombers have become more precise and lethal since they were last used by Brazil. Brigadier Eduardo Gomes, during this one, bombarded Campinas, weakening much of the infrastructure of the city with a squalid squadron. We will institute him as the Air Force leader."
 bra_caca_desc: "With the founding of the Ministry of Aeronautics, the government can manage the expansion of this new branch of the Armed Forces of the Republic."
 bra_CAS_desc: "Reactivating and modernizing our airplane factory in Lagoa Santa, located at Belo Horizonte's metropolitan region, will aid us in expanding our air force's size."
 bra_equip_ind_desc: "Instead of motorizing their infantry, the mineiros choose to increase their efficiency in battle. The equipments of the legalistic infantry were more modern, fast and precise when compared to the paulistas, facilitating the defense of the trenches. We can sign contracts with our arms manufactorers to re-modernize our infantry."
 bra_art_desc: "Enjoying more resources than his opponent, the Union imported artillery from abroad. Accurate, the cannons obliterated an entire Paulista squad in a hit. We can help our military-industrial enterprises to expand their industrial centers to a never-known level."
 bra_barragem_desc: "Prioritizing the financing of the Superior War School at Urca will favour graduation of more officers aware of overwhelming fire's and air support's various uses in warfare."
 bra_mot_desc: "During the civil war, the Paulista Army mobilized the great centers of production of automobiles of the capital and used of its production to move its soldiers quickly between the Legalist Trenches. We can found a new vehicle production manufactorer based on Duque de Caxias."
 bra_mec_desc: "One of the greatest feats of the state of São Paulo during the war was the construction of armored trains. Scatters of the conflicting coffee load, the trains were endowed with thick metal plates, in their windows were placed machine guns and, in front, a cannon. We can aid some truck manufactorers into creating a enterprise to supress our need for mechanized units."
 bra_blitz_desc: "Prioritizing the financing of the Agulhas Negras Military Academy at Resende will favour graduation of more officers aware of combination of arms' and quick manoeuvreing's various uses in warfare."
 bra_armor_desc: "During the civil war, both sides used War Tanks. The victory of the Union was partially decided by the use of the FT-17 in battle. Advancing their models will be of enormous advantage to the Army."
 bra_CTEF_CLT_desc: "The Technical Council of Economics and Finances was established to assist the president in relation to the economic and strategic decisions of the country."
 bra_sub_priv_desc: "Article 1: This Consolidation sets the standards which regulate individual and collective relations of work and conditions laid down therein."
 bra_obras_exterior_desc: "A country as large and sparsely populated as ours has logistics as one of its biggest challenges. Highways are the perfect solution for our problems, connecting the distant urban centers, fueling our automotive industry and surpassing our reliance on antiquated railway usage."

 bra_itabira_desc: "The mines in Itabira, Minas Gerais, are part of the Quadrilátero Ferrífero, the largest iron and bauxite deposit in the country and one of the largest in the world. Ensuring that the minerals extracted from there are used only by Brazil will guarantee our mineral sovereignty."
 bra_IRFM_desc: "Industrias Reunidas Matarazzo Factories were founded by the immigrant Franscesco Matarazzo in the 1920s. The set of 360 factories producing the most diverse goods can be expanded to meet most of the country's industrial demand."
 bra_eng_mart_desc: "Votorantim S.A is one of the biggest industries of São Paulo. Founded in 1918, it's the leading producer of celulose, paper, cement and many other raw materials to be employed in other manufacturies and construction sites. It would be in the nation's best interests to hand them rights over supplying government public works."
 bra_csn_desc: "The National Siderurgic Plan was established with the purpose of defining the iron extraction regions and implementing the construction of steelmaking centers in Brazil."
 bra_cmsp_desc: "The now-Metropolitan São Paulo is powered by the labour of her foreign immigrants. By aiding the poor from the other parts of our country - especially in the Northeast - into migrating to São Paulo, we'll surely have industries running with cheaper labour, and accelerate their expansion, at a great societal and demographic cost."
 bra_belem_porto_desc: "Construction of the Port of Belém gives the country a strategic base in the north, capable of supporting the Federation's vast fleets and serving as a base for invasion operations north of the Equator."
 bra_elet_1_desc: "The National Council of Waters and Electric Energy will be the avant-garde in planning the replacement of the thermoelectric matrix by one organized from the river systems of the nation, which have enormous and unexplored potential."
 bra_mod_mad_mamo_desc: "The Transamazonic Project is the one of represents one of our nation's biggest challenges: The ocupation of the Amazon Rainforest. Completing this Highway Project would increase the mobility of our troops in the North."

 bra_vale_desc: "Vale do Rio Doce will be the state company of extraction of the most diverse ores, such as Bauxite and Iron, as well as their reprocessing into Aluminum and Steel, of the Federation."
 bra_iti_desc: "The Ministry of Work, Commerce and Industry will assist the government in matters of industrial expansion and modernization."
 bra_mobilizacao_ind_desc: "By means of actions, decrees and subsections in the Constitution, the Union is able to increase the speed and scope of the State of Siege, considerably expanding Brazil's ability to respond to a war."
 bra_elet_2_desc: "Electrical Centrals of Brasil S.A is a joint-stock company organized by the Federal Government in order to coordinate the generation and distribution of electricity throughout the national territory, in order to guarantee the full presence of energy in the country."
 bra_mod_sb_desc: "The BR-163 will be central in the development and occupation of Mato Grosso and the Southern Amazon. Its small villages shall become what may be in the future major agricultural production and distribution hubs."
 bra_fiesp_desc: "The Federation of Industries of the State of São Paulo represents hundreds of unions and hundreds of thousands of industries in the most industrialized state of the Union. Articulating the plans of the government with its will is to unite the useful to the pleasant, favoring our ability to transit between new manufacturing projects, thus resulting in innovations during peace and war."
 bra_mod_soroc_desc: "The BR-116 would link Southern with Northeastern Brazil. Both centers of expressive production and consumption, as well as Brazil's most sensitive region in military terms, bordered against two of our historic enemies, and core of the Brazilian Army, respectively. Improving this connection is essential in assuring we meet national production and army quotas."
 bra_anhanguera_desc: "More extensive than most sections of the German Autobahn, the 'Via Anhanguera' will be the country's largest highway complex, and its 'affluent' highways connect the whole country with unprecedented driveability."
 bra_brasilia: "Brasília"
 bra_feb: "The Brazilian Expeditionary Forces"
 bra_feb_desc: "We have the logistical, tactical, organizational, industrial and numeral capacity to organize Expeditions abroad with the objective of defending the interests of the Republic before those who dare to fight them."
 bra_reclaim_uruguay: "Cisplatine"
 bra_brasilia_desc: "Moving the capital to the interior was one of the national objectives since the Empire of Pedro II. Not only would it be interesting in the matter of national security, ensuring that it could not be the capital subject to naval invasions, but also as a guarantee of the development of the interior. Let us now begin the construction of this new capital."
 bra_reclaim_uruguay_desc: "Uruguay was a Brazilian province until its disputable independence in 1825. Brazil, which was able to counteract the insubordination, preferred to allow its existence at the time. Now, without the Monroe Doctrine and recognized as one of the great nations in the international field, we must reacquire what is ours!"
 bra_brasilia_tooltip: "§CInitiates the much needed moving of the capital, renovating the political arena and centralising state decisions. Unlocks elections for the executive, and the option to sponsor preferred candidates.§!"
 bra_dofa_tooltip: "Gains Core and Wargoal against Uruguay and Paraguay"
 bra_ve_tooltip: "Gains Core and Wargoal against Argentina, Venezuela and Bolivia"
 bra_tropas_1932_tooltip: "Summon to our army the Veterans of the 1932' Revolution"
 bra_abertura: "The Mineiros' Manifesto"
 bra_noronha_tooltip: "Creates navy leader: Isaías de Noronha"
 bra_abertura_desc: "While Minas Gerais surprisingly backed Vargas in the Civil War, her industrials and politicians are disgruntled with Vargas's dismantling of their influence. A Manifesto against his actions will surely be welcome in our struggle against his tyranny."
 bra_monarquia_focus: "'Amor'"
 bra_monarquia_focus_desc: "Love - supreme principle through which a nation and her people guide their actions - must be present in all of our interactions. There is love in unity, brotherhood. Family. Who better to command this national family than a great father, fostering all his children through the struggles of the new century, as many before him have done?"
 bra_monarquia_tooltip: "§CInitiates the process of Imperial Restoration§!"
 bra_cosipa: "Aliperti"
 bra_cosipa_desc: "Founded in 1924 at Brás, in the city of São Paulo, Aliperti S.A started producing Steel in its dependencies on Água Funda. They promise to supply most of the civil market with quality steel products, as long as the state government improves access to Minas Gerais' iron quarters."
 bra_acominas: "Tupy S.A"
 bra_acominas_desc: "Three german descendents from Santa Catarina are requesting the local government of Joinville authorization to open a new metallurgical plant in the region. We should intervene to push it for acceptance."
 bra_bndes: "BNDE"
 bra_bndes_desc: "The National Bank for Economic Development will be a federal public company, headquartered in Rio de Janeiro, and whose main objective is to finance long-term investments in all segments of the economy, social, regional and environmental."
 bra_tenenge: "Tenenge S.A"
 bra_tenenge_desc: "The National Engineering Technique is an electromechanical engineering and heavy industrial construction firm in Brazil focused on portuary infrastructure and industrial assembly. We can sponsor it to expand the operations of Petrobrás and our Hydroelectric Plants in large scales."
 bra_gerdau: "Montreal S.A"
 bra_gerdau_desc: "Montreal Engenharia S.A is an mechanical engineering and medium industrial construction firm in Brazil focused on land infrastructure and industrial assembly. We can sponsor it to expand the operations of Petrobrás and our Medium-sized assemblies in large scales."
 bra_zfm: "Duty-Free Zone of Manaus"
 bra_chsf: "São Francisco Hydroelectric"
 bra_itaipu: "Itaipu Hydroelectrical Plant"
 bra_zfm_desc: "The Manaus Free Trade Zone will be a Brazilian industrial zone in Manaus to boost the economic development of the Western Amazon. The industrial center plans to house about 700 industries."
 bra_chsf_desc: "The São Francisco Hydroelectric Company is a publicly traded corporation that operates in the generation and transmission of energy in high and extra-high voltage, exploring the São Francisco river basin."
 bra_itaipu_desc: "The Itaipu Hydroelectric Power Plant is the most ambitious project in the federal government's imagery so far. It will be built in the Paraná River Basin and will be responsible for the entire electricity production of the South and Southeast regions. The Hydroelectrical marvel has been planned to become the biggest and most efficient of its kind, the greatest feat of Brazilian Engineering and Ingenuity."
 bra_diplomacia_tooltip: "§CInitiates diplomatic missions throughout the globe.§!"
 bra_mercosul_expansao_tooltip: "§CExpands the MERCOSUL commercial pact into the UNASUL, a joint-defense organization focused on South America, inviting MERCOSUL's members.§!"
 #bra_inimigo_eua_tooltip: "Diplomatic professionals will sucessfully muster enough support from other powers to pressure the US on not intervening on South American affairs."
 bra_ciclocana: "EMBRAPA"
 bra_ciclosoja: "The Soy Belt"
 bra_etanol: "'Proálcool'"
 bra_territoriosfederais: "'CIGS'"
 bra_guianas: "From the Prata to the Caribbean"
 bra_ciclocana_desc: "With the introduction of calcarization and localized irrigation, along with the federal incentives directed to the research of new technologies of planting through the brand-new Brazilian Company of Agricultural Research (EMBRAPA) we will be able to expand the production of sugar cane, whose presence is historical in national territory, to the gates of the Cerrado."
 bra_ciclosoja_desc:0  "With the introduction of advanced drainage methods and the mechanization of agriculture at the national level, it is possible to grow soybeans in Mato Grosso, a isolated region of the federation. Soy has never been cultivated on national soil. It represents potential as to serving as food, as well as being exported and serving as method for the colonization of the interior."
 bra_etanol_desc: "Never before has agriculture represented such potential for the Brazilian Economy and War Machine:  Through research conducted by the Federal Universities and EMBRAPA, it is now possible to replace Gasoline with hydrous Ethanol in most vehicles. PROÁLCOOL will be the Federal Government program focused on ensuring that vehicles produced in Brazil run on Alcohol from now on."
 bra_territoriosfederais_desc: "The Jungle Warfare Instruction Center (CIGS) is a military organization of the Brazilian Army based in Manaus, designed to qualify military leaders of small fractions, such as jungle warriors, as combatants capable of carrying out missions in more inhospitable areas of the Amazon Rainorest as well as in  similar environments."
 BRA_selva_tech_effect: "Creates the §CJungle Warfare Instruction Center - CIGS§!, focused on training our army as to defend our most precious national treasury. While in Jungles, §CInfantry, Cavalry, Armor, Artillery, Motorized, and Mechanized§! units will have a §C20%§! boost to movement and defense, as well as a §C10%§! attack boost."
 bra_vitrine_tooltip: "The effects of this focus will only be revealed when you pick your certain path on Vargas' future."
 bra_uiracu_tooltip: "Unlocks the §CDecisions§! for invading other South American countries."
 bra_viacao: "Ministry of Transport and Public Works"
 bra_viacao_desc: "With the Siderurgic Complex sufficiently established and the Technical Council of Economics and Finances controlling the logistical administration of the states, we will invest in the national industrial field through the reformed though already established Ministry of Transport and Public Works."

 bra_voz_ligada_flag: "Focii Audios are Enabled"
 
 bra_voz_ligada_off_tooltip: "Turns §Boff§! the Audios after focus completion"
 bra_voz_ligada_on_tooltip: "Turns §Con§! the Audios after focus completion"
 bra_etanol_focus_tooltip: "Enables the §CPró-Alcool Decisions§!"
 
 bra_eletrobras: "Telebrás"
 bra_eletronuclear: "Eletronuclear"
 bra_infraero: "Infraero"
 bra_eletrobras_desc: "Brazilian Telecomunications S/A will be a federal company responsible for comandeering the national communication policy, as well as providing telephone services and organizing the distribution of adequate communication infrastructure throughout the country."
 bra_eletronuclear_desc: "Eletrobras Eletronuclear is an administrative company intended to build and operate thermonuclear plants in the national territory, ensuring diversity in the energetic matrix and, possibly, raw material for the development of nuclear weapons."
 bra_infraero_desc: "The Brazilian Airport Infrastructure Company is a federal public company focused on regularizing and operating airports of all sizes throughout the country, in order to guarantee the omnipresence of planes in national lands and skies."
 
 bra_amigo_eua_tooltip: "If the Democratic United States is in the Allies, Brazil will ask the United Kingdom to join. If the Loyalists are in power and have a faction, Brazil will directly join the US's faction."

 bra_mercosul_tooltip: "§CCreates a Trade Pact and opens rooms for future invitations into UNASUL for Latin American nations with the same ideology. Democracies and Non-Aligned are mutually participating.§!"

 bra_mercosul_militar_tooltip: "§CAdds two buildings slots, one Military Factory, one Civilian Factory and one Infrastructure level in a random state of all South American MERCOSUL members.§!"

 bra_entreguismo_tooltip: "§CAdopting this policy will give you more benefits whenever allying with any foreign power through the focii.§!"
 

 
 bra_monarquia_2_focus: "Formalize the Patrianovist Movement"
 bra_monarquia_2_focus_desc: "The Patrianovist moviment - translated literally to "New-Fatherlandism" - is an monarchist organization in close ideological proximity to the tenets of Integralism. In terms of the possibility of an Imperial Restoration, it represents Brazil's best shot. Like most political organizations, it has been banned by the new constitution, but this doesn't mean it can't still operate."
 bra_patri_1_focus: "Bring in the Integralists"
 bra_patri_1_focus_desc: "Vargas' Coup has left all parties in disarray. With Plínio's Ministry a distant dream, we can harness our influence with the Afro-Brazilian and Northeastern communities to convince the Integralists that unifying our efforts and turning their "Organic Republic" into an Empire is their best shot at survival."
 bra_patri_2_focus: "The Army of Caxias"
 bra_patri_2_focus_desc: "The Brazilian Army was the main actor during the coup that exiled Emperor Pedro II in 1889. Many members of the armed forces, including then Marshal Deodoro himself, came to regret the unfoldings of November the 15th. By re-linking the Brazilian Army's patron, Caxias, to his loyal service to the Emperor, we can surely shake their faith in the Republican institutions."
 bra_patri_3_focus: "Memoirs of the Liberator"
 bra_patri_3_focus_desc: "In 1888 Princess Isabel, daughter of Pedro II, signed in law the absolute prohibition of slavery. For that, she and her family are well-loved by Brazil's black community. Most of her admirers are still in the fields and away from the cities, far from Vargas' populism's reach, and ever closer to supporting our cause."
 bra_patri_4_focus: "On Freemasonry"
 bra_patri_4_focus_desc: "While Freemasonry and her acolytes have been publicaly shunned and despised by the Catholic community world-wide, Brazilian Freemasonry had the personal approval of our monarchs. It's up to the moviment and to the future emperor himself as to whether or not they'll be allowed to operate in the third empire."
 bra_patri_5_focus: "Restore the 'Padroado'"
 bra_patri_5_focus_desc: "The support of Freemasonry nationally-wide would mean a direct affront to the Church, but this doesn't mean we are prone to instating a secular empire. Catholicism, while conductor of our citizens morals and ethics, will only not influence the Emperor's. To that avail, we'll restore the Padroado system, through which the Moderative Power regulates the Church's operation in our country."
 bra_patri_6_focus: "The Pact of Saint Christopher"
 bra_patri_6_focus_desc: "The banishment of Freemasonry nationally-wide is a radical, yet necessary, manouver. Now that the possibility of their betrayal yet again of the Emperor is addressed, we'll need the Church's support more than ever. The Pact of St. Christopher, to be sealed in the Palace of St. Christopher, would solidify the church's position and their role into assisting the Imperial state."
 bra_patri_7_focus: "Our Parliamentarianism"
 bra_patri_7_focus_desc: "Brazil too big, too diverse and too proud to succumb to the temptations of tyranny. The maintainance of Provincial Legislative Assemblies, the autonomy of the parliament to pass constitutional changes and the regional control of the National Guard - through the imposition of the Aditional Act of 1834 - will have it so all of Brazil keeps itself whole without our baby-sitting." 
 bra_patri_8_focus: "The Organic Empire"
 bra_patri_8_focus_desc: "The union of all races and peoples - driven by the ever-increasing wish for national prosperity and glory - has no space for regional politics and political manouvers. The empowerment of the Moderative Power, materialized by the re-interpretation of the Interpretative Law of 1840, will assure the Emperor has complete control over the national guard and provincial administration."
 bra_patri_9_focus: "The Restoration"
 bra_patri_9_focus_desc: "The army, the big politicians, the integralist militias, the blacks, the poor, the whites, the rich. All Brazilians, all servants of His Majesty. These Brazilians, empowered by the national renovation, will consolidate the birth of the Third Brazilian Empire."

 bra_patri_5_tooltip: "§C$BRA_pedro_iii$ will have the support of the great republican politicians and the Freemasonry.§!\n" 
 bra_patri_6_tooltip: "§C$BRA_pedro_iii$ will acquire greater public support, especially with the people, at the cost of being much less popular with the Elites.§!\n"

 bra_modernizacao_marinha_tooltip: "Mobilizes §YAdmirals§! for a possible conflict."

 bra_pm: "Reorganize the Public Forces"
 bra_pm_desc: "The enduring Public Forces model of security forces gives away a lot of power to the states when it comes to public policing, and gives them ways to defy the Federal Government's authority. The Military Polices, modeled after the Army, will patrol the streets better and stand firmly with the Federal Capital." 
 
 signal_company_tech: "Signal Company Technology"
 military_police_tech: "Military Police Technology"
 
 bra_por_potential_civil_war_tooltip: "§YIf Brazil is Fascist and has less than 50% Fascist Popularity, this focus will initiate a Civil War with the Integralists as protagonists. Otherwise, Portugal will recieve a Casus Belli on Brazil.§!"
 
 continuous_bra_politicagem: "'Politicagem'"
 continuous_bra_politicagem_desc: "The uniquely Brazilian expression is the routine of crony politics of the Iberian World: for the state to syphon resources with the sole purpose of perpetuating its own existance. While this might be generally regarded as bad, an ambitious leader might need a lot of political power to get the job done, and might find so by dedicating his cabinet's time into exclusively dealing with other politicians."
 continuous_bra_politicagem_tooltip: "Doesn't cost Political Power Upkeep"
 
 continuous_bra_welfare: "Public Welfare"
 continuous_bra_welfare_desc: "The country's economic and industrial expansion, even if patriotic and inspiring, isn't enough for most citizens. In order to upheld social cohesion, hinder subversion and increase the efficiency of our work, the State can invest in public health, education and public transport, in order to secure our homeland's stability."
 
 
