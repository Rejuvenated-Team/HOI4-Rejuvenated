 bra_national_security_law_desc: "The Communist Putsch of 1935 realized our long-standing fear of an attemted ANL coup. By expanding the National Security Law we will assure triumph for the Second Republic."
 bra_polaca_desc: "In the wake of a Communist Putsch and the possbility of an Integralist one, a Fourth Brazilian Constitution can be implemented with the objective of the establishment of a system focused on the President of the Republic, in order to safeguard her integrity and independence."
 bra_a_voz_do_brasil_desc: " 'The Voice of Brazil is a radiophonic state-run obligatory-diffusion program that goes on-air daily in all Brazilian media' usable for the spread of nationalistic propaganda"
 bra_populism_desc: "Order - the sole conservation of what's good, beautiful and positive - as basis will be a powerful statement for the new age, away from the past's mistakes and tragedies of famine and poverty." 
 bra_plan_cohen_desc: "The Green Hens, as we have come to call the Integralists, are violently opposing the people's triumph in Brazil. To ensure the ultimate victory of the coalition, we must harass and boycott all integralist meetings and marches!"
 bra_2_prestes_column_desc: "Between the years of 1925 and 1927 Luís Carlos Prestes, today the formal leader of the coalition Brazil's communist and leftist anti-Vargas moviments - declared illegal -, marched thousands of kilometers throughout the inner country mustering support for our emancipation. Repeating the feat in our major cities will surely make the people aware of the ANL's intent."
 bra_cosmopolitanism_desc: "We've strenghened our grip in the lower echelons of the army, made the populace aware of our intents and neutralized the fascist threat. Now, only one enemy remains. We will end what we started in 35."
 bra_dreams_of_an_empire_desc: "Now that we've united the right under the Sigma, Plínio Salgado's claim over the Ministry of Education became much more significant. Through this position, we can start having more direct influence over presidental affairs, and shift the youth in our favor."
 bra_brazilian_action_desc: "Through Vargas' National Security Law, the ANL and the PCB became illegal. The immense political backlash left national politics in disarray. While the AIB is already a popular titan, we can expand her to incorporate most anti-Vargas conservative agrarian politicians, streghening fascism's influence over the government."
 bra_vital_espace_desc: "As we conceded and expanded, Integralism became a force to be reckoned with. Now Vargas stands alone, making himself an enemy of the left and our officers' puppet. The Catete is within our grasp."
 bra_federalism_desc: "Progress - the ultimate goal of development and unity - is the amalgamation of our nation's social and industrial development, as well as her citizens' moral and individual upheavals."
 bra_estado_novo_desc: "A central state, in its complete wisefullness, is capable of providing the general well being of its citizens and prosperity for its entrepreneurs. This eternal bond between the Republic's workers, officers and businessmen shall guarantee an eternal Brazilian union. At least that's what will be printed."
 bra_quereismo_desc: "While Vargas position has been safeguarded through the National Security Law, we can't rely on our Integralist generals, Communist soldiers and Liberal politicians solely. By plotting these groups against each other - dividing and conquering - we can pacefully and safefully stripe them away from influence."
 bra_regionalism_desc: "While the National Security Law's enforcement has been a major blow to our relations with Vargas' provisory government, and the Polaca even worse, it's not time to yield. A compromise with the Fascists and a gathering of legalist officers will keep us bind and strong enough to combat Vargas."
 #bra_new_constitution_desc: "'What I do not understand is how a nation, like Brazil, after more than a century of constitutional life and liberalism, has regressed into a dictatorship without brakes and without limits which degrades and depletes us before the civilized world!'"
 bra_patriotic_effort_desc: "Our rival's needless querels have resulted in fruitfull opportunities for the New State to fortify itself. Through the Department of Press and Propaganda (DIP) we will surely bring the youth and the media to our favor, and assure this government prospers for long."
 bra_tecnocratic_reform_desc: "Marshal Eurico Gaspar Dutra is the informal leader of the Brazilian Army, held with regard by most officers and previously a strong backer of Vargas's cause. Now, faced against tyranny and opposition, Dutra favours democracy, and has agreed to "gently ask" Vargas to fly back to his farm in São Borja."
 bra_tiro_de_guerra_desc: "The 'Tiro de Guerra' was instituted as an Army policy in 1916, consisting in the basic training of unmobilized reserves of the country in the case of war. The Expansion of this program ensures that the columns of the army are filled by men better trained and closer to becoming fit for combat."
