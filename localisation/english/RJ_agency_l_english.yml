l_english:
#Agency Upgrades
 upgrade_internal_security: "Internal Security"
 upgrade_internal_security_desc: "§LAddressing places within our own government and military easily exploited by foreign intelligence services is the best defense against the hostile actions of enemy operatives.  By educating personnel in all fields of security, and monitoring trusted personnel for risks in areas such as financial stress, political views, or vulnerability to blackmail we can counter the efforts of our enemies.§!"
 upgrade_rf_interference: "Radio Frequency Interference"
 upgrade_rf_interference_desc: "§LForeign actors send messages using radio waves. Messages from them can be easily compromised. By training specialists who know how to compromise them by sending additional radio waves. This renders them useless to our enemies.§!"

#Operative Traits
 operative_revolutionary: "Revolutionary"
 operative_revolutionary_desc: "This Operative is a fearless advocate for radical, political change."
 operative_insurgent: "Insurgent"
 operative_insurgent_desc: "This Operative is a skilled guerrilla warrior, trained in the art of asymmetrical battle."
 operative_scientist: "Scientist"
 operative_scientist_desc: "This Operative is highly educated, and commands a powerful intellect."
 operative_web_of_lies: "Web Of Lies"
 operative_web_of_lies_desc: "This Operative is like a spider at the center of a web.  Woven from secrets ... and lies."
 operative_spyhunter: "Spy Hunter"
 operative_spyhunter_desc: "This Operative is skilled at hunting and catching enemy agents."
 operative_codebreaker: "Cipher Expert"
 operative_codebreaker_desc: "This Operative is gifted in the use of codes and ciphers."

