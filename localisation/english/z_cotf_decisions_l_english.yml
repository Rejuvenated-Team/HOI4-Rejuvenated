l_english:
 #PRC CHINA
 PRC_force_japan_war_cat: "Japanese Escalation"
 PRC_force_japanese_war_against_communists: "Force Japan's Hand"
 PRC_force_japanese_war_against_communists_desc: "Japan is already fighting along our border and occupying land adjacent to our positions. A direct provocation could force them to commit openly against us."
 #JAPAN
 JAP_prepare_war_against_chinese_communists_mission: "Clashes against the Chinese Communists"
 JAP_prepare_war_against_chinese_communists_mission_desc: "Our troops are being constantly attacked by the Communist guerrillas of Yan'an. This is war in all but name."
 JAP_fading_sun_decisions: "The Fading Sun"
 JAP_fading_sun_decisions_desc: "We must decide how to survive after the collapse of our continental ambitions."
 JAP_cancel_fading_sun_guarantees: "Break Defensive Treaties"
 JAP_cancel_fading_sun_guarantees_desc: "Japan's old security commitments and foreign assurances now risk dragging us into wars we cannot afford. We must sever these ties before they tighten around us."
 JAP_seek_allied_support_in_defensive_war: "End Absolute Isolation"
 JAP_seek_allied_support_in_defensive_war_desc: "With Japan under attack, we must seek allies once again."
 JAP_cancel_fading_sun_guarantees_tt: "All guarantees made by Japan and all guarantees made toward Japan will be cancelled."
 MAN_the_jade_marshals_declining_health: "The Jade Marshal's Declining Health"
 MAN_the_jade_marshals_declining_health_desc: "Wu Peifu's age and stubborn refusal to accept foreign-supervised treatment have left his ministers uneasy. For now the Jade Marshal remains at his post, but the question of his health can no longer be avoided."
 #SHANXI
 SHX_suiyuan_campaign_category: "The Suiyuan Campaign"
 SHX_suiyuan_campaign_mission: "The Suiyuan Campaign"
 SHX_suiyuan_campaign_mission_desc: "The Mongols of Mengjiang have just begun an offensive in our northern lands. We must fight tooth and nail and drive the invaders out of China!"
 MEN_suiyuan_campaign_mission: "The Suiyuan Campaign"
 MEN_suiyuan_campaign_mission_desc: "With the help of Japanese advisors, our offensive in Suiyuan has begun. We must be swift, or they may discover the hidden hand moving the pieces on the board."
 SHX_suiyuan_campaign_transfer_tt: "After the war ends, §Rany state lost to our enemy will be transferred to them§!, §Gwhile any state controlled by us will remain under our rule.§!"
 #GUANGXI GUANGDONG
 GXC_GDC_war_in_liangguang: "War in Liangguang"
 GXC_GDC_war_in_liangguang_desc: "The war in Liangguang cannot drag on forever. If the fighting stalls, political pressure will force both sides to accept a temporary settlement."
 GXC_GDC_CHI_war_in_south_halting: "Growing opposition to the war"
 GXC_GDC_holding_out: "Holding out"
 GXC_federalist_integration: "Expand the Federation"
 GXC_federalist_integration_desc: "The Federalist Constitution gives us the authority to invite the peoples of Asia to join our federation as equal partners. Those who refuse this peaceful path will leave us no alternative but force."
 GXC_invite_country_to_the_federation: "Invite [FROM.GetNameDef] to the Federation"
 GXC_invite_country_to_the_federation_desc: "Invite [FROM.GetNameDef] to join our federation. Neither country may be a subject, and we cannot issue an invitation while at war with one another."
 GXC_proclaim_the_asian_federation: "Proclaim the Asian Federation"
 GXC_proclaim_the_asian_federation_desc: "The peoples of China, Mongolia, Tibet, Manchuria, Korea, and the overseas Chinese communities now stand united under one federal constitution. It is time to proclaim a federation whose identity reaches beyond China alone."
 #FRANCE
 FRA_vietnam_war: "Secure Vietnam"
 FRA_vietnam_war_desc: "Nobody likes fighting far from home in a war that only benefits the government. We must defeat the Vietnamese before the people begins going against us!"
 FRA_vietnam_surrender: "Ask for peace to Vietnam"
 FRA_they_shall_not_pass: "Ils Ne Passeront Pas!"
 FRA_they_shall_not_pass_desc: "Just like in the battle of Verdun, we must defend our homeland from the German barbarians, they shall not pass, ils ne passeront pas!"
