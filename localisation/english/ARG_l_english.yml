#Focuses
 ARG_fraude_patriotico: "Fraude Patriótico"
 ARG_fraude_patriotico_desc: "After coming to power by electoral fraud in 1931, the Concordancia started a new politic called the "Fraude Patriótico" (Patriotic Fraud). Its main objective wasn't only to impede the anarcho-syndicalists and communists from participating in the elections, but to impede the Unión Cívica Radical (Radical Civil Union) from ever coming back to power after their autoritarian government led by Hipólito Yrigoyen."
 ARG_support_the_spanish_republic: "Support the Spanish Republic"
 ARG_support_the_spanish_republic_desc: "The peoples of Spain are struggling in their war against the Nationalist coup that threatens to take over their entire country. The most human thing to do is to help them against the forces of fascism."
 ARG_support_the_spanish_nationalists: "Support the Spanish Nationalists"
 ARG_support_the_spanish_nationalists_desc: "We must show our support to the Spanish nationalists, who are fighting for the glory of their country against the communist and anarchist threats, just like we did in the Patagonia Rebelde."
 ARG_march_in_buenos_aires: "March in Buenos Aires"
 ARG_march_in_buenos_aires_desc: "The Liga Patriótica Argentina (Patriotic Argentine League) played an important role in Argentina during the 10's and 20's, when they helped the government to suppress the strikers in the Semana Trágica and the Patagonia Rebelde. However, they stopped their activities after the coup of 1930, until now, where rumours about Manuel Carlés organizing his version of the March on Rome began in the streets of Buenos Aires."
 ARG_guided_elections: "Guided Elections"
 ARG_guided_elections_desc: "Now that Agustín Pedro Justo's government has come to an end, it is time to hold elections! However, we must make sure the UCR doesn't win these elections, nor another ones in the future."
 ARG_third_patagonia_rebelde: "Third Patagonia Rebelde"
 ARG_third_patagonia_rebelde_desc: "In the 20's there were two uprisings led by anarcho-syndicalist Antonio Soto in the Patagonia, commonly known as Patagonia Rebelde (Rebel Patagonia). At first it was only a general strike, but it quickly turned into an armed revolt. The uprising ended up being suppressed, however, rumours about a third Patagonia Rebelde have began spreading in Argentina, but this time, not only the Patagonia will be a rebel."
 ARG_untermensch: "Untermensch"
 ARG_untermensch_desc: "We will not let Jews stab our nation as they did to Germany in the Great War, all Argentines must join us into our fight against the greatest demon!"
 ARG_for_god_and_country: "For God and Country"
 ARG_for_god_and_country_desc: "We must make sure every Argentine follows the values of catholicism and christianity in order to unite our nation."
 ARG_to_save_argentina: "To Save Argentina"
 ARG_to_save_argentina_desc: "We can't fuel our nation with hate to some race, or blind following of some doctrine. We must convince our people that the only government that is willing to help them is ourselves."
 ARG_german_support: "German Support"
 ARG_german_support_desc: "Now that we have adopted an antisemitic stance, the German Reich will surely help us to increase the capabilities of our army."
 ARG_spanish_support: "Spanish Support"
 ARG_spanish_support_desc: "The Spanish falangism is known for its allegiance to catholicism. Now that our government has adopted a clerical fascist stance, they most probably will be willing to help us."
 ARG_italian_support: "Italian Support"
 ARG_italian_support_desc: "Asking for help to the creator of fascism itself will probably result on the increase of the capabilities of our army."
 ARG_help_the_workers: "Help the Workers"
 ARG_help_the_workers_desc: "Our league was not only famous for its performance in the Semana Trágica and the Patagonia Rebelde, but also for developing a whole work of social assistance to the workers, which started the organization of workshops, dining rooms, schools, piggy banks for the workers, and much more. We will not let this renown be forgotten, therefore we will begin the creation of a welfare state in Argentina."
 ARG_nationalize_the_transport_system: "Nationalize the Transport System"
 ARG_nationalize_the_transport_system_desc: "Since its creation the transport systems of Argentina have been owned by foreign companies, mostly British. However, after the signing of the Roca-Runciman Pact in 1933, we were forced to hand a monopoly over Argentine transports to Britain. This ends now, the Argentine transports will be led by Argentines, for Argentines!"
 ARG_renounce_to_the_slavers_pact: "Renounce to the Slavers Pact"
 ARG_renounce_to_the_slavers_pact_desc: "The British thought that they could enslave the Argentine people and economy, however, this ends now! The Roca-Runciman Pact shall not haunt Argentina ever again!"
 ARG_bring_glory_back_to_argentina: "Bring Glory Back to Argentina"
 ARG_bring_glory_back_to_argentina_desc: "The Provincias Unidas del Río de la Plata (United Provinces of the River of Silver) was a state conformed by Bolivia, Argentina, Paraguay and Uruguay that existed between 1810 and 1831, after the Bolivians got their independence with the help of Gran Colombia, and the Paraguayians and Uruguayians seceded from the union. But this time, there will be nothing nor no one able to defend them."
 ARG_conquer_the_rebels: "Conquer the Rebels"
 ARG_conquer_the_rebels_desc: "The rebel provinces of Paraguay and Uruguay shall join our mighty union again, even if they don't wish to do so."
 ARG_recover_tarija: "Recover Tarija"
 ARG_recover_tarija_desc: "Ever since our independence we have had a territorial dispute with Bolivia over the region of Tarija. In 1826 these traitors annexed it and refused to return it to us, but years after, we and Chile fought and won against the Peru-Bolivian Confederation. But unfortunately we were not able to hold control over Tarija. However, this time, the Bolivians are alone, and ready to be annexed."
 ARG_our_long_time_rival: "Our Long-time Rival"
 ARG_our_long_time_rival_desc: "Ever since our independence we have had a rivalry against the Brazilian titan over the regions of Uruguay and the Misiones Orientales. In those days we were not united, and constant civil wars and disunity didn't let us defeat them, but this time, we are united and ready."
 ARG_la_plata_reborn: "La Plata"
 ARG_la_plata_reborn_desc: "Now that we have reunitied the United Provinces of the Río de la Plata, it is time to reform our union under the name of La Plata, and this time there will be no instability or caudillo able to divide it!"
 ARG_help_our_brothers: "Help our Brothers"
 ARG_help_our_brothers_desc: "We must help our brothers in Europe in order to secure the victory of fascism in this global conflict."
 ARG_our_last_objective: "Our Last Objective"
 ARG_our_last_objective_desc: "There is still a region of the old La Plata to recover, the Malvinas. However, currently we are not ready to face the British forces, but if we begin to prepare now, the exact moment they slip up, we will be ready to make them fall."
 ARG_eden_malbran_pact: "Eden-Malbrán Pact"
 ARG_eden_malbran_pact_desc: "Currently the Roca-Runciman Pact only benefits the British companies, leaving Argentina as an economic slave of the British Empire. We should start negotiating a new pact that benefit us both."
 ARG_british_investiments: "British Investiments"
 ARG_british_investiments_desc: "We should promote British investiments in Buenos Aires, as well as stopping the British monopoly over the transports of the city."
 ARG_to_end_the_fraud: "To End the Fraud"
 ARG_to_end_the_fraud_desc: "Even though president Roberto Ortiz was elected by the usage of electoral fraud, he is totally against it. He has announced that under his government Argentina will lean towards democracy, but only time will say if he keeps his promises."
 ARG_the_open_door: "The Open Door"
 ARG_the_open_door_desc: "Argentina has always been known for its recievement of immigrants from Europe, and in these dire times where wars wage all around the globe, having refugees that have one thing or two about their country situation will be helpful, even if it means to let some spies enter the country time to time."
 ARG_shelter_intellectuals: "Shelter Intellectuals"
 ARG_shelter_intellectuals_desc: "Many intellectuals, usually Jews, communists and fascists end up being kicked out from their homelands by the government, but they must not forget that we will be always there to recieve them."
 ARG_our_last_hope: "Our Last Hope"
 ARG_our_last_hope_desc: "Roberto Ortiz's condition has began worsening quite quickly. An oculist was sent from the USA to help Ortiz, but after a tense medical board, he said that there was nothing it could be done to aliviate his situation. The USA has offered Ortiz to go there to get treatment, but he thinks his fate is clear. Should we force him to go there anyway, or let him live his last months home?"
 ARG_gods_will: "God's Will"
 ARG_gods_will_desc: "Roberto Ortiz's condition began worsening quite quickly, reaching the point were he became totally blind. Today he resigned saying "I resisted these two years because I was convinced there was a way to aliviate my pain. God has not wanted it and I abide by his will." Now power has been transfered to Ramón S. Castillo, the conservative vice-president, and it seems that the dream of Argentine democracy has come to an end."
 ARG_a_new_era: "A New Era"
 ARG_a_new_era_desc: "Now that Ortiz has miracously recovered, it is time to begin a new era in Argentina, an era of peace and democracy."
 ARG_joint_oil_extraction: "Joint Oil Extraction"
 ARG_joint_oil_extraction_desc: "With the prospect of possible oil fields in our territory, we have attracted foreign attention. Friendly powers are eager to support our oil industry with their technical know-how, and this would be a lucrative opportunity to learn from their advances."
 ARG_those_who_dont_learn_from_history: "Those Who Don't Learn from History"
 ARG_those_who_dont_learn_from_history_desc: "Those who don't learn from history are doomed to repeat it. We tried not to fall again in a military dictatorship, but due to Ramón S. Castillo's government, a coup has began once again. May god save Argentina, for no one else can."
 ARG_shall_not_be_us: "Shall Not Be Us"
 ARG_shall_not_be_us_desc: "We might have fallen to a dictatorship again, but this time this dictatorship will care about its people. May it be led by Rawson, Ramírez, Farell or Perón, corruption and authoritarism will not reign Argentina again!"
 ARG_join_the_allies: "Join the Allies"
 ARG_join_the_allies_desc: "We must join the Allies in their struggle against communism and fascism before it's too late!"
 ARG_we_shall_not_fall: "We Shall Not Fall"
 ARG_we_shall_not_fall_desc: "We must make our best efforts to impede the fall of our uprising against the Argentine government! Every weapon will work, from a rusty revolver to a Soviet Mosin. Onwards, for our future!"
 ARG_our_new_leader: "Our New Leader"
 ARG_our_new_leader_desc: "It is time to choose the new leader of Argentina! Obviously, people is not ready for this important decision, therefore a council of members of the the Unión Sindical Argentina (Argentine Syndical Union), the Communist Party and the newly formed Partido Justicialista (Justicialist Party)."
 ARG_we_are_all_peronists: "We Are All Peronists"
 ARG_we_are_all_peronists_desc: "May you be a rightist or a leftist, as long as you care for Argentina and its workers, you are a peronist! Now, follow us, for a controlled national economy and a welfare state in Argentina!"
 ARG_anarcho_syndicalism: "Anarcho-Syndicalism"
 ARG_anarcho_syndicalism_desc: "Antonio Soto knows whats better for the Argentine workers! We shall advocate interest aggregation of multiple non-competitive categorized units to negotiate and manage the economy, and industry will be run through co-operative confederations and mutual aid. A dream for the Argentine worker!"
 ARG_femminist_communism: "Femminist Communism"
 ARG_femminist_communism_desc: "Communism states that all human beings are equal, therefore, shouldn't women take part of politics and carrying the revolution too? Well, Fanny Jabcovsky, leader of the Communist Party thinks so! Men and women united will carry the red banner for the future of the Argentine worker!"
 ARG_rural_work_reform: "Rural Work Reform"
 ARG_rural_work_reform_desc: "Perón has just announced the promulgation of the Status of the Countryside Worker. This will set humanitarian working conditions rural workers, including minimum wages, Sunday rest, paid vacations, hygiene and accommodation conditions. ¡Viva Perón!"
 ARG_increase_worker_rights: "Increase Worker Rights"
 ARG_increase_worker_rights_desc: "Perón has just announced the promulgation of the Labor Courts. It will grant new rights such as indemnifications, paid vacations, sick leaves, prevention of work accidents, technical training, and even more. Also, syndicates are declared public good entities. In this way, workers obtain the recognition of their rights, and are given legal support and have the state as a backup."
 ARG_el_mejor_trabajador: "El Primer Trabajador"
 ARG_el_mejor_trabajador_desc: "For that great Argentine; who worked incessantly; so that love and equality; reigns in the town. Perón, Perón, how great you are! My general, how much are you worth! Perón, Perón, grand director; you're the first worker!"
 ARG_triple_a: "Triple A"
 ARG_triple_a_desc: "The Alianza Anticomunista Argentina (Anti-communist Argentine Alliance) is a parapolice created by a sector of peronism, syndicalism, the police and the Argentine military. It has began murdered artists, priests, intellectuals, leftist politicians, students, historians and trade unionists, in addition to using torture, summary executions and the forced disappearance of persons contrary to Perón's leadership."
 ARG_biased_education: "Biased Education"
 ARG_biased_education_desc: "All schools must stop this religious education that is poisoning our children minds. Instead, they will teach our kids that Perón loves them! Perón is a good governor! ¡Viva Perón!"
 ARG_start_the_nuclear_program: "Start the Nuclear Program"
 ARG_start_the_nuclear_program_desc: "Now that the atomic bomb has been created, it is time to make the first Argentine nuke! Therefore, we will begin recruiting German scientists to help us begin our nuclear program now! ¡Viva Perón!"
 ARG_join_the_vanguards: "Join the Vanguards"
 ARG_join_the_vanguards_desc: "We shall join the fascist vanguards in Europe, then we will be able to defend our nation from the enemies of the Argentine workers! ¡Viva Perón!"
 ARG_the_first_argentine_plane: "The First Argentine Plane"
 ARG_the_first_argentine_plane_desc: "With help of European designers, our leader Juan Domingo Perón has started the creation of the I.Ae. 27 Pulqui I, one of the first South American planes. We should be totally proud of this achievement! ¡Viva Perón!"
 ARG_decentralization_campaign: "Decentralization Campaign"
 ARG_decentralization_campaign_desc: "Argentina, as many South American nations, is quite centralized. This will end now, so all the workers of Argentina are equally important!"
 ARG_worker_and_farmer_rights: "Worker and Farmer Rights"
 ARG_worker_and_farmer_rights_desc: "Workers and farmers of Argentina have been oppressed for ages, but this ends now. We will grant them new rights such as indemnifications, paid vacations, sick leaves, prevention of work accidents, technical training, and many more!"
 ARG_reject_the_church: "Reject the Church"
 ARG_reject_the_church_desc: "Religion has only poisoned the minds of the Argentines for centuries, but this will end now. It is time to liberate the workers of Argentina!"
 ARG_join_the_comitern: "Join the Comitern"
 ARG_join_the_comitern_desc: "All workers in the world shall unite against the forces of fascism and capitalism!"
 ARG_hold_the_torch: "Hold the Torch"
 ARG_hold_the_torch_desc: "We can't rely in foreign nations to be able to protect ourselves from our enemies. We shall begin carrying the torch in the crusade to liberate the workers of America!"
 ARG_the_andesia_republic: "The Andesia Republic"
 ARG_the_andesia_republic_desc: "Liborio Justo as well as Vicente Huidobro have understood that the only way to destroy US' imperialism is by uniting against it. Both have promoted the idea of "Andesia", a federation uniting Chile, Argentina, Paraguay, Uruguay and Bolivia into one nation to be able to fight against the North American hegemon. We will ask these nations to join us, however it's unlikely for them to accept this radical proposition."
 ARG_liberate_the_sons_of_bolivar: "Liberate the Sons of Bolívar"
 ARG_liberate_the_sons_of_bolivar_desc: "Simón Bolívar, just like Huidobro, wanted South America to unite against an imperialist enemy. We must unite Hispanic America before its too late."
 ARG_strike_at_the_rival: "Strike at the Rival"
 ARG_strike_at_the_rival_desc: "Now that we are beginning to unite Hispanic America, it's only a matter of time until Brazil see us as a menace and either joins the United States, or launches an preemptive strike against us. We can't let this happen."
 ARG_march_northwards: "March Northwards"
 ARG_march_northwards_desc: "Mexico and Central America were not part of Huidobro's plan at all, however it is impossible to be able to attack the United States from air or sea. Therefore, we'll have to make a sacrifice, and start marching northwards."
 ARG_liberate_america: "Liberate America"
 ARG_liberate_america_desc: "Chile, Mexico, Japan, Spain, the Philippines, Cuba, Puerto Rico, Panama, the Dominican Republic, Nicaragua, Haiti, China, Russia, Canada and Hawaii. All these countries were attacked, and in some cases even annexed by the United States. Now it is time to avenge all the killed by this bloody nation, by burning Washington down to ashes!"
 ARG_many_rights: "Many Rights"
 ARG_many_rights_desc: "Men and women in Argentina shall be treated equally by the law and constitution. Now all Argentine women will have the right to vote, work, or even lead the country!"
 ARG_carry_many_duties: "Carry Many Duties"
 ARG_carry_many_duties_desc: "But many rights come with many duties, some of them being mandatory military training so in case of a foreign invasion every Argentine, may it be a man or a woman, can defen the nation. Total equality also bring disavantages, doesn't it?"
 ARG_socorro_rojo: "Socorro Rojo"
 ARG_socorro_rojo_desc: "The Socorro Rojo Internacional (International Red Aid) was an international social service organized by the Communist International in 1922, created to function as an international Red Cross and independent of any religious organization or denomination. However, Argentina doesn't have an official branch of the Socorro Rojo, until now!"
 ARG_montoneros: "Montoneros"
 ARG_montoneros_desc: "The Montoneros or Montoneras were militias who fought in the War of Independence of many Latin American countries in the 18th century. Now the montoneras shall fight again, but this time, for the independence of the Argentine worker!"
 ARG_spread_the_revolution: "Spread the Revolution"
 ARG_spread_the_revolution_desc: "We must take the duty of liberating the workers of South America, and then, of the world!"
 ARG_continue_pinedos_plan: "Continue Pinedo's Plan"
 ARG_continue_pinedos_plan_desc: "Federico Pinedo's economic action plan began in 1933 in order to aliviate the economic situation of Argentina. The evaluation of the peso, split between the official and free markets, regulations in the goods markets, the creation of the Central Bank and expansion of public spending will help us."
 ARG_not_more_humillations: "Not More Humillations"
 ARG_not_more_humillations_desc: "We were totally humillated by the British when they practically forced us to sign the Roca-Runciman Pact, we lifted all the tariffs to British exports to Argentina, gave a "gentle" treatment to British companies, and handed a monopoly over Argentine transports to England. We must fix our economy now so we don't get enslaved by a foreign nation again!"
 ARG_meat_exports: "Meat Exports"
 ARG_meat_exports_desc: "Argentina is known around the globe for its meat exports. Increasing this industry is something we should do."
 ARG_wool_exports: "Wool Exports"
 ARG_wool_exports_desc: "Argentina last decade was known for its wool exports. We should increase the capabilities of this industry to help our economy."
 ARG_cotton_exports: "Cotton Exports"
 ARG_cotton_exports_desc: "Argentine lands are quite fit for cotton harvesting. Beginning to plant it would be quite benefitial for us."
 ARG_car_production: "Car Production"
 ARG_car_production_desc: "Many cars are currently produced in Argentina, increasing the amount of factories with capabilities to build vehicles will surely help our economy, and maybe even help for the production of vehicles for the army."
 ARG_foreign_intellectuals: "Foreign Intellectuals"
 ARG_foreign_intellectuals_desc: "Many intellectuals, usually Jews, communists and fascists end up being kicked out from their homelands by the government, but they must not forget that we will be always there to recieve them."
 ARG_embrace_the_isi_model: "Embrace the ISI model"
 ARG_embrace_the_isi_model_desc: "The "Industrialización por sustitución de importaciones", meaning "Industrialization by import substitution", is an economic model adopted in Latin America after the Great War, focused into stopping the import of foreign products, and start the consume of national goods."
 ARG_agro_exporter_once_again: "Agro-exporter Once Again"
 ARG_agro_exporter_once_again_desc: "The ISI model has proved to be an unreachable utopia after its poor performance in most of the Latin American countries. We should take a more liberal approach like before the Great Depression if we want to recover our economy."
 ARG_promote_national_consumer_goods: "Promote National Consumer Goods"
 ARG_promote_national_consumer_goods_desc: "Encouraging our people to buy national goods will help the recovery of our economy, as well as making it way less dependent on foreign products."
 ARG_increase_the_national_industry: "Increase the National Indsutry"
 ARG_increase_the_national_industry_desc: "We must start the expansion of the national industry so we don't depend at all on foreign exports."
 ARG_free_trade_deals: "Free Trade Deals"
 ARG_free_trade_deals_desc: "Enacting free trade deals with other nations will help us reach the recovery of our economy."
 ARG_promote_foreign_investiment: "Promote Foreign Investiment"
 ARG_promote_foreign_investiment_desc: "We will not be able to industrialize Argentina alone, but fortunately there are many nations willing to help us reach this dream."
 ARG_reject_british_monopolies: "Reject British Monopolies"
 ARG_reject_british_monopolies_desc: "Now that our economy is stable again, we will destroy the British monopolies that plague Argentine, even if it angers them!"
 ARG_fmse: "FMSE"
 ARG_fmse_desc: "The Fabricaciones Militares Sociedad Estado (State Society Military Buildings) is an state controlled entity that aim for military self-suficiency."
 ARG_expand_the_ypf: "Expand the YPF"
 ARG_expand_the_ypf_desc: "The Yacimientos Petrolíferos Fiscales (Fiscal Oilfields) is an Argentine company created by general Enrique Mosconi in 1922 during the first government of Hipólito Yrigoyen. It has become an example for other nations like Brazil, Venezuela, Uruguay and Bolivia."
 ARG_argentine_intellectuals: "Argentine Intellectuals"
 ARG_argentine_intellectuals_desc: "Many intellectuals, usually Jews, communists and fascists end up being kicked out from their homelands by the government, but they must not forget that we will be always there to recieve them. However, this doesn't mean there are no Argentines ready to help our investigations."
 ARG_el_ejercito_libertador: "El Ejército Libertador"
 ARG_el_ejercito_libertador_desc: "San Martín and the Argentine army helped liberate many nations in South America, among them Peru, Chile, Uruguay, Paraguay and obviously, Argentina. Our army should be still regarded as an army that fight for liberty in South America. Unless not doing so benefits us more, of course."
 ARG_foreign_weapon_models: "Foreign Weapon Models"
 ARG_foreign_weapon_models_desc: "Our army needs the best guns in order to defend our motherland from our enemies."
 ARG_foreign_artillery_models: "Artillery Research"
 ARG_foreign_artillery_models_desc: "We should improve our support weapons to provoke awe in our among our enemies' armies!"
 ARG_remember_wilhelm_faupel: "Remember Wilhelm Faupel"
 ARG_remember_wilhelm_faupel_desc: "Wilhelm Faupel was the leader of the German military mission in Argentina during the 20's. He helped our army to increase its capabilities and forget the obsolete French doctrines. We should remember his teachings in order to mantain the quality of our military."
 ARG_remember_the_desert_conquest: "Remember the Desert Conquest"
 ARG_remember_the_desert_conquest_desc: "Between 1878 and 1885 there was a war known as the Conquest of the Desert, in which our mighty army conquered the deserts and hills of the Patagonia. We must remember this conflict in order to make our army more prepared for the dire conditions of the region."
 ARG_remember_the_chaco_conquest: "Remember the Chaco Conquest"
 ARG_remember_the_chaco_conquest_desc: "Between 1870 and 1917 there was a war known as the Conquest of the Chaco, in which our mighty army conquered the hot and dry pasturelands of the Chaco. We must remember this conflict in order to make our army more prepared for the dire conditions of the region."
 ARG_remember_the_confederation_war: "Remember the Confederation War"
 ARG_remember_the_confederation_war_desc: "In the War of the Confederation we fought against the Peru-Bolivian Confederation in order to defend our territory from their forces, an even though we succeded, we were not able to recover the city of Tarija. We must learn from that conflict and make our army more prepared to fight in the mountains of Atacama."
 ARG_argentine_armada: "Argentine Armada"
 ARG_argentine_armada_desc: "Our navy has not entered a real conflict since the 19th century, but it doesn't mean we should neglect it."
 ARG_argentine_dockyards: "Argentine Dockyards"
 ARG_argentine_dockyards: "We can't rely on European nations to expand our navy forever. We must begin the construction of our own dockyards."
 ARG_european_dockyards: "European Dockyards"
 ARG_european_dockyards_desc: "Our nation does not have the industry nor the ability to build its own ships. But there are tons of nations in Europe that would be willing to do it for us. However, doing so may be seen as a provocation by our neighbours."
 ARG_destroyer_designs: "Destroyer Designs"
 ARG_destroyer_designs_desc: "We will make our best efforts to design new destroyers able to compete with the technologies of our enemies."
 ARG_cruiser_designs: "Cruiser Designs"
 ARG_cruiser_designs_desc: "We will make our best efforts to design new cruisers able to compete with the technologies of our enemies."
 ARG_battle_ship_designs: "Battleship Designs"
 ARG_battle_ship_designs_decs: "We will make our best efforts to design new battleships able to compete with the technologies of our enemies."
 ARG_submarine_designs: "Submarine Designs"
 ARG_submarine_designs_desc: "We will make our best efforts to design new submarines able to compete with the technologies of our enemies."
 ARG_recover_our_islands: "Recover our Islands"
 ARG_recover_our_islands_desc: "In 1833 the Americans and British attacked the Malvinas, and then the last proceded to annex them under their imperialist government. We never renounced to our rights in the islands, and now it is time to finally take them back!"
 ARG_fortify_tierra_del_fuego: "Fortify Tierra del Fuego"
 ARG_fortify_tierra_del_fuego_desc: "If we want to recover the Malvinas we must protect our military bases in Tierra del Fuego!"
 ARG_argentine_airforce: "The Argentine Airforce"
 ARG_argentine_airforce_desc: "Our airforce, unlike our army or navy, has never participated in any combats or wars. However, that does not mean we should neglect it."
 ARG_focus_on_agility: "Focus on Agility"
 ARG_focus_on_agility_desc: "Our planes should be able to pursue and avoid the enemy planes at will."
 ARG_focus_on_range: "Focus on Range"
 ARG_focus_on_range_desc: "Our planes should be able to cover our vast territories will no problem, they will not be helpful otherwise."
 ARG_focus_on_coverage: "Focus on Coverage"
 ARG_focus_on_coverage_desc: "Our bombers should be able to cover a wide front, otherwise they would not achieve their only task."
 ARG_focus_on_precision: "Focus on Precision"
 ARG_focus_on_precision_desc: "Our bombers should be able to deliver precise and mortal strikes to the enemy troops, even if it means to have a shorter range."
 ARG_learn_from_europe: "Learn from Europe"
 ARG_learn_from_europe_desc: "We should imitate the German and British air doctrines in order to increase the performance of our airforce."
 ARG_increase_argentine_metallurgy: "Argentine Metallurgy"
 ARG_increase_argentine_metallurgy_desc: "Metal extraction is something we need if we want to be able to supply our armies."
 ARG_ask_for_control_of_the_malvinas: "Ask for Control over the Malvinas"
 ARG_ask_for_control_of_the_malvinas_desc: "Now that we have joined their struggle, our people and government thinks the British should be more willing to return control of the Malvinas to us."
 ARG_modernize_the_army: "Modernize the Army"
 ARG_modernize_the_army_desc: "The Germans have proved the world that the new way of waging war is the use of quick motorized divisions, supported by armor. We shall be the first nation is South America to adopt this new doctrine."
 ARG_work_with_what_we_have: "An Offensive Military"
 ARG_work_with_what_we_have_desc: "By the usage of artillery and air support, our army will quickly defeat any enemy nation."
 ARG_defend_the_nation: "Defend the Nation"
 ARG_defend_the_nation_desc: "We control many forests and rivers, as well as deserts and mountains. We should follow a defensive doctrine in order to defend our independence."
 ARG_expand_the_army: "Expand the Army"
 ARG_expand_the_army_desc: "We are one of the nations with the most amount of population in South America. We should take advantage of this virtue."
 ARG_the_new_cavalry: "The New Cavalry"
 ARG_the_new_cavalry_desc: "Cavalry is obsolete. We must move on before it's too late, by researching the production and usage of armored divisions."
 ARG_moder_san_martin_regiment: "Modern San Martín Regiment"
 ARG_moder_san_martin_regiment_desc: "The grenadier cavalry regiment "San Martín" shall be modernized in order to be able to compete in the battlefields of the new decade."
 ARG_trench_warfare: "Trench Building"
 ARG_trench_warfare_desc: "Our army will be trained to quickly build trenches and fortifications in key points along our borders in case of any invasion."
 ARG_deterrence: "Deterrence"
 ARG_deterrence_desc: "Deterring our neighbours by building forts along our border will save countless Argentine lives."
 ARG_sustain_the_army: "Sustain the Army"
 ARG_sustain_the_army_desc: "We must increase our dextery at building infantry weapons so no Argentine soldier goes to battle without one."
 ARG_mass_conscription: "Mass Conscription"
 ARG_mass_conscription_desc: "Mandatory military service among the Argentine youth will help us quickly increase the size of our army."
#Events
 arg.1.desc: "Today presidential elections were held in Argentina. However, due to the "Fraude Patriótico" still controlling Argentina, it is almost certain that they were rigged. Nonetheless, the winner of the election was:"
 arg.1.a: "Roberto María Ortiz, the member of the Concordancia!"
 arg.1.b: "Roberto María Ortiz, candidate of the UCRA!"
 arg.1.c: "Roberto María Ortiz, rival of the UCR!"
 arg.1.d: "Guess who! Roberto Ortiz!"
 arg.2.d: "When he won the elections, Roberto Ortiz had type 2 diabetes. All people thought it wasn't a big deal, but after his wife death and all the stress due to government scandals, his condition has began worsening quickly. An oculist was sent from the USA to help Ortiz, but after a tense medical board, oculist Castroviejo said that there was nothing it could be done to aliviate Roberto Ortiz's situation."
 arg.2.a: "Our president can't die, not now..."
 arg.3.d: "Roberto Ortiz has come back from the USA, and it seems that his situation has improved drastically! Obviously he still has to be careful about his sickness, but now it's more than likely that he will be able to lead argentina once again."
 arg.3.a: "The storm has ended..."
 arg.4.desc: "Now that Castillo's government has been overthrown, it is time to choose the leader of the junta that will now lead Argentina."
 arg.4.a: "Arturo Rawson, the conservative."
 arg.4.b: "Pedro Pablo Ramírez, the nationalist."
 arg.4.c: "Edelmiro Julián Farrell, the veteran."
 arg.4.d: "Juan Domingo Perón, the populist."
 arg.5.d: "It is time to choose the new leader of Argentina! Obviously, people is not ready for this important decision, therefore a council of members of the the Unión Sindical Argentina (Argentine Syndical Union), the Communist Party and the newly formed Partido Justicialista (Justicialist Party). Then, the new leader of Argentina shall be:"
 arg.5.a: "Juan Domingo Perón, the populist."
 arg.5.b: "Antonio Soto, the anarcho-syndicalist."
 arg.5.c: "Fanny Jabcovsky, the marxist."
 arg.6.d: "Today we recieved a delegation of Argentina, now known as Andesia, asking us to unite into a federation against North American imperialism and capitalism in the West. It appears to be they have become crazy, but some of our politicians think that joining them would help our economic increase, even if it angers our people..."
 arg.6.a: "We must unite against the North American menace!"
 arg.6.b: "They have gone bonkers."
 arg.7.d: "The Liga Patriótica Argentina played an important role in Argentina during the 10's and 20's, when they helped the government to suppress the strikers in the Semana Trágica, as well as in the Patagonia Rebelde, where 1500 workers were killed. However, they stopped their activities after the Concordancia came to power in the coup of 1930, until now, where hundred of thoushands of Argentines pledging allegiance to the LPA marched in the streets of Buenos Aires, demanding a solution for the economic problem, with some even demanding the Concordancia to step down, thing that they did after some generals, like Juan Domingo Perón began joining the rioters. Now power of the nation has been transfered to Manuel Carlés, an antisemitic fascist and leader of the LPA. It seems that another dictatorship will lead Argentina from now on."
 arg.7.a: "A new era begins."
 arg.8.d: "Between 1920 and 1922 there were two uprisings led by anarcho-syndicalist workers in the Patagonia, commonly known as Patagonia Rebelde. The objective of these uprisings were to protest against the massive layoffs in the Patagonia after the economic depression that the end of the Great War brought to the world. At first, it was only a general strike, but it quickly turned into a revolt when negotiations broke down and the syndicalists began farm seizings and attacking police officers, as well as the military. The uprising ended up being suppressed by the military with help of the Liga Patriótica Argentina, but the end of anarcho-syndicalism in the Patagonia came in 1930 after dictator Uriburu banned the communist and anarchist press. However, due to the Concordancia not being able to fix the economic problem in Argentina, many anarchist, communist and syndicalist workers have began striking and seizing control over most of the regions of Argentina, failing at doing so in Pampas, Mesopotamia and Entre Ríos. Now it seems that a third Patagonia Rebelde is inevitable, but this time it's more than the Patagonians who are going to revolt."
 arg.8.a: "Workers of Argentina, onwards!"
 arg.9.d: "Representatives from [FROM.GetNameDef] have visited our country and met with many of our politicians in the hopes of garnering endorsements for their investment scheme. The government of [FROM.GetNameDef] would like for us to use our resources to better their own industrial capabilities and output. [FROM.GetAdjective] officials have inferred that by assisting their nation, we might be able to expect aid of our own in the future in the form of a military alliance between our nations."
 arg.9.a: "If it is aid they need, then it is aid they shall have."
 arg.9.b: "We shall not sign their Faustian bargain."
 arg.10.d: "The Argentine government has contacted us, proposing the transfer of the Falklands to them, stating that their armed forces will be able to better protect them from our enemies. How should we respond?"
 arg.10.a: "In case of them being invaded they'll be able to respond quicker than us..."
 arg.10.b: "They can't even protect their stability, how do they plan to protect these islands?"
 arg.11.d: "[FROM.GetLeader] has refused our proposition, stating that the isles will most probably be better protected under their wing."
 arg.11.a: "Goddamn [FROM.GetAdjective]!"
#Decisions
 ARG_pardon_the_generals: "Pardon the Generals"
 ARG_pardon_the_generals_desc: "After our victory in the third Patagonia Rebelde, many of our generals were arrested and sent to jail without a trial. If we want our army to be able to defend our nation from foreign hreats, we should pardon them, obviously only letting the less problematic ones to have an important role in he army."
