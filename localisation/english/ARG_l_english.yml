#Ideas
 YPF: "YPF"
 infamous_decade: "The Infamous Decade"
 infamous_decade_desc: "The Infamous Decade is a term created by periodist José Luis Torres to describe the current period of Argentine politics. Starting in 1930 after the civic-military coup d'etat against the authoritarian regime of president Hipólito Yrigoyen, Argentina has been governed by a military junta, supported by conservatives and socialists against the "Unión Cívica Radical" (Radical Civic Union). Now Argentina is one of the many dictatorships plaguing Latin America, and it doesn't seem like it will change, at least for now."
 infamous_decade_2: "The Infamous Decade"
 infamous_decade_2_desc: "The Infamous Decade is a term created by periodist José Luis Torres to describe the current period of Argentine politics. Starting in 1930 after the civic-military coup d'etat against the authoritarian regime of president Hipólito Yrigoyen, Argentina has been governed by a military junta, supported by conservatives and socialists against the "Unión Cívica Radical" (Radical Civic Union). Now the government is leaning towards democracy, but there's always the fear of another dictatorship."
 roca_runciman_pact: "Roca-Runciman Pact"
 roca_runciman_pact_desc: "Signed in 1933 between Argentina and the United Kingdom, was an economic deal in which Argentina was basically forced to lift all the tariffs to British exports to Argentina, give a "gentle" treatment to British companies, and hand a monopoly over Argentine transports to England. All of this to keep being able to sell meat to the British, and to top, at a way lower price than usual. The treaty is totally humiliating and unpopular among the population, but renouncing to it would mean the collapse of the Argentine meat exports, and therefore, the collapse of our economy. \n§RThis idea will be removed if Argentina is at war with the United Kingdom, or if the United Kingdom is a subject or doesn't exist.§!"
