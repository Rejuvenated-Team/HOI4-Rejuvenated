 YUG_slovene_autonomy_movements_desc: "At the north of our country, lies the Slovene province. After hundreds of years of Austrian rule, have they finally got into our realm. Problem is, a majority of Slovenes want indepedence, or atleast some autonomy, which could weaken the rule of Yugoslavia."
