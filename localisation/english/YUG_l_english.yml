 YUG_croatian_nationalism: "Croatian Nationalism"
 YUG_croatian_nationalism_desc: "Croatians have developed extreme rises of nationalism, since the nation of united Slavs, have actually been priotizing Serbians a lot. It has led to massive hatred, and want for independence. If they aren't to be dealt with, §Rthey could potentionally rise up if we were to get in a war with a fascist nation.§!"
