 YUG_the_three_man_regency: "The Three Man Regency"
 YUG_the_three_man_regency_desc: "When Alexander I was assassinated, the political landscape of Yugoslavia plunged into chaos. And the question of who would rule next, was asked frequently. Because King Peter II, was legally to young to rule, a regency council was established. It now waits for the young Peter to turn 18, so he can rule Yugoslavia."