 #######################################
 ### EVENTS ############################
 #######################################

 SAU.1.d: "Dammam Well No. 7 was started in late 1936 at the suggestion of Max Steineke, as other wells have turned up little oil. While we had our doubts, we've continued the drilling. At long last, we finally struck oil! It's not much, but it's certainly promising. We'll continue the drilling, hopeful that we'll find more!"
 SAU.2.d: "As drilling has continued at Well No. 7, we've finally struck significant commercial quantities! This is a great day for our country, & will certainly lead to a much greater degree of development in the region as the news spreads."
 SAU.3.d: "Production has drastically risen for Well No. 7, which is now pushing out millions of barrels of oil. We expect about 4 million barrels by the end of the year! This has caused a surge in development in the region as a side effect."
 SAU.4.d: "Well No. 7 continues to produce more & more oil as our teams drill further & set up additional rigs."