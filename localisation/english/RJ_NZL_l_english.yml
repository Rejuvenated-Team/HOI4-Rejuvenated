 ##################################################
 ### EVENTS #######################################
 ##################################################
 RJ_NZL.1.d: "The government of New Zealand has approached us with an offer of compensation for New Zealand. They've offered a combination of industrial assets, as well as indefinite naval access within their territory. Our primary use for American Samoa was as a naval base in the furthest reaches of the Pacific. With this deal, we'd have even more access than we had before, at least so long as the New Zealand government remains friendly to us. What shall our response be?"
 RJ_NZL.1.d_a: "The United States government has agreed to give us American Samoa! This is a great day for us, as well as the Samoan peoples!"
 RJ_NZL.1.d_b: "The United States government has denied our offer for American Samoa. While unfortunate, we can also understand & respect their position."
 RJ_NZL.2d: "Now that we're officially a monarchy, we have a minor formality to decide upon: What shall our new identity be? The people are used to calling the country New Zealand, which has been the Anglicized name for the country for a few centuries now. However, the Māori have traditionally called this land Aotearoa, & the king is of Māori descent."