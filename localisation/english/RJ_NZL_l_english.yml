l_english:

 ##################################################
 ### FOCUSES ######################################
 ##################################################

 RJ_NZL_air_force_review: "Air Force Review"
 RJ_NZL_air_force_review_desc: "England has sent us RAF wing commander Ralph Cochrane at our request. He's here to review the state of our air force & to make recommendations on how to best develop our air force going forward."
 RJ_NZL_commonwealth_air_training_plan: "Commonwealth Air Training Plan"
 RJ_NZL_commonwealth_air_training_plan_desc: "By organizing training exercises with our fellow commonwealth members, we can share expertise & learn from one another, greatly improving the effectiveness of our aerial forces."
 RJ_NZL_new_air_bases: "New Air Bases"
 RJ_NZL_new_air_bases_desc: "New air bases are slated for development in an effort to expand our fledgling air force. Whenuapai & Ōhakea are ideal locations for these new bases."
 RJ_NZL_begin_recruiting_efforts: "Begin Recruiting Efforts"
 RJ_NZL_begin_recruiting_efforts_desc: "A current issue we face with this fledgling air force, is getting enough pilots to fly the planes, & experienced officers to organize & teach them. Active recruitment efforts will help to alleviate this issue."
 RJ_NZL_acquire_british_planes: "Acquire British Planes"
 RJ_NZL_acquire_british_planes_desc: "The British have ample planes to spare, & they're more than willing to help us out. We should ask them for some of their old Vickers Vildebeests, which would be prudent for our coastal patrols."
 RJ_NZL_training_school_expansions: "Training School Expansions"
 RJ_NZL_training_school_expansions_desc: "Now that we have new recruits, we need to expand our training schools to accomodate them all."
 RJ_NZL_air_base_expansions: "Air Base Expansions"
 RJ_NZL_air_base_expansions_desc: "Our current air bases are still small & inadequate in the case of war. We ought to expand our current bases to better ready ourselves."
 RJ_NZL_womens_auxiliary_air_force: "Women's Auxiliary Air Force"
 RJ_NZL_womens_auxiliary_air_force_desc: "Developing our own Women's Auxiliary Air Force will allow our men to focus more on ground combat roles, while we train women to help out in the air."
 RJ_NZL_new_zealand_bomber_command: "New Zealand Bomber Command"
 RJ_NZL_new_zealand_bomber_command_desc: "Setting up a proper Bomber Command will increase the effectiveness of our operations."
 RJ_NZL_devonport_naval_base_improvements: "Devonport Naval Base Improvements"
 RJ_NZL_devonport_naval_base_improvements_desc: "The naval base at Devonport will need some improvements to help accomodate new ships going forward, such as the extension of Calliope Dock."
 RJ_NZL_the_naval_defense_amendment_act: "The Naval Defense Amendment Act"
 RJ_NZL_the_naval_defense_amendment_act_desc: "The Naval Defense Amendment Act is a replacement for our previous Naval Defense Act of 1913. It will set up a naval board to manage our forces, as well as our expansion efforts."
 RJ_NZL_royal_new_zealand_navy: "Royal New Zealand Navy"
 RJ_NZL_royal_new_zealand_navy_desc: "Our navy should be formalized into the Royal New Zealand Navy, in homage & respect to the British Royal Navy that gave us our start. This will mark a new era for our navy!"
 RJ_NZL_stanley_bay_reclamation_project: "Stanley Bay Reclamation Project"
 RJ_NZL_stanley_bay_reclamation_project_desc: "The Stanley Bay reclamation project has been ongoing for some years now. With some of the newly available shoreline, we can expand the project into new shipbuilding facilities & oil storage."
 RJ_NZL_kauri_point_naval_depot: "Kauri Point Naval Depot"
 RJ_NZL_kauri_point_naval_depot_desc: "Establishing a new naval depot at Kauri Point will help us greatly in the event of war, allowing for increased production & quicker distribution of war-time naval supplies."
 RJ_NZL_cruiser_specialty: "Cruiser Specialty"
 RJ_NZL_cruiser_specialty_desc: "Most types of ships are impractical for us to build. Cruisers can handle a large variety of roles & make the best use of our resources."
 RJ_NZL_minesweepers_of_the_pacific: "Minesweepers of the Pacific"
 RJ_NZL_minesweepers_of_the_pacific_desc: "A key duty we can attend to in our reaches of the world is minesweeping. It might not seem as impressive as taking part in large battles, hunting enemy fleets down. But it's important work nonetheless, & we're good at it."
 RJ_NZL_study_british_radar: "Study British Radar"
 RJ_NZL_study_british_radar_desc: "The British have done a remarkable job in the relatively new field of Radar technology. It would be most beneficial to us to send a team to study this technology!"
 RJ_NZL_expand_electrification: "Expand Electrification"
 RJ_NZL_expand_electrification_desc: "Our country has a great deal of hydroelectric & has embraced electrification. It's time we further our efforts into further projects, such as the completion of the Roaring Meg station, & furthering electrical infrastructure in our land."
 RJ_NZL_emergency_mining_regulations: "Emergency Mining Regulations"
 RJ_NZL_emergency_mining_regulations_desc: "With the outbreak of war, our mining industry has become even more vital. These regulations will set up a mining controller to guide the industry & help it further develop."
 RJ_NZL_south_island_roadways: "South Island Roadways"
 RJ_NZL_south_island_roadways_desc: "Let's work on the development of the roadways of South Island."
 RJ_NZL_north_island_roadways: "North Island Roadways"
 RJ_NZL_north_island_roadways_desc: "Let's work on the development of the roadways of North Island."
 RJ_NZL_fisher_and_paykel_manufacturing: "Fisher & Paykel Manufacturing"
 RJ_NZL_fisher_and_paykel_manufacturing_desc: "Fisher & Paykel is one of our very own domestic brands. Up until now, they've largely imported their wares for sale here. Now they're looking at setting up some proper domestic production!"
 RJ_NZL_samoan_economic_development: "Samoan Economic Development"
 RJ_NZL_samoan_economic_development_desc: "Since the western parts of Samoa have come under our jurisdiction, their problems have become our problems. While it feels a bit obligatory to help them out, it would likely go a long ways towards resolving issues between us & strengthening both of our economies."
 RJ_NZL_revitalize_the_rubber_plantations: "Revitalize the Rubber Plantations"
 RJ_NZL_revitalize_the_rubber_plantations_desc: "The Germans had started rubber plantations in western Samoa, which have since largely been abandoned due to poor economic value. Some new investments should help to revitalize the old plantations, & kick up production levels."
 RJ_NZL_develop_apia: "Develop Apia"
 RJ_NZL_develop_apia_desc: "Samoa's capital of Apia would benefit greatly from some industrial support on our part."
 RJ_NZL_expand_the_reparation_estates: "Expand the Reparation Estates"
 RJ_NZL_expand_the_reparation_estates_desc: "In the aftermath of the Great War & the ensuing treaties, many German plantations were handed over to our government. Cocoa, bananas, & coconuts primarily. These have proven to be highly beneficial to the Samoan economy, as well as our own. Expanding these estates is a natural progression that can surely be beneficial for us all."
 RJ_NZL_purchase_american_samoa: "Purchase American Samoa"
 RJ_NZL_purchase_american_samoa_desc: "The eastern portion of Samoa was given over to the United States via the Tripartite Convention of 1899, but it's only been of serious interest as a naval base far beyond normal American reach. If we offer them financial compensation & naval access to our territory, they may be willing to give it over to us."
 RJ_NZL_invest_in_the_fishing_industry: "Invest in the Fishing Industry"
 RJ_NZL_invest_in_the_fishing_industry_desc: "Fishing is one of the key industries in Samoa, & will greatly benefit the population if we invest in expanding it."
 RJ_NZL_new_medical_complexes: "New Medical Complexes"
 RJ_NZL_new_medical_complexes_desc: "We have the means to set up new medical facilities that will greatly benefit the Samoan people."
 RJ_NZL_defense_council: "Defense Council"
 RJ_NZL_defense_council_desc: "Our military philosophy is that the defense of our islands is the best option for us, especially given our naturally small size & limited population. Setting up a Defense Council will allow us to better coordinate defensive strategies, & potentially fend off any invaders."
 RJ_NZL_army_board: "Army Board"
 RJ_NZL_army_board_desc: "Implementing an Army Board will allow us to better coordinate planning & conscription efforts."
 RJ_NZL_improve_the_army_schools: "Improve the Army Schools"
 RJ_NZL_improve_the_army_schools_desc: "There's always room for improvement in the military. Improving our army's schools will provide better troops & officers, giving us an advantage over any would-be enemies."
 RJ_NZL_equipment_modernization: "Equipment Modernization"
 RJ_NZL_equipment_modernization_desc: "Given our location & length of time since the Great War, we haven't had much interest in updating our equipment. As such, it's become a bit dated compared to other countries, & needs to be improved."
 RJ_NZL_wartime_industry: "Wartime Industry"
 RJ_NZL_wartime_industry_desc: "War has finally come to our home, & we must strengthen our weak military industry to help us deal with the situation."
 RJ_NZL_the_biggest_bob: "The Biggest Bob"
 RJ_NZL_the_biggest_bob_desc: "New Zealand has finally achieved the ultimate greatness. It's glory is beyond comparison, & it's might shall make us feared amongst men! BEHOLD: The Biggest Bob... May our enemies tremble in fear at the pinnacle of New Zealand innovation!"
 RJ_NZL_seek_out_labour_sympathizers: "Seek Out Labour Sympathizers"
 RJ_NZL_seek_out_labour_sympathizers_desc: "The most recent directive from the Comintern has been to follow the 'Popular Front' method, attempting to make nice with the democratic parties. Labour has been unfortunately stubborn & blocked us out so far, but perhaps if we can find even a few sympathizers amongst their ranks, we can make some progress."
 RJ_NZL_ratana_alliance: "The Ratana Alliance"
 RJ_NZL_ratana_alliance_desc: "The Ratana movement has been backing Labour for several years now, in the hopes of greater support for the Māori people. It's time we formalize an alliance, & bring some native Māori political figures on-board with us!"
 RJ_NZL_maori_housing_amendment_act: "Māori Housing Amendment Act"
 RJ_NZL_maori_housing_amendment_act_desc: "This amendment to the previously passed Māori Housing Act expands our ability to build & finance homes for our Māori citizenry."
 RJ_NZL_reign_of_koroki: "Reign of Koroki"
 RJ_NZL_reign_of_koroki_desc: "The Māori haven't traditionally had a kingship for very long, & it's only recently been acknowledged by our own government. With our support, it's also captured the hearts of the people, Māori & non-Māori alike. With how popular the movement has become, & to help right some past wrongs, king Koroki has been requested to lead the people!"
 RJ_NZL_icaa_act: "ICAA Act"
 RJ_NZL_icaa_act_desc: "The Industrial Conciliation & Arbitration Amendment Act returns a great deal of industrial oversight power to an Arbitration Court, which is prepared to set new standards such as a 40 hour work week, minimum wage, & compulsory union membership. This should help to alleviate some of our present economic strain."
 RJ_NZL_agricultural_workers_act: "Agricultural Workers Act"
 RJ_NZL_agricultural_workers_act_desc: "The Agricultural Workers Act is designed to improve working conditions & pay for our farmers, giving them the means to expand & improve their farms."
 RJ_NZL_abrogate_the_treaty_of_waitangi: "Abrogate the Treaty of Waitangi"
 RJ_NZL_abrogate_the_treaty_of_waitangi_desc: "The Treaty of Waitangi was signed by Māori chiefs in 1840, ceding control & authority over the land to the crown of England. Given our status as a fully sovereign nation now, we feel it's within our rights, as well as our obligation, to abrogate this treaty & begin working to restore sovereignty to the Māori people."
 RJ_NZL_establish_rent_controls: "Establish Rent Controls"
 RJ_NZL_establish_rent_controls_desc: "Rent has gotten out of control in recent years, which has hurt many people that are struggling to make ends meet. While it's not ideal, establishing some temporary rent controls can help to alleviate the situation."
 RJ_NZL_improve_industrial_efficiency: "Improve Industrial Efficiency"
 RJ_NZL_improve_industrial_efficiency_desc: "There's a variety of measures we can take, such as the Industrial Efficiency Act, that will help to improve our industrial capabilities across the board."
 RJ_NZL_emergency_regulations: "Emergency Regulations"
 RJ_NZL_emergency_regulations_desc: "With the current state of the world, we have to take action & enact some emergency regulations to ensure stability in our society!"
 RJ_NZL_emergency_conscription: "Emergency Conscription"
 RJ_NZL_emergency_conscription_desc: "We have no time to lose! We must begin rapid conscription expansion as soon as possible to ready ourselves for potential threats!"
 RJ_NZL_support_the_kingitanga_movement: "Support the Kīngitanga Movement"
 RJ_NZL_support_the_kingitanga_movement_desc: "The Kīngitanga movement has been advocating for acknowledgement of the Māori kingship for quite a few years now, though it's not been particularly popular outside of Māori circles. If we throw the government's support behind it, it might start to catch on."
 RJ_NZL_a_king_for_all: "A King for All"
 RJ_NZL_a_king_for_all_desc: "There are concerns amongst some of the population about whether or not Koroki will govern fairly, given his Māori heritage, expecting the possibility of retribution for past sleights against his people. Koroki wishes to make it known that this will never be the case, & that he will treat all people under his rule equally."
 RJ_NZL_a_matter_of_formality: "A Matter of Formality"
 RJ_NZL_a_matter_of_formality_desc: "With a formal monarchy now in place, some minor formalities must be decided upon, such as our country's name & flag. Shall we maintain our current name & flag, or shall we change them to suit our change in identity?"
 RJ_NZL_samoan_citizenship: "Samoan Citizenship"
 RJ_NZL_samoan_citizenship_desc: "Koroki has extended his hand in friendship to the people of Samoa, offering them full citizenship & equal rights under his leadership."
 RJ_NZL_strike_restrictions: "Strike Restrictions"
 RJ_NZL_strike_restrictions_desc: "Given the current threat, we can't afford the potential of strikes disrupting the war effort!"
 RJ_NZL_war_pension_extension: "War Pension Extension"
 RJ_NZL_war_pension_extension_desc: "Our troops who bravely risk their lives for their country ought to be taken care of properly. We can extend their pensions to do just that! With a little luck, it might also help to encourage others to enlist."
 RJ_NZL_department_of_maori_welfare: "Department of Māori Welfare"
 RJ_NZL_department_of_maori_welfare_desc: "A department of Māori welfare will allow us to help rectify some of the problems the native Māori population faces, including more direct funding in regions that would benefit them."
 RJ_NZL_develop_taranaki_and_hawkes_bay: "Develop Taranaki & Hawke's Bay"
 RJ_NZL_develop_taranaki_and_hawkes_bay_desc: "Much of the land in Taranaki & Hawke's Bay has strong ties to the Māori people, & are ideal for development that will help the local populations. This could also help to draw in some new population as new jobs come to these regions."
 RJ_NZL_increase_central_bank_control: "Increase Central Bank Control"
 RJ_NZL_increase_central_bank_control_desc: "The banks are an important institution & thusly need appropriate oversight. The king has been advised to take authority over the central bank, ensuring that it remains free of corruption & can be appropriately used to finance our various goals."
 RJ_NZL_proud_maori_traditions: "Proud Māori Traditions"
 RJ_NZL_proud_maori_traditions_desc: "The Māori have many proud traditions that extend back for centuries. They've been capable warriors, oceanic navigators, & more. We should honor & reaffirm many such traditions, though some are best left in the past."
 RJ_NZL_masters_of_the_sea: "Masters of the Sea"
 RJ_NZL_masters_of_the_sea_desc: "Our people have a history on the seas, having mastered travel across the ocean in their efforts to seek out these lands to inhabit, perhaps better than any others in history. That history & expertise will serve us quite well!"
 RJ_NZL_hands_across_the_pacific: "Hands Across the Pacific"
 RJ_NZL_hands_across_the_pacific_desc: "The peoples of the pacific share a common heritage with us. This is a strong basis to pursue relationships with them, & position ourselves to become masters of the pacific."
 RJ_NZL_put_out_the_call: "Put Out the Call"
 RJ_NZL_put_out_the_call_desc: "If we put out a rallying call, there will be many people across the pacific that will join our cause."
 RJ_NZL_foment_anti_colonial_sentiments: "Foment Anti-Colonial Sentiments"
 RJ_NZL_foment_anti_colonial_sentiments_desc: "It should be easy enough to stir up anti-colonial sentiments in the peoples across the pacific. This will make it more difficult for those powers to maintain their control, making them more likely to accede control to us."
 RJ_NZL_experts_in_terrain: "Experts in Terrain"
 RJ_NZL_experts_in_terrain_desc: "The natural terrain of [NZL.GetNameDef] is quite diverse with many harsh elements, & our people know it better than any other. This expertise can be instilled in our armed forces, allowing them to handle any terrain with ease."



