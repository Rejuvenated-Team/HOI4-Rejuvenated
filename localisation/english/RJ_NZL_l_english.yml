 NZL_great_depression_2: "The Great Depression"
 NZL_great_depression_2_desc: "The collapse of the global economy in 1929 hit New Zealand's largely agricultural economy very hard. With countries purchasing less produce from New Zealand, many found themselves unemployed, reducing consumer purchasing power and in turn causing other industries to collapse. Years of austerity has left the nation yearning for a change in direction."
