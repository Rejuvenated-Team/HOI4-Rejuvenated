 RJ_FRA_the_french_economy: "The French Economy"
 RJ_FRA_the_french_economy_desc: "The French economy has been impacted like everyone else by the Grande Dépression. It will take time & a lot of hard work to get it back into shape again, with our industries kicking at full strength."