#Events
 malta.1.title: "The Language Question"
 malta.1.desc: "For such a seemingly simple matter, the question of which language or languages should be used officially in Malta has caused a lot of political strain & divides. Many view it as picking a side. Those who prefer English tend to believe we should maintain our current ties with the crown of England. Some prefer Italian, wishing us to have closer cultural ties to Italy. Others yet emphasize Maltese & a need for independence! What option shall we go with?"
 malta.1.a: "English, for the crown!"
 malta.1.b: "Italian is the way!"
 malta.1.c: "We should be proud of the Maltese language!"
 malta.1.d: "Perhaps a compromise of Maltese & English?"
