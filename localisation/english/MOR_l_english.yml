	#### NATIONAL FOCUSES ####
 
 MOR_sultan_diplomacy: "Sultan Diplomacy"
 MOR_sultan_diplomacy_desc: "In these trouble times, the government need to affirm this authority. The Sultan will lead the kingdom and try to appease both of the nationalists and the french general resident. But a clear choice must be made for the future of Morocco."
 MOR_nationalist_movement_pressure: "Nationalist Movements Pressure"
 MOR_nationalist_movement_pressure_desc: "We gave a lot to France but receive such little in return. We should approch the different nationalist groups to secure our position and start to think about our freedom."
 MOR_french_resident_governance: "French Resident Governance"
 MOR_french_resident_governance_desc: "After the Rift War, we have see what France can do to supress revolt. It's in your interest to gain your independance in a peaceful way, by cooperating with the resident-general."
 MOR_moroccan_action_committee: "Moroccan Action Committee"
 MOR_moroccan_action_committee_desc: "The badly divided nationalist movement starts to become more cohesive. The movement informs Moroccans dared to consider the real possibility of political change in the post-Great War."
 MOR_moroccans_advisors: "Moroccans Advisors"
 MOR_moroccans_advisors_desc: "The first step to regain our independance is to retake control of your own institutions. By allowing moroccan advisors, the sultan will consolidate this influence on the country governance."
 MOR_moroccans_advisors_tooltip: "§YUnlock moroccan political advisors.§!\n"
