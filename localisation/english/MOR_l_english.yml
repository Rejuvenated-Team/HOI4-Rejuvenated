morocco.100.t: "Morocco breaks free"
morocco.100.d: "A general revolt have occured in Morocco. Independantists lead the Sultan himself by have made a coup and take control of the french government of Rabat."
morocco.100.a: "We can do anything to stop them."
morocco.100.b: "Crush this revolt quickly!"
morocco.101.t: "The Green March"
morocco.101.d: ""
morocco.101.a: "We can do anything to stop them."
morocco.101.b: "Crush this protest march quickly!"

rj_MOR_GATHERING_STORM_DESC: "Although being under protectorate, Morocco remained a sovereign state but in reality is under France rules. As opposition to french control rises, nationalism starts growing.\n\nWith no army, weak economy and poor infrastructures, Morocco will need to choose a path to gain this independance in these trouble times."
MOROCCO_BLITZKRIEG_DESC: "Although being under protectorate, Morocco remained a sovereign state but in reality is under France rules. As opposition to french control rises, nationalism starts growing.\n\nWith no army, weak economy and poor infrastructures, Morocco will need to choose a path to gain this independance in these trouble times."
