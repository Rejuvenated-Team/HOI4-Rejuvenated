l_english:
 #JAPAN
 the_fading_sun: "The Fading Sun"
 the_fading_sun_desc: "The IJA has evacuated Manchuria and Korea after Chinese forces pushed us out of the region. The rising sun is fading..."

 the_fading_sun_alliance: "The Fading Sun"
 the_fading_sun_alliance_desc: "The IJA has evacuated Manchuria and Korea after Chinese forces pushed us out of the region. Japan is no longer absolutely isolated, but the shame of defeat still weighs heavily on the nation."

 #MANCHUKUO
 MAN_rising_anti_japanese_sentiments: "Rising Anti-Japanese Sentiments"
 MAN_rising_anti_japanese_sentiments_desc: "Years of occupation, humiliation, and broken promises have left Manchuria restless. Anti-Japanese feeling now spreads through barracks, villages, and city streets alike."

 MAN_manchurian_guerrillas: "Manchurian Guerrillas"
 MAN_manchurian_guerrillas_desc: "Partisan bands across Manchuria know the terrain, the railways, and the weaknesses of foreign garrisons. Their war is irregular, but their cause is clear."

 MAN_white_russian_advisers_cotf: "$MAN_white_russian_advisers$"
