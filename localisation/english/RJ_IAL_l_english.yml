#Events
  IAL.1.t: "Libyan People Successfully Remove Balbo's Modernisation"
  IAL.1.d: "The recent question to the economic actions done by Balbo has answered. On one hand, the Fascists wanted to continue the modernisation done by Balbo, as they say that its a great benefit to the Libyan economy and faling behind our enemies isnt an option, while the Libyan locals have successfully protested against the government to change the economic focus on more agricultural improvements. This is a heroic act done by the locals after the Italians brutally oppressed and silenced us, we wont let it happen again."
  IAL.1.w: "We dont need Balbo"
