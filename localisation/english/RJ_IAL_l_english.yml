#Characters
  IAL_Italo_Balbo: "Italo Balbo"
#Ideas
  ial_modernisation_campaigns: "Modernisation Campaigns"
  ial_modernisation_campaigns_desc: "Italo Balbo has entacted a modernisation campaign in Libya since 1934, which is working great but the cost is too high. We need to fully comply with this to achieve the best reward, or stop it now to halt our nation going to ruins."
  ial_modernisation_campaignsfocus1: "Modernisation Campaigns"
  ial_modernisation_campaignsfocus1_desc: "Italo Balbo has entacted a modernisation campaign in Libya since 1934, which is working great but the cost is too high. We need to fully comply with this to achieve the best reward, or stop it now to halt our nation going to ruins."
  ial_modernisation_campaignsfocus2: "Modernisation Campaigns"
  ial_modernisation_campaignsfocus2_desc: "Italo Balbo has entacted a modernisation campaign in Libya since 1934, which is working great but the cost is too high. We need to fully comply with this to achieve the best reward, or stop it now to halt our nation going to ruins."
  ial_italian_exploitation_and_looting: "Italian Exploitation and Looting"
  ial_italian_exploitation_and_looting_desc: "Since the Italian conquest of Libya in 1911, they have exploited our land for their own benefit and now take our men to fight in Ethiopia. The Italians are dependent on us, and they know it."
  ial_king_of_the_desert: "King of the Desert"
  ial_king_of_the_desert_desc: "Our soldiers are one of the best in the harsh deserts of Libya, with their great cavalry and guns. We must use this as an advantage against foreign invading armies who want to remove the nation we work hard for."
#Focuses
  IAL_continue_balbos_modernisation_plan: "Continue Balbo's Modernisation Plan"
  IAL_continue_balbos_modernisation_plan_desc: "Balbo's modernisation plan is going great, why would we stop just because of some dirty peasants protesting."
  IAL_ministry_of_infrastructure: "Ministry of Infrastructure"
  IAL_ministry_of_infrastructure_desc: "The roads must be ready for the huge amount of construction materials we will transport across the country for the modernisation of Libya, we must evade bottlenecks and continue building our great nation."
  IAL_ministry_of_civilian_industry: "Ministry of Civilain Industry"
  IAL_ministry_of_civilian_industry_desc: "The civilian industry is important for our growth, the Ministry of Civilian Industry will accomplish great achievements in our industrialisation and defeat our enemies in the economical front."
  IAL_ministry_of_military_industry: "Ministry of Military Industry"
  IAL_ministry_of_military_industry_desc: "Finally, our modernisation is seeming to be effective, we need the Ministry of Military Industry to lead our war production to eliminate the enemies of Libya."
  IAL_power_of_science: "Power of Science"
  IAL_power_of_science_desc: "Science is an important tool we can use to grow our nation and defend ourselves from incoming enemies. We must utilise the power of science."
  IAL_inspiration_from_italy: "Inspiration from Italy"
  IAL_inspiration_from_italy_desc: "Italy is a great nation, we must take inspiration from Italy to build a country as great as they are."
  IAL_a_city_like_rome: "A City Like Rome"
  IAL_a_city_like_rome_desc: "Tripoli will undertake huge amount of construction to make a city like Rome. We will do this to improve our economy and make Tripoli a city that people will want to visit."
  IAL_enslave_the_locals: "Enslave the Locals"
  IAL_enslave_the_locals_desc: "The locals are of no good use if we let them roam freely. We shall take away their rights for the future of Libya and its people."
  IAL_twelve_hour_workdays: "Twelve Hour Workdays"
  IAL_twelve_hour_workdays_desc: "Twelve hour workdays are necessary if we want to be a major power, once we improve our situation we can relax."
  IAL_encourage_brutality: "Encourage Brutality"
  IAL_encourage_brutality_desc: "Why have rules if you dont enforce them. The country of Libya is tired of people revolting just because we do something they dont like, if they give us a chance then they will see what we were up to."

  IAL_challenge_balbos_modernisation: "Challenge Balbo's Economic Plans"
  IAL_challenge_balbos_modernisation_desc: "Balbo's modernisation only benefits Italy, we must think about the hard working Libyans who build their factories, and give a better life to the average Libyan."
