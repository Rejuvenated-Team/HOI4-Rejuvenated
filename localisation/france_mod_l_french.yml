l_french:

	############################
			#### NATIONAL FOCUSES ####
	############################
	
	#### INDUSTRIAL SECTION ####
 
 FRA_tools_modernisation:0 "Modernisation Industrielle"
 FRA_tools_modernisation_desc:0 "Le parc industriel français est dépassé et surtout vieux. Nous devons moderniser nos outils en acquérant de nouvelles machines modernes."
 FRA_decrease_unemployement:0 "Réduire le chômage"
 FRA_decrease_unemployement_desc:0 "Avec la dernière crise économique, le taux de chômage est encore élevé et la production faible. Nous pouvons commencer par encourager les industriels à investir et à créer de nouveaux emplois."
 FRA_overseas_factories:0 "Usines d'Outremers"
 FRA_overseas_factories_desc:0 "L'Algérie française est considérée comme faisant partie de la France, donc nous devons renforcer les infrastructures de production dans ces départements d'outre-mer."
 FRA_cnrs:0 "Centre National de la Recherche Scientifique"
 FRA_cnrs_desc:0 "Pour coordonner l'activité de nos laboratoires de recherche actuels, nous devons fusionner tous les organismes à un centre national, afin de renforcer la capacité de recherche."
 FRA_buy_heavy_water:0 "Acheter l'Eau Lourde"
 FRA_buy_heavy_water_desc:0 "L'Europe est instable et les premiers essais en sciences nucléaires ont montré des résultats prometteurs. Nous devrions, acheté les stocks d'eau lourde de la Norvège, aller de l'avant et assurer nos recherches."
 FRA_research_grants:0 "Subventionner la Recherche"
 FRA_research_grants_desc:0 "Pour galvaniser notre production de recherche nationale, nous pourrions donner des subventions de mérite à nos meilleures équipes de scientifiques. Les progrès de la technologie peuvent nous donner des avantages où nous en avons le plus besoin."
 FRA_sncf:0 "Société Nationale des Chemins de Fer Français"
 FRA_sncf_desc:0 "La nationalisation des principales compagnies ferroviaires françaises assurera le contrôle des moyens de transport."
 FRA_sncf_tooltip:0 "Ajoute le maximum d'§YInfrastructure§! en §YIle de France§!, §YPas de Calais§!, §YChampagne§! et §YAlsace§!"
 
	#### COLONIAL FOCUS ####
	
 FRA_colonial_investments:0 "Investissements Coloniaux"
 FRA_colonial_investments_desc:0 "L'Europe fait face à des temps dangereux. Nous devrions nous concentrer sur l'amélioration de nos terres au sud et dans les colonies pour nous assurer que nous pouvons toujours soutenir le continent"
 FRA_colonial_investments_tooltip:0 "Toutes les colonies françaises gagnent §YInvestissements Coloniaux§! et §Y-50§! de niveau d'autonomie."
 FRA_continue_mandat:0 "Continuer le Mandat du Moyen-Orient"
 FRA_continue_mandat_desc:0 "Nous ne pouvons appliquer réellement les accors Vienot pour l'instant, car le monde devient plus menaçant chaque jour. Nous devrions faire des concessions pour encourager les syriens et les libanais à nous aider."
 FRA_develop_morocco:0 "Développer le Maroc"
 FRA_develop_morocco_desc:0 "Notre protectorat du Maroc a besoin de plus de fonds pour renforcer la production locale et développer une économie efficace."
 FRA_develop_tunisia:0 "Développer la Tunisie"
 FRA_develop_tunisia_desc:0 "Le protectorat tunisien présente de nombreuses possibilités, nous devrions investir dans le développement des infrastructures actuelles."
 FRA_develop_algeria:0 "Développer l'Algerie"
 FRA_develop_algeria_desc:0 "Nous devrions concentrer notre industrie à Alger. Si les tensions augmentent en Europe, nous aurons encore une capacité industrielle hors de portée des bombardiers ennemis."
 FRA_develop_indochine:0 "Développer l'Indochine"
 FRA_develop_indochine_desc:0 "Si nous voulons utiliser notre colonie Indochine comme base principale dans la région du Pacifique, nous devons créer d'abord une infrastructure plus élaborée pour déployer nos troupes et augmenter la capacité de nos ports."
 FRA_technology_sharing:0 "Partage de Technologies"
 FRA_technology_sharing_desc:0 "Pour rester dans le domaine des technologies, la bonne solution serait de partager nos recherches avec nos colonies et nos alliés"
 FRA_technology_sharing_tooltip:0 "Toutes les colonies françaises gagnent §G5%§! d'échange technologique bonus de §YRecherche française§!."
 FRA_sahara_oil:0 "Pétrole du Sahara"
 FRA_sahara_oil_desc:0 "Le pétrole est la seule ressource que la France n'a pas. Nous pourrions prospecter le désert du Sahara pour trouver cet or noir."
 FRA_tungsten_mines:0 "Mines de Tungstène"
 FRA_tungsten_mines_desc:0 "Pour alimenter notre machine de guerre, nous avons besoin de plus de tungstène. Les mines indochinoises pourraient fournir plus si nous les développions"
 FRA_vienot_agreement_:0 "Accords Vienot"
 FRA_vienot_agreement__desc:0 "Le mandat français de la Syrie et du Liban ne pouvait pas durer éternellement, mais le Sénat a hésité à donner l'indépendance.  However, as nationalism in Middle-East is growing, your relations become difficult. We should release them as we still have a good relationship."
 FRA_rewrite_protectorate_treaties:0 "Renégocier les Traités des Protectorats"
 FRA_rewrite_protectorate_treaties_desc:0 "Les traités que la France a imposé au Maroc et à la Tunisie sont inégales et ne représente pas les valeurs de la République. Il est temps de mettre fin à l'ancienne aire impériale française."
 FRA_rewrite_protectorate_treaties_tooltip:0 "§YMorocco§! and §YTunisia§! will become §YAssociated State§!. They can also take political focus without conditions and lock them to pro-France diplomacy."
 FRA_autonomy_indochina:0 "Autonomie pour l'Indochine"
 FRA_autonomy_indochina_desc:0 "Les pays de l'Indochine sont la perle de l'Empire colonial français, mais rien n'a été fait au niveau politique depuis la colonisation. Nous devons y remédier."
 FRA_autonomy_indochina_tooltip:0 "§YVietnam§!, §YCambodge§! and §YLaos§! deviennent des §YEtats associés§!. Ils peuvent aussi prendre des priorités politiques sans restrictions et sont bloqués dans une diplomacie pro-France."
 FRA_self_government_for_the_colonies:0 "Gouvernement Autonome Coloniaux"
 FRA_self_government_for_the_colonies_desc:0 "Nous devons accorder plus d'autonomie à nos provinces d'outremer qui ne sont pas étroitement liées à la France. Un gouvernement local sera plus efficace pour les administer loin du contienent."
 FRA_consolidate_african_federations:0 "Consolider les Fédérations Africaines"
 FRA_consolidate_african_federations_desc:0 "L'Afrique est large et ethniquement diversiviée, et nos colonies ici ne sont pas préparées à s'autogérer. Nous devons construire de nouveaux états à partir de rien, based sur les federations des pays coloniaux."
 FRA_gueye_lamine_law:0 "Loi Guèye Lamine"
 FRA_gueye_lamine_law_desc:0 "Chaque individu de l'Empire français doit être egal en droit, comme la Constitution le garantit. Même si les colons n'approuve pas cela."
 FRA_create_french_union:0 "Créer l'Union Française"
 FRA_create_french_union_desc:0 "Avec toutes ces réformes, l'empire colonial français comme il existait précedemment est maintenent dépassé. Un nouveau système liera ensemble la france et chaque citoyens des collectivités."
 FRA_overseas_departements:0 "Départements d'Outremer"
 FRA_overseas_departements_desc:0 "Nous devons considérer de mieux administrer les départements d'outremer, même si cela signifie dépenser beaucoup de resources pour consolider l'administration de l'état."
 
	#### REARMEMENT FOCUS ####
 
 FRA_rearmament:0 "Réarmement"
 FRA_rearmament_desc:0 "L'Allemagne est de plus en plus menaçante chaque jour. Nous ne pouvons pas rester pacifistes et nous devons réarmer notre pays."
 FRA_military_complex_nationalisation:0 "Nationalisation des complexes militaires"
 FRA_military_complex_nationalisation_desc:0 "Notre capacité de fabrication est encore limitée. Nous pouvons forcer la nationalisation de certaines manufactures à atteindre une véritable efficacité de production."
 FRA_defense_national_funds:0 "Fonds de défense nationale"
 FRA_defense_national_funds_desc:0 "Nous ne pourrions pas atteindre nos objectifs de production avec les moyens actuels. Nous devons augmenter la part de budget attribuée au réarmement."
 FRA_defense_national_funds_tooltip:0 "§YSupport industriel§! §Rcessera lorsque le pays sera en guerre§!."
 FRA_war_material_licence:0 "Licence de Fabrication de Materiels de Guerre"
 FRA_war_material_licence_desc:0 "Pour stimuler le développement des industries militaires et sécuriser nos apports en équipements militaires, nous pouvons accorder des licences d'exploitation pour controler la production."
 FRA_aircraft_manufacturer_nationalisation:0 "Nationalisation des constructeurs d'aéronotiques"
 FRA_aircraft_manufacturer_nationalisation_desc:0 "Alors que les négociations pour l'achat d'avions américains stagnent, nous devrions nationaliser les constructeurs d'aéronotiques pour corriger les déficits de productivité français dans ce secteur."
 FRA_partial_mobilization:0 "Mobilisation Partielle"
 FRA_partial_mobilization_desc:0 "Les Allemands sont agressifs et le monde est instable. La guerre est proche et nous devrions déclarer la mobilisation partielle."
 FRA_commit_automobile_manufacturer:0 "Engager des Constructeurs Automobiles"
 FRA_commit_automobile_manufacturer_desc:0 "Les constructeurs automobiles sont aussi les principaux producteurs d'engins militaires de haut niveau tel que les tanks ou les pièces détaché de motorisés. L'Etat a besoin de la coopération des industrielles pour remplir son armée de blindés."
 FRA_wartime_organisation_act:0 "Loi sur l'Organisation de la Nation en Guerre"
 FRA_wartime_organisation_act_desc:0 "Avant la guerre, nous devons définir l'organisation de la nation en temps de guerre."
 FRA_war_effort_law:0 "Loi sur l'Effort de Guerre"
 FRA_war_effort_law_desc:0 "Pour contribuer à l'effort de guerre, chaque Français doit payer des impots additionnels et peuvent aussi acheter des bons du Trésor."

	#### DEMOCRATIC FOCUS ####
	
 FRA_social_reforms:0 "Réformes Sociales"
 FRA_social_reforms_desc:0 "Les accords de Matignon sont un succès partiel, mais avec le contexte économique, ils peuvent être perdus à tout moment. Nous devons aller plus loin dans nos réformes sociales et sécuriser nos avantages."
 FRA_support_blum:0 "Soutenir Blum"
 FRA_support_blum_desc:0 "Les réformes de Blum ne sont pas aussi efficaces que la pensée française, mais il est dans la bonne direction. Nous devrions lui donner plus de pouvoir pour réformer la société."
 FRA_support_blum_tooltip:0 "§YRetarde l'effondrement du Front Populaire.\n§!"
 FRA_intervention:0 "Intervention française"
 FRA_intervention_desc:0 "La démocratie a besoin de notre aide! Quiconque est prêt à se battre pour la cause doit être autorisé à y aller, nous ne pouvons permettre à un autre régime fasciste de gagner du terrain."
 FRA_intervention_tooltip:0 "§RLes Britanniques refuseront peut-être une alliance.\n§!"
 FRA_support_daladier:0 "Soutenir Daladier"
 FRA_support_daladier_desc:0 "Blum nous a montré qu'il ne peut pas diriger un pays en situation de crise. Il doit démissionner et laisser le bureau à Edouard Daladier, chef du Parti Radical et numéro deux du Front Populaire."
 FRA_status_quo:0 "Status Quo"
 FRA_status_quo_desc:0 "La France est le berceau et le protecteur de la liberté et devrait le rester. Si nous voulons restés unis, alors nous devons stabiliser notre démocratie avant qu'elle ne diminue."
 FRA_little_entente:0 "Petite Entente"
 FRA_little_entente_desc:0 "La Petite Entente, une alliance formée après la Grande Guerre pour empêcher l'agression de l'Autriche et de la Hongrie envers leurs voisins, a été soutenue par la France, mais a maintenant commencé à tomber en morceaux. Pour restaurer et consolider cette faction nous devons commencer par ses fondateurs en Tchécoslovaquie."
 FRA_go_with_britain:0 "Aller avec les Britanniques"
 FRA_go_with_britain_desc:0 "Avec la Russie à jamais changée, seule la France et la Grande-Bretagne restent de la Triple Entente. Si l'histoire est vouée à se répéter, nous devons nous assurer que ces deux nations, bastions de la démocratie et de la liberté en Europe restent Alliés."
 FRA_popular_front_united:0 "Front Populaire Uni"
 FRA_popular_front_united_desc:0 "Avec les réformes faites, nous devons cesser de nous battre entre nous et rester unis. Le Front ne s'effondrera pas et nous nous battrons pour la France ainsi que la Liberté, l'Egalité et la Fraternité!"
 FRA_popular_front_united_tooltip1:0 "§RLe Front Populaire s'effondrera en août 1938 si non-uni.§!"
 FRA_popular_front_united_tooltip2:0 "§RLe Front Populaire s'effondrera en juin 1939 si non-uni.§!"
 FRA_invite_yugoslavia:0 "Inviter la Yougoslavie"
 FRA_invite_yugoslavia_desc:0 "La Yougoslavie a assez de soucis sans avoir à s'inquiéter des voisins expansionnistes. Les inviter dans la Petite Entente serait un grand service pour eux et pour nous-mêmes."
 FRA_invite_romania:0 "Inviter la Roumanie"
 FRA_invite_romania_desc:0 "La démocratie roumaine est fragile, prise entre ses factions fascistes internes et le communisme soviétique, les introduire dans la Petite Entente leur permettra de conserver leur stabilité avec notre soutien."
 FRA_invite_poland:0 "Inviter la Pologne"
 FRA_invite_poland_desc:0 "L'Allemagne revendique le culoir de Danzig ainsi que ses anciens territoires de l'Est. Inviter la Pologne dans la Petite Entente permettrai d'assurer leur sécurité."
 FRA_research_treaty:0 "Traité de recherche"
 FRA_research_treaty_desc:0 "En partageant les avancées technologiques avec nos alliés, notre faction entière sera capable de conduire la R&D en temps de guerre plus efficacement."
 FRA_invite_benelux:0 "Accord militaire franco-belge"
 FRA_invite_benelux_desc:0 "La Belgique et le Luxembourg sont une cible facile pour les Allemands. Pour éviter de contourner la ligne Maginot, nous devons être sûrs que les militaires coopèrent avec nous."
 FRA_economic_cooperation_agreement:0 "Accord de Coopération Economique"
 FRA_economic_cooperation_agreement_desc:0 "Pour assurer une parfaite coopération militaire, nous devons définir quelques accords économiques et logistiques."
 FRA_preventive_intervention:0 "Intervention préventive"
 FRA_preventive_intervention_desc:0 "Les Allemands ne nous ont laissé aucun autre choix: pour le bien du monde libre et de l'avenir de nos enfants, il est temps de leur déclarer la guerre."
 
	#### COMMUNIST FOCUS ####
 
 FRA_radicalize_front:0 "Radicaliser la Gauche"
 FRA_radicalize_front_desc:0 "Les réformes du Front Populaire ne sont pas assez drastiques pour redresser la situation actuelle. Nous devons radicaliser notre politique et permettre plus de communistes au gouvernement."
 FRA_law_against_combat_group_milice:0 "Loi contre les groupes de combat"
 FRA_law_against_combat_group_milice_desc:0 "Les ligues d'extrême droite ont été laissées sans surveillance, ce qui leur a permis d'atteindre un haut degré d'organisation. Si elles sont encore trop fragiles pour tenter un coup d'État, rien ne dit qu'elles ne l'oseront pas d'ici peu. Mieux vaut donc les dissoudre dès à présent."
 FRA_grands_travaux:0 "Grands Travaux"
 FRA_grands_travaux_desc:0 "Une série de programmes de contruction sociale sera mise en place en parallèle avec la socialisation du pays. Cela diminura le chomage et créera plus de structures publiques."
 FRA_ideological_indoctrination:0 "Endoctrinement Idéologique"
 FRA_ideological_indoctrination_desc:0 "Nos valeurs et objectifs politiques méritent bien que l'on meure pour eux, comme on mourait jadis au nom de la religion. Tout partisan doit être prêt à faire face à la mort – et plus encore les dissidents."
 FRA_intervention_committee:0 "Commité d'Intervention"
 FRA_intervention_committee_desc:0 "Nous devons changer nos politiques étrangères d'intervention et soutenir les organisations de gauche dans les autres pays, pour stopper la montée du fascisme."
 FRA_organise_international:0 "Organiser la 4ème Internationale"
 FRA_organise_international_desc:0 "Nous devrions aider les Trotskistes à établir leur organisation internationale socialiste révolutionnaire, dans le but d'aider la classe ouvrière à renverser le capitalisme et à développer le communisme à l'international."
 FRA_commune_proclamation:0 "Proclamation de la Commune"
 FRA_commune_proclamation_desc:0 "Nous avons securiser assez de support pour organiser un coup d'Etat. Il est temps de prendre le pouvoir et de perpétuer l'héritage de la Commune!"
 FRA_scientific_convention:0  "Convention de Paris"
 FRA_scientific_convention_desc:0  "Les soviétiques nous ont proposés d'étendre notre coopération scientifique. Nous devrions signer une convention entre nos deux pays pour stimuler la recherche et l'innovation technologique."
 FRA_research_cooperation:0 "Coopération Scientifique"
 FRA_research_cooperation_desc:0 "Les soviétiques sont des personnes intelligentes et pleines de ressources, mais ils manquent d'infrastructures scientifiques. Nous devront travailler avec eux, echangeant nos connaissances pour un bénéfice commun."
 FRA_assistance_treaty:0 "Traité Franco-Soviétique d'Assistance Mutuelle"
 FRA_assistance_treaty_desc:0 "Un traité bilateral entre nos deux pays communistes réduira toute menace provenant d'Europe central. Plus précisement, ce pact d'assistance mutuel nous protegera du danger d'une aggression de la part de l'Allemagne."
 FRA_fascist_threat:0 "La Menace Fasciste"
 FRA_fascist_threat_desc:0 "Au lieu d'arrêter l'Allemagne, le traité de Versailles et les sanctions économiques qui l'accompagnaient lui ont fourni un terreau fertile et n'ont fait que renforcer ses terribles ambitions. Nous devons à nouveau vaincre l'Allemagne et la placer sous notre contrôle, du moins pour le moment."
 FRA_collectivisation:0 "Collectivisation"
 FRA_collectivisation_desc:0 "Une campagne de collectivisation des industries privées et des matières premières nous aidera à mieux superviser la gestion de l'état et à stabiliser le pays."
 FRA_humanite_unie:0 "Humanité Unie"
 FRA_humanite_unie_desc:0 "Les gros banquiers et les démagogues puissants de la puissance renforcent leur prise sanglante sur le monde. Chaque jour qui passe, nous voyons des hommes libres réduits en esclavage et le monde plongé dans la crise créée par la cupidité de l'individu. L'humanité a besoin de nous et nous devons unir l'humanité!"
 FRA_strike_empire:0 "Frapper l'Empire"
 FRA_strike_empire_desc:0 "Les empires capitalistes bâtis par les superpuissances européennes sont les pires ennemis de la liberté dans le monde. Ceux-ci doivent être démantelés et leurs populations libérées, à commencer par l'Empire britannique."
 
	#### FASCIST FOCUS ####
 
 FRA_far_right_leagues:0 "Ligues d'Extrême Droite"
 FRA_far_right_leagues_desc:0 "Les ligues d'extrême-droite sont plusieurs mouvements d'extrême-droite français opposés au parlementarisme, qui se sont surtout consacrés aux défilés militaires, aux bagarres de rue, aux manifestations et aux émeutes... Pour unir la France, Pour éviter de succomber à la pourriture."
 FRA_front_liberte:0 "Front de la Liberté"
 FRA_front_liberte_desc:0 "Pour nous opposer au Front Populaire, nous devons former une alliance anti-Marxiste avec les autres mouvements d'extrême-droite. Ce Front de la Liberté fédérera tous ceux protestant contre le collectivisme."
 FRA_support_ppf:0 "Parti Populaire Français"
 FRA_support_ppf_desc:0 "Le Parti Populaire Français dénonce le parlementarisme, cherche à limiter la démocratie et remodeler la société française selon sa propre vison autoritaire. Il est totalement opposé au marxisme et au libéralisme. Avec le succès du Front de la Liberté, le Parti Populaire Français, guidant le mouvement, devrait entrer au gouvernement."
 FRA_charlemagne_division:0 "Division Charlemagne "
 FRA_charlemagne_division_desc:0 "Le Komintern est de plus en plus puissant. Le moment est venu de montrer que nos intérêts en soutenant les organisations fascistes."
 FRA_demand_wallonia:0 "Réclamer la Wallonie"
 FRA_demand_wallonia_desc:0 "La région Wallonne en Belgique est principalement occupée par des francophones. Ils ne se sentent pas français, mais nous pourrions utiliser l'argument linguistique pour prendre le contrôle de cette province."
 FRA_revise_versailles:0 "Réviser Versailles"
 FRA_revise_versailles_desc:0 "Le Reich Allemand est en train de devenir une force à prendre en considération: leur vision d'un avenir meilleur peut être alignée sur nos intérêts."
 FRA_split_switzerland:0 "Diviser la Suisse"
 FRA_split_switzerland_desc:0 "Les politiques neutres et le fonctionnement démocratique de la Suisse sont une insulte à notre gouvernement. Nous pourrions faire un accord secret avec Hitler et Mussolini pour diviser ce comté en trois."
 FRA_strike_urss:0 "Frapper l'Union Soviétique"
 FRA_strike_urss_desc:0 "Malgré nos objections, la menace soviétique s'amplifie. Pour contrer l'agressivité de l'Union soviétique et garantir notre avenir, nous allons devoir lui déclarer la guerre."
 FRA_cagoule_coup:0 "Coup d'Etat de la Cagoule"
 FRA_cagoule_coup_desc:0 "La Cagoule est un groupe d'inspiration fasciste et anticommuniste qui utilise la violence pour promouvoir ses activités. Ce mouvement clandestin est en contact avec certains hauts-gradés de l'armée et est financé par des industriels. Nous avons entendu qu'un coup pourrait avoir lieu, des officiers militaires soutenant leurs idéaux antiparlementaires."
 FRA_state_reorganisation:0 "Réorganisation de la nation"
 FRA_state_reorganisation_desc:0 "Nous devons repenser le role de l'Etat au sein de la France. Nous devons abandonné toutes ces idées parlementaires et créer un fort parti unique."
 FRA_claim_rhinland:0 "Réclamer la Rhénanie"
 FRA_claim_rhinland_desc:0 "La menace allemande augmente d'année en année, nous devons créer un état tampon dans la partie gauche du Rhin."
 FRA_woo_italy:0 "Courtiser l'Italie"
 FRA_woo_italy_desc:0 "L'Italie a le potentiel pour devenir une nation puissante, grâce à la forte direction de Mussolini, les Italiens sont unis et prêts à lutter pour la bonne cause."
 FRA_dismantle_germany:0 "Démanteler l'Allemagne"
 FRA_dismantle_germany_desc:0 "Les allemands ne nous laisse aucun autre choix. Dans l'intêret de la France et pour le futur de nos enfants, il est l'heure d'entrée en guerre."
 FRA_convince_spain:0 "Convaincre l'Espagne"
 FRA_convince_spain_desc:0 "Franco et les nationalistes espagnols sont nos alliés naturels, unis par la religion, la culture et l'idéologie. Ensemble, nous protegerons les latins de la menace allemande."
 FRA_plan_xiv:0 "Plan XIV"
 FRA_plan_xiv_desc:0 "Nous avons déjà sécuriser le nord. Seul la Suisse reste comme alternative pour nous atteindre. Nous ne pouvons tolérer cela."
 FRA_nothern_italy_claim:0 "Héritage de l'Empire"
 FRA_nothern_italy_claim_desc:0 "L'Italie n'est pas un vrai état. Il revient à la France, et nous devons encore la conquerir, comme Napoléon avait fait."
 FRA_secure_catalonia:0 "Je Suis Le Déluge"
 FRA_secure_catalonia_desc:0 "La Catalogne était française durant le premier Empire et sous Charlemagne. Pour honorer notre héritage, soumettre l'Espagne est la seule solution. Mais la Perfide Albion ne le permettera pas si facilement. La frapper en premier pour assurer l'hégémonie française en Europe."
 
	#### MONARCHY FOCUS ####
 
 FRA_repel_law_exile:0 "Abroger la Loi de l'Exile"
 FRA_repel_law_exile_desc:0 "Tous les nobles et lignées royales ont été bannis de France par la 3ème République. Les symboles et mythes que les monarques représentent renforcerpeuvent être utiliser pour renforcer la société française."	
 FRA_action_francaise:0 "Action Française"
 FRA_action_francaise_desc:0 "L'Action Française soutient un retour à la monarchie et, après la loi sur la séparation de l'Eglise et de l'Etat, la restoration du catholicisme comme religion d'état. C'est aussi un point de ralliement des opposant à la Troisième République de France, considérée comme corrompu et innéficace."
 FRA_action_francaise_tooltip:0 "§YJean d'Orleans sera choisi comme Roi.\n§!"
 FRA_counter_revolution:0 "Contre-Revolution"
 FRA_counter_revolution_desc:0 "Les monarchies d'Europe sont en voie d'extinction. Si nous faisons revivre notre idéologie dans les pays voisins, cela nous aidera à réaliser notre notre propre agenda."
 FRA_legitimist_movement:0 "Mouvement Légitimiste"
 FRA_legitimist_movement_desc:0 "Seul le vrai successeur de la dynastie des Bourbons peut reigner. Alphonse XIII, l'ancien roi d'Espagne est le bon candidat pour la Restoration."
 FRA_legitimist_movement_tooltip:0 "§YAlphonse XIII sera choisi comme Roi.\n§!"
 FRA_unite_crowns:0 "Unifier les Couronnes"
 FRA_unite_crowns_desc:0 "La France and l'Espagne sont maintenant dirigée par le même monarque. Une union personnelle scellera les liens entre les deux pays." 
 FRA_restoration:0 "Restoration"
 FRA_restoration_desc:0 "Il est temps de mettre fin à la République et redonner à la France son suzerain légitime, le roi Jean d'Orléans. La nouvelle monarchie unifira le peuple derrière un dirigeant fort."
 FRA_union_latins:0 "Union latine"
 FRA_union_latins_desc:0 "Une alliance entre les peuples de civilisation et de culture latine commune en Europe (Italie, France, Espagne, Portugal et Roumanie) devrait équilibrer les forces entre nous et l'Allemagne. Nous devrions commencer avec la Roumanie, stabilisant leur position avec notre appui."
 FRA_invite_portugal:0 "Inviter le Portugal"
 FRA_invite_portugal_desc:0 "Le Portugal est un pays latin et donc un allié naturel du peuple français. Nous devons renforcer nos liens d'amitié avec ce pays."
 FRA_retake_haiti:0 "Reprendre Haïti"
 FRA_retake_haiti_desc:0 "Haïti a été perdu lors d'une révolte d'esclaves après la Révolution. Si nous voulons renforcer notre position dans les Caraïbes et retrouver notre prestige, nous devons la reprendre par n'importe quels moyens."
 FRA_recover_quebec:0 "Reprendre le Québec"
 FRA_recover_quebec_desc:0 "Le Québec nous a été volé par les anglais et est encore habité de français. Il doit retourner à son propriétaire légitime."
 FRA_claim_louisiana:0 "Revendiquer la Lousiane"
 FRA_claim_louisiana_desc:0 "Les Etats-Unis ne laisseront jamais notre influence s'étendre davantage en Amériques. Les écraser le plus vite possible est la meilleur solution."
 FRA_usa_deal:0 "Marché avec les Etats-Unis"
 FRA_usa_deal_desc:0 "Les Etats-Unis sont à la fois de vieux alliés et un solide appui en Amériques. En promesse de futurs terres canadiennes, nous pourrions conclure une alliance."
 
	#### MILITARY FOCUS ####
	
 FRA_giraud_plan:0 "Plan de Giraud"
 FRA_giraud_plan_desc:0 "Dans des moments comme ceux-ci, il est préférable de renforcer nos défenses. S'il ya des menaces, laissez-les venir à nous afin que nous puissions les traiter sur notre propre terre. Nous avons besoin de votre parole."
 FRA_fortification_focus:0 "Priorité aux fortification"
 FRA_fortification_focus_desc:0 "Aussi critiques que nos forts ont été, nous devons trouver des moyens de les construire plus efficacement. La ligne Maginot a été un puissant dissuasif des forces ennemies, nous pourrions utiliser plus de moyens de sécurité comme elle."
 FRA_alpine_forts:0 "Forts Alpins"
 FRA_alpine_forts_desc:0 "Les Italiens ne franchiront pas la frontière si facilement une fois que nous aurons fini de couvrir les Alpes avec notre ligne de défense nouvellement planifiée. Nous aurons le temps de réagir et de renforcer notre position."
 FRA_commission_fortified_regions:0 "Mission CORF"
 FRA_commission_fortified_regions_desc:0 "Nous pouvons recréer l'ancienne Commission d'Organisation des Régions Fortifiées de 1927 pour étudier nos fortifications actuelles et mettre à jour nos plans de défense."
 FRA_extend_the_maginot_line:0 "Étendre la ligne Maginot"
 FRA_extend_the_maginot_line_desc:0 "Nous ne pouvons pas compter sur la Belgique pour tenir leur terrain, s'ils laissent entrer les armées ennemies, nous pourrions être en difficulté." La prolongation de la Ligne Maginot est cruciale pour empêcher les armées indésirables hors de France!"
 FRA_de_gaulle_strategy:0 "Stratégie de De Gaulle"
 FRA_de_gaulle_strategy_desc:0 "Nous ne pouvons pas rester assis en silence lorsque nos ennemis se déplacent à nos frontières, et nous ne pouvons laisser nos alliés se débrouiller seuls dans un scénario de guerre... Préparez notre armée! "Gamelin est l'homme du métier."
 FRA_motorized_focus:0 "Motorisation de l'Armée"
 FRA_motorized_focus_desc:0 "Trouver de meilleures façons de construire nos véhicules d'infanterie aidera notre capacité à soutenir et à renforcer les lignes de front."
 FRA_mechanized_focus:0 "Division Cuirassée"
 FRA_mechanized_focus_desc:0 "Les chars de combat sont la voie à suivre dans l'industrie militaire. Nous voulons contrôler le champ de bataille et pour cela nous aurons besoin de nouveaux tanks puissants!"
 FRA_tank_modernisation:0 "Modernisation des doctrines"
 FRA_tank_modernisation_desc:0 "Les véhicules blindés jouent un rôle de plus en plus important dans la guerre. Ils sont légèrement moins intimidants que leur char moyen, mais ils nous donnent un avantage dans la communication, le commandement, le transport et la guerre urbaine."
 FRA_further_armament_program:0 "Programme d'Armement Complémentaire"
 FRA_further_armament_program_desc:0 "Avec le budget étendu de l'armée, nous pouvons produire des armes en masse. Nous mettrons un fusil entre les mains de tous."
 FRA_infantry_focus:0 "Levée en masse"
 FRA_infantry_focus_desc:0 "Tous les hommes et toutes les femmes qui peuvent se battre le feront. Nous devrions mettre les ressources du gouvernement dans la production et l'amélioration des armes d'infanterie."
 FRA_artillery_focus:0 "Grande Batterie"
 FRA_artillery_focus_desc:0 "Notre artillerie formera une seule unité puissante pour focaliser le feu sur des points précis: une volée à la fois et nous affaiblirons la ligne ennemie et nous frapperons si nous devons!"
 FRA_army_reform:0 "Réforme de l'Armée de Terre"
 FRA_army_reform_desc:0 ""Aucune unité d'infanterie ou réservoir de haute technologie à elle seule ne nous fera gagner la guerre. Nous devons mettre nos efforts dans le développement de nos capacités tactiques et stratégiques avec les bonnes personnes sur le terrain, nous pouvons évoluer en tant qu'armée."
 FRA_general_mobilisation_order:0 "Ordre de Mobilisation Général"
 FRA_general_mobilisation_order_desc:0 "Nous devons mettre l'armée de terre, l'armée de l'air et la marine françaises sur le pied de guerre, et appeller sous les drapeaux tous les Français mobilisables."
 FRA_africa_army:0 "Armée d'Afrique"
 FRA_africa_army_desc:0 "La connaissance de l'armée Africaine assurera la domination dans les colonies et l'Afrique du Nord. Nous pouvons compter sur des volontaires arabes ou berbères indigènes et des régiments de colons français."
 FRA_colonial_troops:0 "Troupes Coloniales"
 FRA_colonial_troops_desc:0 "Les troupes coloniales ne font pas partie de l'armée Africaine et regroupent les troupes indigènes d'Afrique occidentale et centrale et outre-mer. Nous pouvons utiliser leur équipement pour figurer dans des terres peu propices."
 FRA_foreign_legion:0 "Légion Etrangère"
 FRA_foreign_legion_desc:0 "La Légion étrangère est la branche d'élite de l'Armée Africaine, composée de soldats de nationalités et de milieux différents. L'expérience des légionnaires et la qualité de leur formation seront notre fer de lance."
 FRA_commandos_marine:0 "Commandos Marine"
 FRA_commandos_marine_desc:0 "Les Commandos Marine sont les Forces d'Opérations Spéciales de la Marine Française. Leur aide dans la guerre amphibie et la reconnaissance navale permettront de vaincre rapidement les ennemis de la France."
 FRA_blum_viollette_project:0 "Proposition Blum-Viollette"
 FRA_blum_viollette_project_desc:0 "La proposition de Blum-Viollette a suggéré qu'une minorité d'Algériens obtiennent la pleine citoyenneté française, avec le plan d'élargir les avantages à d'autres groupes à une date ultérieure. Nous pouvons utiliser cet argument pour recruter dans la colonie, mais les colons protestent massivement."
 FRA_abolish_indigenat_statut:0 "Abolir le Statut de l'Indigène"
 FRA_abolish_indigenat_statut_desc:0 "Chaque individu sur le territoire français doit être égaux en droits, peut importe ces origines. Nous devons donner la citoyenneté complète à tous les algériens, même si cela nous fait entrer en conflit avec les colons français."
	
	#### NAVAL SECTION ####
 
 FRA_naval_contruction_program:0 "Programme de Construction Naval"
 FRA_naval_contruction_program_tt:0 "Pas assez d'emplacements pour des §YBases Naval§!"
 FRA_naval_contruction_program_desc:0 "Si nous prévoyons d'étendre notre marine, la première étape est d'améliorer et d'étendre nos bases navales. Nos navires uniques exigent une attention constante pour rester paré au combat en tout temps."
 FRA_altlantic_domination:0 "Domination de l'Atlantique"
 FRA_altlantic_domination_desc:0 "Améliorer la conception de nos cuirassés donnerait de grands avantages tactiques dans l'océan Atlantique. Avec leur portée et leur puissance incontestée, personne ne pourra dépasser ses canons."
 FRA_pacific_protection:0 "Protection du Pacifique"
 FRA_pacific_protection_desc:0 "Les théoriciens de la marine ont attiré notre attention sur nos portes-avions dépassés. Ils ont des suggestions sur la façon dont les portes-avions peuvent être davantage utilisés si le développement est poussé dans la bonne direction. Cela nous assurera le contrôle du Pacifique et nous permettra de protéger nos colonies."
 FRA_darlan_doctrine:0 "Doctrine de Darlan"
 FRA_darlan_doctrine_desc:0 "Les progrès récents dans les conceptions de navires ont ouvert de nouvelles options dans les manœuvres tactiques et stratégiques. L'amiral Darlan a suggeré de nouvelles théories, nous devons les préparer correctement et tester les plans plus élaborés."
 FRA_mediterranean_special_measures:0 "Dispositif Spécial en Méditerranée"
 FRA_mediterranean_special_measures_desc:0 "Les italians renforcent leur flotte et veulent étendre leur domination en mer Méditerranée. Si nous perdons notre ligne de défense en mer, nous risquons tous les navires et les hommes. Nous devons nous assurer que nos navires sont construits avec la technologie la plus récente."
 FRA_standardisation_engine:0 "Standardisation des moteurs"
 FRA_standardisation_engine_desc:0 "Notre parc de sous-marins et de bombardiers est vieux et un changement s'impose. Cependant, il y a trop de variants dans les pièces principales pour espérer une production à la chaine. Nous devons standardiser la production en premier lieu."
 FRA_antille_bridgehead:0 "Tête-de-pont des Antilles"
 FRA_antille_bridgehead_desc:0 "Les Antilles sont notre tête-de-pont pour se battre en Amériques. Nous devons les défendre, peut importe le prix."
 FRA_polynesie_defense:0 "Defense de la Polynesie"
 FRA_polynesie_defense_desc:0 "Le japon se faisant de plus en plus dangereux, il pourrait devenir une menace dans l'océan Pacifique. Nous ne leur abandonnerons pas nos colonies."
 
	#### AIR SECTION ####
 
 FRA_air_bases:0 "Etendre nos nouvelles bases aérienne"
 FRA_air_bases_bypass_tt:0 "Pas assez d'emplacements pour des §YBases aériennes§!"
 FRA_air_bases_desc:0 "Le temps est venu de développer nos forces aériennes! Des projets ont déjà été faits pour commencer la construction de nouvelles bases aériennes afin de soutenir une forte augmentation du personnel et des avions."
 FRA_modernisation_program:0 "Programme de Modernisation"
 FRA_modernisation_program_desc:0 "Certains engins civils révolutionnaires peuvent être appliqués à nos combattants pour améliorer leur vitesse, leur portée et leur altitude maximale. Nous devons nous concentrer sur ce point si nous voulons suivre les progrès des autres."
 FRA_buy_americain:0 "Acheter des bombardiers américains"
 FRA_buy_americain_desc:0 "Le soutien aérien est un élément important pour nos capacités défensives et offensives. Cependant, nos modèles actuels de bombardiers sont trop vieux mais en achetant les derniers modèles américains, nous pourront rester dans la course."
  FRA_buy_americain_tooltip:0 "Nous recevrons 200 bombardiers tactiques des Etats-Unis."
 FRA_barrage_david:0 "Barrage David"
 FRA_barrage_david_desc:0 "Inspiré par les découvertes britaniques, notre nouveau modèle de radar bistatique a été développé par l'armée de l'air pour détecter les appéreils ennemis."
 FRA_jet_effort:0 "Dévéloppement des Moteurs à Réaction"
 FRA_jet_effort_desc:0 "Le combat aérien est tout au sujet de la mobilité. Le moteur à réaction est une avancée si puissante que les pilotes ennemis semblent rester immobiles pendant que nous les arrachons du ciel."
 FRA_interwar_experience:0 "Experience de l'Entre-Deux-Guerres"
 FRA_interwar_experience_desc:0 "Les avions qui fournissent un soutien à nos forces terrestres et navales ont été un ajout très efficace durant la révolte d'entre-guerre d'Anti-Atlas. Ces avions ont maintenant plusieurs suggestions d'améliorations et nous devrions les ajouter à nos manoeuvres."
 FRA_reorganize_air_army:0 "Réorganiser l'Armée de l'Air"
 FRA_reorganize_air_army_desc:0 "Nous avons acquis assez d'expérience pour tester de nouvelles théories de la guerre aérienne à un rythme plus rapide, mais avec notre structure de commandement actuel l'amrée de l'air est inneficace. Nous devons tout d'abord procédé à une réorganisation."
 FRA_parachute_battalions:0 "G.I.A 601-602"
 FRA_parachute_battalions_desc:0 "Les soviétiques ont créé un nouveau type de détachement aéroporté pour larguer du matériel et des soldats. Nous devrions nous en inspirer et créer un groupe similaire."

	#### FLAGS ####
 front_explosed:0 "Front Populaire dissous"
 matignon_agreements:0 "Accords Matignon"
 
 	############################
					#### EVENTS ####
	############################
	
 france.100.t:0 "Le Front Populaire remporte les élections"
 france.100.d:0 "Le Front populaire est le vainqueur des élections législatives et obtient la majorité du Parlement. L'alliance des mouvements de gauche, dont le Parti Communiste Français (PCF), la Section Française de l'Internationale Ouvrière (SFIO) et le Parti Radical et Socialiste annonce la formation d'un gouvernement dirigé par Léon Blum, leader de la SFIO. Les Français espèrent que le gouvernement de Blum implantera des réformes sociales pour mettre fin à la crise politique actuelle."
 france.100.a:0 "Avec le Front Populaire, tout est possible!"
 france.33.t:0 "Le pacte Hoare-Laval"
 france.33.d:0 "La presse a dévoilé le pacte Hoare-Laval à l'œil du public, qui se déroule derrière leur dos. La France et la Grande-Bretagne, désireuses de rester en bons termes avec l'Italie, ont négocié un accord avec Mussolini pour une conclusion rapide de la Deuxième Guerre Italo-Abyssinienne avec des concessions éthiopiennes. C'est dans l'espoir de maintenir l'indépendance de la nation, mais il a été fait sans leur consentement. Cela a provoqué un tumulte de droite et de gauche, le dénonçant comme un apaisement à Mussolini qui voudrait faire de l'Ethiopie un peu plus qu'un état fantoche. Albert Sarraut présidera jusqu'aux élections."
 france.33.a:0 "Pierre Laval doit démissionner."
 france.102.t:0 "Leon Blum démissionne"
 france.102.d:0 "Avec l'inflation qui a également augmenté de 46%, l'imposition de la semaine de 40 heures se révéla très inefficace, l'industrie a des difficultés à s'y adapter. La confusion économique a entravé l'effort de réarmement, et la croissance rapide des armements allemands a obligé Blum à abandonner les programmes de réforme sociale du Front Populaire. Léon Blum démissionne, le Parlement refusant de lui donner les moyens de résoudre la crise économique."
 france.102.a:0 "Edouard Daladier ainsi que radicaux formeront un nouveau gouvernement"
 france.103.t:0 "Inflation!"
 france.103.d:0 "En 1936, la France se relève lentement de la crise économique qui a frappé le pays en 1931. La situation politique instable, le chômage élevé et le déficit public sont déjà des défis pour le gouvernement. Malheureusement, la déflation rapide a entraîné une surestimation du franc. Elle provoque une crise économique et les deux tiers des exportations s'effondrent. Avec l'évasion générale du capital et la résistance de certains employeurs, la situation est alarmante et la désillusion de la classe ouvrière pour la politique est déjà énorme."
 france.103.a:0 "Nous devons réformer l'économie rapidement"
 FRA_inflation_tooltip:0 "§YDébloque des décisions pour réformer l'économie.\n§!"
 france.104.t:0 "Les accords de Matignon"
 france.104.d:0 "Après l'élection du Front Populaire, une grève massive de la classe ouvrière éclate, initiée au Havre, accompagnée d'occupations d'usine pour empêcher les fermetures, et s'est rapidement propagée à travers la France. Le mouvement social a immédiatement suivi la victoire électorale du Front populaire, pour parvenir à cette position de force. Le nouveau gouvernement de gauche dirigé par Léon Blum négocie avec succès des accords sociaux, signés à la Hôtel Matignon. Tous les travailleurs ont bénéficié de ces accords, qui sont le droit légal de grève, les congés payés, 40 heures de travail par semaine payées 48 et la suppression de tous les obstacles à l'organisation syndicale."
 france.104.a:0 "Faisons ces réformes sociales attendus."
 france.104.b:0 "Nous ne pouvons pas réaliser toutes nos promesses."
 france.105.t:0 "Les communistes retirent leur soutien"
 france.105.d:0 "Mécontent de la politique récente du gouvernement de gauche, Maurice Thorez, chef du Parti Communiste Français, annonce que les communistes quittent le Front populaire et manifesteront leur mécontentement."
 france.105.a:0 "Nous n'avons pas besoin de leur aide pour diriger la nation"	
 france.106.t:0 "Les communistes soutiennent le gouvernement"
 france.106.d:0 "Contrairement aux autres nations, la France accepte d'aider les républicains dans la guerre civile espagnole. Le cabinet de Blum décide d'une politique d'intervention et officialise un accord pour l'envoi de munitions et de soldats volontaires en Espagne. Maurice Thorez, leader du Parti Communiste Français, annonce que les communistes soutiendront la politique de Blum et la force du front actuel."
 france.106.a:0 "Les socialistes et les communistes vont se tenir ensemble!"	
 france.107.t:0 "Le Front Populaire s'effondre"
 france.107.d:0 "Après deux années d'activité majeure, le Front populaire perd son esprit et ne peut que temporiser à mesure que la crise européenne s'aggrave. Compensée par une hausse de 46% des prix, le chômage est resté élevé et la production industrielle globale a stagné. Le Front populaire s'est dissout à l'automne 1938, confronté à des tensions internes liées à la guerre civile espagnole, à l'opposition de droite et à la persistance des effets de la Grande Dépression."
 france.107.a:0 "Camille Chautemps dirigera le nouveau gouvernement"	
 france.108.t:0 "Inviter la Belgique et le Luxembourg"
 france.108.d:0 "Pour contenir la possible résurgence d'un expansionnisme agressif sur une partie des anciennes puissances centrales, la France a demandé que la Belgique et le Luxembourg rejoignent les Alliés pour arrêter les ambitions hitlériennes."
 france.108.a:0 "Nous devons protéger le Benelux."
 france.108.b:0 "Nous ne voulons pas nous fâcher Hitler."
 france.109.t:0 "La Grande-Bretagne accepte l'Alliance"
 france.109.d:0 "La Grande-Bretagne approuve nos efforts et a accepté l'invitation de la Belgique et du Luxembourg dans l'alliance."
 france.109.a:0 "Heureusement, nous pouvons encore nous protéger de l'Allemagne."
 france.110.t:0 "La Grande-Bretagne refuse l'Alliance"
 france.110.d:0 "Malgré tous nos efforts pour offrir un soutien aux Alliés, notre plus récente tentative de rejoindre une des nations a été accueillie avec scepticisme. La Grande-Bretagne a refusé d'accepter la Belgique et le Luxembourg dans l'alliance."
 france.110.a:0 "Ils seront une cible facile pour Hitler!"
 france.111.t:0 "Coup de la Cagoule"
 france.111.d:0 "La Cagoule, officiellement appelée Comité Secret de l'Action Révolutionnaire, est un groupe fasciste français et anticommuniste, qui exécute des assassinats, des bombardements, des sabotages d'armements et d'autres activités violentes pour créer l'instabilité politique. Avec l'aide du Mouvement Franciste et du personnel militaire, ils font aujourd'hui un coup d'Etat. La loi martiale a été déclarée et avec les changements en cours, tout ce qui vient après ne devrait pas être très différent."
 france.111.a:0 "L'Etat major donne les pleins pouvoirs à Pétain."
 france.111.b:0 "Le général Franchet d'Espèrey devrait diriger le pays."
 france.112.t:0 "Référendum nationaliste"
 france.112.d:0 "La popularité de la Croix-de-Feu s'est développée rapidement et maintenant de nombreux nationalistes prétendent représenter les souhaits du peuple. L'appel à un référendum a été demandé par le colonel François de la Rocque, qui veut refaire les élections législatives et former une coalition avec les conservateurs et les radicaux pour mettre fin à la crise politique. Le gouvernement impuissant et impopulaire doit accepter les revendications De la Rocque. Puis quelques jours plus tard, la coalition remporte la majorité au Parlement et peut constituer un nouveau gouvernement."
 france.112.a:0 "Le nouveau gouvernement appelle Pétain à diriger le pays."
 france.113.t:0 "La France exige la Wallonie"
 france.113.d:0 "La France a revendiqué la Wallonie et nous envoie un ultimatum. Ils prendront la province par la force si nous ne la leur donnons pas. "
 france.113.a:0 "Nous ne pouvons pas lutter contre eux."
 france.113.b:0 "Nous ne donnons jamais notre terre sans combattre!"
 france.114.t:0 "La Belgique accepte"
 france.114.d:0 "La Belgique a cédé à notre demande et nous a donné la Wallonie."
 france.114.a:0 "Les Wallons sont français maintenant."
 france.115.t:0 "La Belgique refuse"
 france.115.d:0 "La Belgique refuse de céder à notre demande et est prête à se battre."
 france.115.a:0 "Ils connaissent les conséquences."
 france.116.t:0 "Diviser la Suisse"
 france.116.d:0 "La France a un plan pour diviser la Suisse en deux, où nous obtiendrons la partie Est. Devrions-nous accepter cela?"
 france.116.a:0 "Oui, nous devons rayer ce pays de la carte!"
 france.116.b:0 "Non, ce n'est pas le bon moment pour ça."
 france.117.t:0 "L'Allemagne accepte"
 france.117.d:0 "Hitler accepte votre projet de diviser la Suisse en deux, prétendant que l'Europe est maintenant régie par les Français et les Allemands!"
 france.117.a:0 "Merci à vos nouveaux amis, l'Europe sera votre!"
 france.118.t:0 "L'Allemagne refuse"
 france.118.d:0 "Hitler refuse votre plan de scission de la Suisse en deux, prétendant que la situation politique mondiale n'est pas prête pour cela."
 france.118.a:0 "C'est une terrible erreur."
 france.119.t:0 "Petain retourne au gouvernement"
 france.119.d:0 "La Seconde Guerre mondiale a commencé et Pétain a déjà refusé plusieurs offres pour rejoindre le gouvernement. Il est critique contre le parlement et le mauvais état de la préparation des armes françaises et les réductions des budgets militaires de l'entre-deux-guerres. En temps de guerre, la grande réputation de Pétain comme le plus ancien soldat de France après la mort de Foch et comme le plus humain de nos commandants militaires, nous devrions le réclamer à nouveau pour rejoindre notre gouvernement."
 france.119.a:0 "Pétain unira le pays"
 france.120.t:0 "L'inflation diminue"
 france.120.d:0 "Avec la guerre actuelle et les mesures radicales prises par le gouvernement, l'hyperinflation a diminué et maintenant le franc est stable."
 france.120.a:0 "Cela renforcera nos positions"
 france.121.t:0 "L'Union sacrée"
 france.121.d:0 "L'Union sacrée a été une trêve politique en France pendant la Première Guerre mondiale pour unir le gouvernement et créer la solidarité en temps de guerre. En ces temps difficiles, le gouvernement a annoncé avoir un accord avec les différents mouvements politiques. Ils mettent de côté leur différend et se battent pour l'avenir de la France."
 france.121.a:0 "Vive la France!"
 france.122.t:0 "Le cabinet démissione"
 france.122.d:0 "La Chambre des Députés a élu Reynaud premier Ministre, mais avec un seul vote de départage, la plupart des membres de son parti s'étant abstenu. Le nouveau gouvernement est loin d'être stable; beaucoup de politiques de Droite demande que Reynaud attaque l'Union Soviétique, pas l'Allemagne. La Chambre a aussi forcé Daladier, que Reynaud tenait personnellement responsable de la faiblesse de la France, d'être le Ministre de la Guerre et de la Défense."
 france.122.a:0 "Paul Reynaud dirigera le nouveau gouvernement."
 france.123.t:0 "Restoration de la Monarchie"
 france.123.d:0 "Aujourd'hui le Pape Pie XI a intronisé Jean d'Orléans comme Roi du Royaume de France. Le nouveau dirigeant a annoncé qu'il guiderai le pays dans ces temps incertains."
 france.123.a:0 "Vive le Roi!"
 france.123.b:0 "Gardons Charles Maurras à la tête du pays."
 france.124.t:0 "Invitation dans la faction française"
 france.124.d:0 "Dans l'effort de consolider une alliance et de contenir une possible expension aggressif de la part des anciennes puissances d'Europe Central, la France a demandé que nous les rejoignons pour assurer notre sécurité."
 france.124.a:0 "Acceptons dans notre interêt."
 france.124.b:0 "Nous pouvons nous défendre seul."
 france.125.t:0 "[From.GetName] rejoint la faction française"
 france.125.d:0 "Notre plan pour stopper l'influence de l'Allemagne en Europe avance. [From.GetLeader] accepte notre invitation et rejoint l'alliance."
 france.125.a:0 "Notre alliance deviens plus forte."
 france.126.t:0 "[From.GetName] refuse de rejoindre l'alliance"
 france.126.d:0 "Malgré tous nos efforts pour offrir notre soutien, notre plus récente tentative d'inviter une des nations a été accueillie avec scepticisme. [From.GetLeader] a refusé notre invitation et préfère rester neutre."
 france.126.a:0 "Ils seront bientôt la cible de grandes puissances."
 france.127.t:0 "Destin du Benelux"
 france.127.d:0 "Avec l'annexation de la Wallonie, il y a un brèche dans nos défenses à la frontières de l'Allemagne. Pour nous protéger contre le Reich, nous devons persuader la Belgique et le Luxembourg de rentrer dans notre giron."
 france.127.a:0 "Le nord-est est maintenant sécurisé."
 france.128.t:0 "Coup d'Etat Communiste"
 france.128.d:0 "Alors que le mouvement populaire qui fait l'éloge d'une révolution communiste est en marche, certains membres du mouvement politique se taisent et attendent. Elle touche à sa fin. Aujourd'hui, alors que la tête du [Root.GetRulingParty] et l'armée initiaient une révolte à l'échelle nationale, un certain nombre d'officiels du gouvernement [Root.GetAdjective] ont appréhendé [Root.GetLeader] et entamé des négociations avec les rebelles.\n\nSous prétexte de vouloir maintenir l'ordre, les négociations ont tourné autour de la manière de sécuriser les positions du nouvel État socialiste pour ceux qui ont choisi de coopérer. Le coup d'État s'est terminé avant que quiconque ne tente de s'y opposer et ceux qui auraient pu le faire ont été emprisonnés, condamnés à l'exil ou exécutés par le nouveau régime."
 france.128.a:0 "Un vrai communisme est nécessaire pour survivre."
 france.128.b:0 "La CGT dirigera le pays."
 france.128.c:0 "La France ne sera pas une marionette des soviétiques!"
 france.129.t:0 "Accord de Coopération Economique"
 france.129.d:0 "Pour assurer une parfaite coopération militaire, nous devons définir quelques accords économiques et logistiques avec le Royaume-Uni. Maintenant que le traité est signé, quelle devrait être la priorité des Alliées?"
 france.129.a:0 "Partager les nouvelles technologies électroniques et industriels"
 france.129.b:0 "Coordonner notre logistic militaire et nos plans"
 france.129.c:0 "Prendre une sanction économique contre l'Allemagne"
 france.130.t:0 "Nommer un concepteur de materiels"
 france.130.d:0 "Pour satisfaire la demande en équipement de notre armée, nous pouvons engager un concepteur de materiels. Lequel devons-nous choisir?"
 france.130.a:0 "MAB"
 france.130.b:0 "APX"
 france.130.c:0 "De Dion-Bouton"
 france.130.e:0 "Garder cette option pour plus tard"
 france.131.t:0 "Engager un concepteur de chars"
 france.131.d:0 "Pour satisfaire la demande en équipement de notre armée, nous pouvons engager un concepteur de chars. Lequel devons-nous choisir?"
 france.131.a:0 "Lorraine-Dietrich"
 france.131.b:0 "Berlier"
 france.131.c:0 "Delaunay-Belleville"
 france.131.e:0 "Garder cette option pour plus tard"
 france.133.t:0 "Ultimatum des Français"
 france.133.d:0 "La France fait pression pour que nous signions un « traité d'assistance mutuelle » qui les autoriserait à positionner des forces sur notre territoire. Il s'agit là d'une tentative à peine masquée d'annexer notre pays, mais nous ne sommes pas vraiment en mesure de résister aux forces postées à la frontière."
 france.133.a:0 "Nous devons accepter l'inévitable..."
 france.133.b:0 "S'ils veulent s'emparer de notre pays,\nils devront recourir à la force !"
 france.134.t:0 "Soumission du Luxembourg"
 france.134.d:0 "Le Luxembourg a cédé à nos demandes. Nous avons remplacé leur gouvernement actuel par un anti-allemand, loyal à notre cause."
 france.134.a:0 "Ils sont à l'abri de l'Allemagne."
 france.135.t:0 "Le Luxembourg refuse notre offre"
 france.135.d:0 "Le Luxembourg a effrontément refusé notre généreuse proposition de traité d'assistance mutuelle contre l'Allemagne! Nous devons les aligner par la force le plus vite possible!"
 france.135.a:0 "Nous devons protéger les luxembourgeois de l'Allemagne."
 france.136.t:0 "Ultimatum des Français"
 france.136.d:0 "La France fait pression pour que nous signions un « traité d'assistance mutuelle » qui les autoriserait à positionner des forces sur notre territoire. Il s'agit là d'une tentative à peine masquée d'annexer notre pays, mais nous ne sommes pas vraiment en mesure de résister aux forces postées à la frontière."
 france.136.a:0 "Nous devons accepter l'inévitable..."
 france.136.b:0 "S'ils veulent s'emparer de notre pays,\nils devront recourir à la force !"
 france.137.t:0 "Soumission de la Belgique"
 france.137.d:0 "La Belgique a cédé à nos demandes. Nous avons remplacé leur gouvernement actuel par un anti-allemand, loyal à notre cause."
 france.137.a:0 "Ils sont à l'abri de l'Allemagne."
 france.138.t:0 "La Belgique refuse notre offre"
 france.138.d:0 "La Belgique a effrontément refusé notre généreuse proposition de traité d'assistance mutuelle contre l'Allemagne! Nous devons les aligner par la force le plus vite possible!"
 france.138.a:0 "Nous devons protéger les belges de l'Allemagne."
 france.139.t:0 "Ultimatum des Français"
 france.139.d:0 "La France fait pression pour que nous signions un « traité d'assistance mutuelle » qui les autoriserait à positionner des forces sur notre territoire. Il s'agit là d'une tentative à peine masquée d'annexer notre pays, mais nous ne sommes pas vraiment en mesure de résister aux forces postées à la frontière."
 france.139.a:0 "Nous devons accepter l'inévitable..."
 france.139.b:0 "S'ils veulent s'emparer de notre pays,\nils devront recourir à la force !"
 france.140.t:0 "Soumission des Pays-bas"
 france.140.d:0 "Les Pays-bas ont cédé à nos demandes. Nous avons remplacé leur gouvernement actuel par un anti-allemand, loyal à notre cause."
 france.140.a:0 "Ils sont à l'abri de l'Allemagne."
 france.141.t:0 "Les Pays-bas refusent notre offre"
 france.141.d:0 "Les Pays-bas ont effrontément refusé notre généreuse proposition de traité d'assistance mutuelle contre l'Allemagne! Nous devons les aligner par la force le plus vite possible!"
 france.141.a:0 "Nous devons protéger les hollandais de l'Allemagne."
 france.142.t:0 "Offre de protectorat français"
 france.142.d:0 "La France fait pression pour que nous signions un « traité de protectorat » qui les autoriserait à positionner des forces sur notre territoire. Il s'agit là d'une tentative à peine masquée d'annexer notre pays, mais nous ne sommes pas vraiment en mesure de résister aux forces postées à la frontière."
 france.142.a:0 "Nous devons accepter l'inévitable..."
 france.142.b:0 "S'ils veulent s'emparer de notre pays,\nils devront recourir à la force !"
 france.143.t:0 "Soumission d'Haïti"
 france.143.d:0 "Haïti ont cédé à nos demandes. Nous avons remplacé leur gouvernement actuel par un pro-français, loyal à notre cause."
 france.143.a:0 "Comme cela devrait l'être."
 france.144.t:0 "Haïti refusent notre offre"
 france.144.d:0 "Haïti ont effrontément refusé notre généreuse proposition de protectorat! Nous devons les aligner par la force le plus vite possible!"
 france.144.a:0 "Nous devons conquerir Haïti!"
 france.145.t:0 "La France exige la Catalogne"
 france.145.d:0 "La France a revendiqué la Catalogne et nous envoie un ultimatum. Ils prendront la province par la force si nous ne la leur donnons pas. "
 france.145.a:0 "Nous ne pouvons pas lutter contre eux."
 france.145.b:0 "Nous ne donnons jamais notre terre sans combattre!"
 france.146.t:0 "L'Espagne accepte"
 france.146.d:0 "L'Espagne a cédé à notre demande et nous a donné la Catalogne."
 france.146.a:0 "Les Catalans sont français maintenant."
 france.147.t:0 "L'Espagne refuse"
 france.147.d:0 "L'Espagne refuse de céder à notre demande et est prête à se battre."
 france.147.a:0 "Ils connaissent les conséquences."
 france.148.t:0 "Restoration de l'Empire"
 france.148.d:0 "Aujourd'hui le Pape Pie XI a intronisé Napoléon VI comme Empereur de France. Le nouveau dirigeant a annoncé qu'il guiderai le pays dans ces temps incertains."
 france.148.a:0 "Vive l'Empereur!"
 france.149.t:0 "Mort de Jean d'Orléans"
 france.149.d:0 "La nuit dernière, notre bien-aimé Roi Jean d'Orléans est mort paisiblement, dans son sommeil. En dépit de son long exil, la providence a veillé à ce qu'il puisse revenir dans sa patrie longtemps avant sa mort, et son retour a depuis lors permis le bonheur de la nation.\n\nSon fils Henri d'Orléans a repris les rênes du pays, et après son couronnement sera connu sous le nom de Henri VI."
 france.149.a:0 "Le roi est mort, vive le roi !"
 france.150.t:0 "Union française offerte"
 france.150.d:0 "La France fait pression pour que nous signions un « traité d'union » qui les autoriserait à positionner des forces sur notre territoire. Il s'agit là d'une tentative à peine masquée d'annexer notre pays, mais nous ne sommes pas vraiment en mesure de résister aux forces postées à la frontière."
 france.150.a:0 "Nous devons accepter l'inévitable..."
 france.150.b:0 "S'ils veulent s'emparer de notre pays,\nils devront recourir à la force !"
 france.151.t:0 "L'Espagne accepte"
 france.151.d:0 "L'Espagne ont accepté nos demandes. Nous avons remplacé leur gouvernement actuel par un pro-français, loyal à notre cause."
 france.151.a:0 "Vive le Roi!"
 france.152.t:0 "L'Espagne refuse l'Union"
 france.152.d:0 "L'Espagne ont effrontément refusé notre généreuse proposition de protectorat! Nous devons les aligner par la force le plus vite possible!"
 france.152.a:0 "Nous devons reprendre la terre du Roi!"
 france.153.t:0 "Restoration de la Monarchie"
 france.153.d:0 "Aujourd'hui le Pape Pie XI a intronisé Alphonse XIII comme Roi du Royaume de France. Le nouveau dirigeant a annoncé qu'il guiderai le pays dans ces temps incertains."
 france.153.a:0 "Vive le Roi!"
 france.153.b:0 "Gardons Charles Maurras à la tête du pays."
 
