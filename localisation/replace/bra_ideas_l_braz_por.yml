 bra_1930_2: "A Revolução de 1930"
 bra_instabilidade: "Partidarismo"
 bra_instabilidade_desc: "Desde a fundação do Brasil em 7 de Setembro de 1822 o direito de decisão política sempre esteve nas mãos dos grandes latifundiários, influentes comerciantes e políticos da alta sociedade. Apenas recentemente, com a introdução da Constituição de 1934, que os Brasileiros das Médias e Baixas camadas da sociedade possuem a oportunidade de fazerem suas vozes ouvidas. Essa ruptura bruta com a velha ordem resultou na divisão absoluta e radical das opiniões públicas entre a ANL, as forças que eventualmente organizariam a UDN, a AIB e os apoiadores do Estado Novo."
 bra_instabilidade_2: "Partidarismo"
 bra_instabilidade_2_desc: "Desde a fundação do Brasil em 7 de Setembro de 1822 o direito de decisão política sempre esteve nas mãos dos grandes latifundiários, influentes comerciantes e políticos da alta sociedade. Apenas recentemente, com a introdução da Constituição de 1934, que os Brasileiros das Médias e Baixas camadas da sociedade possuem a oportunidade de fazerem suas vozes ouvidas. Essa ruptura bruta com a velha ordem resultou na divisão absoluta e radical das opiniões públicas entre a ANL, as forças que eventualmente organizariam a UDN, a AIB e os apoiadores do Estado Novo."
 #bra_campinas: "Os Bombardeios de Campinas em 1932"
 #bra_campinas_desc: "A destruição da maioria da infraestrutura e dos distritos industriais de Campinas durante o Bombardeio Legalista de 1932 deixou sequelas nos industriais brasileiros que permanecem até hoje. No entanto, o espírito de reeconstrução da cidade espalhou pelo país."
 bra_1930_desc: "Em 1930 as elites da República Velha foram expulsas do poder pelos Tenentistas de Vargas. O Golpe e a subsequênte constituição foram o que iniciou a Guerra Civil de 1932. Tenha sido o Golpe de Getúlio por bem ou mal, ele ainda divide as opiniões de muitos brasileiros até hoje."
 bra_1930_2_desc: "Em 1930 as elites da República Velha foram expulsas do poder pelos Tenentistas de Vargas. O Golpe e a subsequênte constituição foram o que iniciou a Guerra Civil de 1932. Tenha sido o Golpe de Getúlio por bem ou mal, ele ainda divide as opiniões de muitos brasileiros até hoje."
 bra_eficiencia_1: "Conselhos Industriais"
 bra_eficiencia_1_desc: "Nós temos conselhos de Magnatas da Manufatura da República Velha nos auxiliando em nossas decisões econômicas"
 bra_eficiencia_2: "Tecnicos Industrais"
 bra_eficiencia_2_desc: "Nós temos economistas e técnicos especializados ajudando-nos à planejar nossa expansão industrial."
 bra_eficiencia_3: "Empresários Industriais"
 bra_eficiencia_3_desc: "Nós temos magnatas industriais estrangeiros e lideres da industria nacional administrando a funcionalidade, eficiência e organização da industria nacional."
 bra_eficiencia_4: "Redes Industriais"
 bra_eficiencia_4_desc: "Nós temos grupos nacionais inteiros, sociedades anônimas e organizações comandando nossa máquina de guerra e industria civil."
 bra_eficiencia_bndes: "Nacional-Desenvolvimentismo"
 bra_eficiencia_bndes_desc: "O projeto nacional-desenvolvimentista carrega consigo a grande esperança de extensão ampla dos benefícios econômicos, políticos e sociais da modernidade a toda a sociedade brasileira. A dualidade será superada pela industrialização, e esta será consequência do desenvolvimento, isto é, da acumulação de capital e da incorporação de progresso técnico."
 bra_eficiencia_gerdau_1: "Nacional-Desenvolvimentismo"
 bra_eficiencia_gerdau_1_desc: "O projeto nacional-desenvolvimentista carrega consigo a grande esperança de extensão ampla dos benefícios econômicos, políticos e sociais da modernidade a toda a sociedade brasileira. A dualidade será superada pela industrialização, e esta será consequência do desenvolvimento, isto é, da acumulação de capital e da incorporação de progresso técnico.""
 bra_eficiencia_gerdau_2: "O Milagre Econômico Brasileiro"
 bra_eficiencia_gerdau_2_desc: "A consolidação das nossas indústrias de base, a organização de um mercado consumidor nacional forte, a abundância de um operariado técnico e a urbanização consequente da mecanização do campo tornaram o crescimento da economia federal irrefreável. Fato é que, agora, ninguém segura este país."
 bra_eficiencia_tenenge_1: "Nacional-Desenvolvimentismo"
 bra_eficiencia_tenenge_1_desc: "O projeto nacional-desenvolvimentista carrega consigo a grande esperança de extensão ampla dos benefícios econômicos, políticos e sociais da modernidade a toda a sociedade brasileira. A dualidade será superada pela industrialização, e esta será consequência do desenvolvimento, isto é, da acumulação de capital e da incorporação de progresso técnico."
 bra_eficiencia_tenenge_2: "O Milagre Econômico Brasileiro"
 bra_eficiencia_tenenge_2_desc: "A consolidação das nossas indústrias de base, a organização de um mercado consumidor nacional forte, a abundância de um operariado técnico e a urbanização consequente da mecanização do campo tornaram o crescimento da economia federal irrefreável. Fato é que, agora, ninguém segura este país."
 bra_eficiencia_5: "Matriz Elétrica Modernizada"
 bra_eficiencia_5_desc: "Instalamos uma rede elétrica modernizada, eficiente e organizada em nossos grandes centros metropolitanos."
 #bra_eficiencia_6: "Rede Elétrica Expandida"
 #bra_eficiencia_6_desc: "Expandimos nossa rede elétrica para as áreas rurais do nosso país."
 bra_eficiencia_7: "Matriz Elétrica Modernizada"
 bra_eficiencia_7_desc: "Nossa rede elétrica nacional está agora completamente modernizada e expandida para as áreas do país que dela necessitam."
 bra_eficiencia_8: "Brasil: Ame-o ou Deixe-o"
 bra_eficiencia_8_desc: "Com nossa industria expandida, reorganizada e modernizada, nós temos à capacidade de guerrear."
